<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sistema de Evaluación · Acurio Restaurantes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#eef0f3;
    --surface:#ffffff;
    --surface-2:#f5f6f8;
    --ink:#101827;
    --muted:#5b6472;
    --border:#d7dbe2;
    --accent:#1b3a5c;
    --accent-soft:rgba(27,58,92,0.08);
    --danger:#b23a3a;
    --danger-soft:rgba(178,58,58,0.09);
    --success:#1f7a4d;
    --success-soft:rgba(31,122,77,0.09);
    --radius:6px;
    --font-serif:'Source Serif 4', serif;
    --font-sans:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html{ font-size:16px; }
  body{
    font-family:var(--font-sans);
    background:var(--bg);
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 16px;
    line-height:1.5;
  }
  .shell{ width:100%; max-width:520px; }
  .masthead{ text-align:center; margin-bottom:28px; }
  .masthead h1{
    font-family:var(--font-serif); font-weight:600; font-size:26px;
    color:var(--ink); letter-spacing:.005em;
  }
  .masthead p{ color:var(--muted); font-size:14px; margin-top:6px; }

  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:36px 32px;
  }
  .view{ display:none; }
  .view.active{ display:block; }

  label{ display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .field{ margin-bottom:18px; }
  .field small{ display:block; color:var(--muted); font-size:12px; margin-top:5px; }
  input[type="text"], select, textarea{
    width:100%; font-family:var(--font-sans); font-size:15px;
    padding:11px 13px; border:1px solid var(--border); border-radius:4px;
    background:var(--surface-2); color:var(--ink); outline:none;
    transition:border-color .15s;
  }
  input[type="text"]:focus, select:focus, textarea:focus{ border-color:var(--accent); background:var(--surface); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px; border:none; border-radius:4px;
    font-family:var(--font-sans); font-size:15px; font-weight:600;
    cursor:pointer; transition:opacity .15s;
  }
  .btn:hover{ opacity:.9; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-secondary{ background:var(--surface-2); color:var(--ink); border:1px solid var(--border); }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); border:1px solid rgba(178,58,58,.3); }
  .btn-sm{ width:auto; padding:8px 14px; font-size:13px; }

  .link-row{ text-align:center; margin-top:22px; font-size:13px; }
  .link-row a{ color:var(--muted); text-decoration:underline; cursor:pointer; }
  .link-row a:hover{ color:var(--ink); }

  .error-text{ color:var(--danger); font-size:13px; margin-top:10px; min-height:16px; }

  /* ── ADMIN ── */
  .admin-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px; }
  .admin-header h2{ font-family:var(--font-serif); font-size:20px; font-weight:600; }
  .q-list{ display:flex; flex-direction:column; gap:10px; margin-top:18px; margin-bottom:26px; }
  .q-item{
    border:1px solid var(--border); border-radius:4px; padding:14px 16px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
    background:var(--surface-2);
  }
  .q-item .q-text{ font-size:14px; color:var(--ink); font-weight:500; }
  .q-item .q-meta{ font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:5px; }
  .q-item .q-actions{ display:flex; gap:8px; flex-shrink:0; }
  .q-item .q-actions button{
    background:none; border:none; cursor:pointer; font-size:12px;
    color:var(--muted); text-decoration:underline; padding:2px;
  }
  .q-item .q-actions button:hover{ color:var(--ink); }
  .empty-note{
    border:1px dashed var(--border); border-radius:4px; padding:22px;
    text-align:center; color:var(--muted); font-size:13px; margin-top:18px;
  }

  .option-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .option-row input[type="text"]{ flex:1; }
  .option-row input[type="radio"]{ width:18px; height:18px; accent-color:var(--accent); flex-shrink:0; }
  .option-row button{
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; flex-shrink:0;
  }
  .option-row button:hover{ color:var(--danger); }
  .add-option-btn{
    font-size:13px; color:var(--accent); background:none; border:none; cursor:pointer;
    text-decoration:underline; margin-bottom:18px; padding:0;
  }

  hr.sep{ border:none; border-top:1px solid var(--border); margin:26px 0; }

  /* ── EVAL ── */
  .eval-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .eval-progress{ font-family:var(--font-mono); font-size:12px; color:var(--muted); }
  .eval-timer{ font-family:var(--font-mono); font-size:14px; font-weight:600; color:var(--ink); }
  .eval-timer.urgent{ color:var(--danger); }
  .timer-track{ height:3px; background:var(--border); border-radius:2px; overflow:hidden; margin-bottom:26px; }
  .timer-fill{ height:100%; background:var(--accent); width:100%; transition:width .2s linear; }
  .timer-fill.urgent{ background:var(--danger); }

  .eval-local{ font-size:12px; color:var(--muted); margin-bottom:22px; font-family:var(--font-mono); }
  .q-title{ font-family:var(--font-serif); font-size:19px; font-weight:600; line-height:1.4; margin-bottom:24px; }

  .opt-btn{
    width:100%; text-align:left; padding:13px 16px; margin-bottom:10px;
    border:1px solid var(--border); border-radius:4px; background:var(--surface);
    font-family:var(--font-sans); font-size:14.5px; color:var(--ink);
    cursor:pointer; transition:border-color .15s, background .15s;
  }
  .opt-btn:hover:not(:disabled){ border-color:var(--accent); background:var(--accent-soft); }
  .opt-btn:disabled{ cursor:default; }
  .opt-btn.correct{ border-color:var(--success); background:var(--success-soft); color:var(--success); font-weight:600; }
  .opt-btn.wrong{ border-color:var(--danger); background:var(--danger-soft); color:var(--danger); font-weight:600; }

  /* ── RESULT ── */
  .result-badge{
    width:100%; text-align:center; padding:28px 0 24px; border-bottom:1px solid var(--border); margin-bottom:24px;
  }
  .result-score{ font-family:var(--font-serif); font-size:48px; font-weight:700; }
  .result-score.pass{ color:var(--success); }
  .result-score.fail{ color:var(--danger); }
  .result-status{ font-size:15px; font-weight:600; margin-top:4px; }
  .result-status.pass{ color:var(--success); }
  .result-status.fail{ color:var(--danger); }
  .result-grid{ display:flex; flex-direction:column; gap:10px; font-size:14px; margin-bottom:26px; }
  .result-grid div{ display:flex; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:8px; }
  .result-grid span:first-child{ color:var(--muted); }
  .save-note{ font-size:12px; color:var(--muted); text-align:center; margin-top:14px; }

  .status-line{ text-align:center; margin-top:18px; font-size:11px; color:var(--muted); font-family:var(--font-mono); }
  .status-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--muted); margin-right:6px; }
  .status-dot.connected{ background:var(--success); }
  .status-dot.error{ background:var(--danger); }
</style>
</head>
<body>

<div class="shell">
  <div class="masthead">
    <h1>Evaluación de Desempeño</h1>
    <p>Grupo Acurio Restaurantes</p>
  </div>

  <div class="card">

    <!-- ═══════════ LOGIN ═══════════ -->
    <section class="view active" id="view-login">
      <div class="field">
        <label>Local</label>
        <select id="login-local">
          <option value="">— Seleccioná tu local —</option>
        </select>
      </div>
      <div class="field">
        <label>DNI</label>
        <input type="text" id="login-dni" placeholder="Ej: 38123456" maxlength="10" inputmode="numeric">
      </div>
      <button class="btn btn-primary" onclick="Eval.start()">Iniciar evaluación</button>
      <div class="error-text" id="login-error"></div>

      <div class="link-row"><a onclick="Admin.open()">Administrar banco de preguntas</a></div>
    </section>

    <!-- ═══════════ ADMIN ═══════════ -->
    <section class="view" id="view-admin">
      <div class="admin-header">
        <h2>Banco de preguntas</h2>
        <button class="btn btn-secondary btn-sm" onclick="Admin.close()">Volver</button>
      </div>

      <div class="field">
        <label>Local</label>
        <select id="admin-local" onchange="Admin.loadList()"></select>
      </div>

      <div class="q-list" id="admin-q-list"></div>

      <hr class="sep">

      <h2 style="font-family:var(--font-serif); font-size:16px; font-weight:600; margin-bottom:16px;" id="admin-form-title">Agregar pregunta</h2>

      <div class="field">
        <label>Tipo de pregunta</label>
        <select id="admin-q-tipo" onchange="Admin.toggleTipo()">
          <option value="mc">Opción múltiple (2 min)</option>
          <option value="desarrollo">Desarrollo (20 min)</option>
        </select>
      </div>

      <div class="field">
        <label>Enunciado</label>
        <textarea id="admin-q-text" rows="2" placeholder="Escribí la pregunta"></textarea>
      </div>

      <div id="admin-options-wrap">
        <label>Opciones (marcá la correcta)</label>
        <div id="admin-options"></div>
        <button class="add-option-btn" onclick="Admin.addOptionRow()">+ Agregar opción</button>
      </div>

      <div class="field">
        <label>Explicación (opcional, se muestra si responde mal)</label>
        <textarea id="admin-q-expl" rows="2" placeholder="Opcional"></textarea>
      </div>

      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary" onclick="Admin.saveQuestion()" id="admin-save-btn">Guardar pregunta</button>
        <button class="btn btn-secondary" style="display:none;" id="admin-cancel-edit" onclick="Admin.cancelEdit()">Cancelar</button>
      </div>
      <div class="error-text" id="admin-error"></div>

      <hr class="sep">
      <button class="btn btn-secondary" onclick="Admin.seedTanta()">Cargar banco por defecto de Tanta (31 preguntas)</button>
    </section>

    <!-- ═══════════ EVALUACIÓN ═══════════ -->
    <section class="view" id="view-eval">
      <div class="eval-local" id="eval-local-label"></div>
      <div class="eval-top">
        <span class="eval-progress" id="eval-progress"></span>
        <span class="eval-timer" id="eval-timer">60s</span>
      </div>
      <div class="timer-track"><div class="timer-fill" id="eval-timer-fill"></div></div>
      <div class="q-title" id="eval-q-title"></div>
      <div id="eval-options"></div>
      <div id="eval-dev-wrap" style="display:none;">
        <textarea id="eval-dev-answer" rows="8" placeholder="Escribí tu respuesta acá…"></textarea>
        <button class="btn btn-primary" style="margin-top:12px;" onclick="Eval.submitDev()">Continuar</button>
      </div>
    </section>

    <!-- ═══════════ RESULTADO ═══════════ -->
    <section class="view" id="view-result">
      <div class="result-badge">
        <div class="result-score" id="result-score">0/0</div>
        <div class="result-status" id="result-status">—</div>
      </div>
      <div class="result-grid">
        <div><span>Local</span><span id="result-local"></span></div>
        <div><span>DNI</span><span id="result-dni"></span></div>
        <div><span>Porcentaje</span><span id="result-pct"></span></div>
        <div><span>Fecha</span><span id="result-date"></span></div>
      </div>
      <button class="btn btn-primary" onclick="Eval.reset()">Realizar otra evaluación</button>
      <div class="save-note" id="result-save-note">Guardando resultado…</div>
    </section>

  </div>

  <div class="status-line"><span class="status-dot" id="fb-dot"></span><span id="fb-status">Verificando conexión…</span></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  FIREBASE CONFIG ← REEMPLAZÁ ESTOS VALORES CON LOS TUYOS
// ══════════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "TU_API_KEY",
  authDomain:        "TU_PROJECT.firebaseapp.com",
  projectId:         "TU_PROJECT_ID",
  storageBucket:     "TU_PROJECT.appspot.com",
  messagingSenderId: "TU_SENDER_ID",
  appId:             "TU_APP_ID"
};

let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch(e) {
  console.warn('Firebase init error (usá tu propia config, modo demo activado):', e.message);
}

function checkFirebase(){
  const dot = document.getElementById('fb-dot');
  const status = document.getElementById('fb-status');
  if (!db) { dot.className = 'status-dot error'; status.textContent = 'Firebase no configurado · Modo demo (datos locales)'; return; }
  db.collection('_ping').limit(1).get()
    .then(() => { dot.className = 'status-dot connected'; status.textContent = 'Conectado a Firebase'; })
    .catch(() => { dot.className = 'status-dot error'; status.textContent = 'Error al conectar con Firebase · Modo demo'; });
}
checkFirebase();

// ══════════════════════════════════════════════════════════════
//  LOCALES
// ══════════════════════════════════════════════════════════════
const LOCALES = [
  { id:'tanta', name:'Tanta' },
  { id:'lamar', name:'La Mar' },
  { id:'bcp',   name:'BCP · Palermo' },
  { id:'bcb',   name:'BCB · Belgrano' },
  { id:'bcbl',  name:'BCBL · Bulnes' },
  { id:'bcc',   name:'BCC · San Telmo' },
];

function populateLocalSelects(){
  ['login-local','admin-local'].forEach(id => {
    const sel = document.getElementById(id);
    LOCALES.forEach(l => {
      const opt = document.createElement('option');
      opt.value = l.id; opt.textContent = l.name;
      sel.appendChild(opt);
    });
  });
}
function localName(id){ const l = LOCALES.find(x=>x.id===id); return l ? l.name : id; }

function showView(id){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ══════════════════════════════════════════════════════════════
//  PERSISTENCIA DE PREGUNTAS (Firestore con fallback localStorage)
// ══════════════════════════════════════════════════════════════
const Bank = {
  async get(local){
    if (db) {
      try {
        const doc = await db.collection('evaluaciones_preguntas').doc(local).get();
        return doc.exists ? (doc.data().preguntas || []) : [];
      } catch(e){ console.warn('Error leyendo banco de Firestore, uso localStorage', e); }
    }
    try { return JSON.parse(localStorage.getItem('eval_bank_' + local)) || []; } catch { return []; }
  },
  async set(local, preguntas){
    if (db) {
      try {
        await db.collection('evaluaciones_preguntas').doc(local).set({ preguntas, actualizado: Date.now() });
        return;
      } catch(e){ console.warn('Error guardando banco en Firestore, uso localStorage', e); }
    }
    try { localStorage.setItem('eval_bank_' + local, JSON.stringify(preguntas)); } catch {}
  }
};

const Results = {
  async save(result){
    if (db) {
      try { await db.collection('evaluaciones_resultados').add(result); return true; }
      catch(e){ console.warn('Error guardando resultado en Firestore, uso localStorage', e); }
    }
    try {
      const all = JSON.parse(localStorage.getItem('eval_resultados')) || [];
      all.push(result);
      localStorage.setItem('eval_resultados', JSON.stringify(all));
      return true;
    } catch { return false; }
  }
};

// ══════════════════════════════════════════════════════════════
//  BANCO POR DEFECTO — TANTA
// ══════════════════════════════════════════════════════════════
function mkMc(texto, opciones, correcta, explicacion=''){
  return { id:'tanta_'+Math.random().toString(36).slice(2,9), tipo:'mc', texto, opciones, correcta, explicacion };
}
function mkDev(texto, explicacion=''){
  return { id:'tanta_'+Math.random().toString(36).slice(2,9), tipo:'desarrollo', texto, opciones:[], correcta:null, explicacion };
}

// ══════════════════════════════════════════════════════════════
//  ADMIN — gestión del banco de preguntas
// ══════════════════════════════════════════════════════════════
const Admin = {
  editingId: null,
  currentQuestions: [],

  open(){
    showView('view-admin');
    this.resetForm();
    this.loadList();
  },
  close(){ showView('view-login'); },

  addOptionRow(text = '', checked = false){
    const wrap = document.getElementById('admin-options');
    const rows = wrap.querySelectorAll('.option-row').length;
    if (rows >= 6) return;
    const row = document.createElement('div');
    row.className = 'option-row';
    row.innerHTML = `
      <input type="radio" name="admin-correct" ${checked ? 'checked' : ''}>
      <input type="text" placeholder="Opción" value="${escapeHtml(text)}">
      <button type="button" onclick="Admin.removeOptionRow(this)" title="Quitar">✕</button>
    `;
    wrap.appendChild(row);
  },
  removeOptionRow(btn){
    const wrap = document.getElementById('admin-options');
    if (wrap.querySelectorAll('.option-row').length <= 2) return;
    btn.closest('.option-row').remove();
  },
  toggleTipo(){
    const tipo = document.getElementById('admin-q-tipo').value;
    document.getElementById('admin-options-wrap').style.display = (tipo === 'desarrollo') ? 'none' : 'block';
  },
  resetForm(){
    this.editingId = null;
    document.getElementById('admin-form-title').textContent = 'Agregar pregunta';
    document.getElementById('admin-q-tipo').value = 'mc';
    document.getElementById('admin-q-text').value = '';
    document.getElementById('admin-q-expl').value = '';
    document.getElementById('admin-options').innerHTML = '';
    document.getElementById('admin-error').textContent = '';
    document.getElementById('admin-cancel-edit').style.display = 'none';
    document.getElementById('admin-save-btn').textContent = 'Guardar pregunta';
    this.addOptionRow('', true);
    this.addOptionRow('', false);
    this.toggleTipo();
  },
  cancelEdit(){ this.resetForm(); },

  async seedTanta(){
    if (!confirm('Esto reemplaza el banco de preguntas de Tanta por las 31 preguntas por defecto. ¿Continuar?')) return;
    await Bank.set('tanta', SEED_TANTA);
    document.getElementById('admin-local').value = 'tanta';
    this.loadList();
  },

  async loadList(){
    const local = document.getElementById('admin-local').value;
    const listEl = document.getElementById('admin-q-list');
    listEl.innerHTML = '<div class="empty-note">Cargando…</div>';
    this.currentQuestions = await Bank.get(local);
    if (!this.currentQuestions.length) {
      listEl.innerHTML = '<div class="empty-note">Todavía no hay preguntas cargadas para este local.</div>';
      return;
    }
    listEl.innerHTML = '';
    this.currentQuestions.forEach(q => {
      const item = document.createElement('div');
      item.className = 'q-item';
      const meta = (q.tipo === 'desarrollo')
        ? 'Desarrollo · 20 min'
        : `Opción múltiple · ${q.opciones.length} opciones · 2 min`;
      item.innerHTML = `
        <div>
          <div class="q-text">${escapeHtml(q.texto)}</div>
          <div class="q-meta">${meta}</div>
        </div>
        <div class="q-actions">
          <button onclick="Admin.editQuestion('${q.id}')">Editar</button>
          <button onclick="Admin.deleteQuestion('${q.id}')">Eliminar</button>
        </div>`;
      listEl.appendChild(item);
    });
  },

  editQuestion(id){
    const q = this.currentQuestions.find(x => x.id === id);
    if (!q) return;
    this.editingId = id;
    document.getElementById('admin-form-title').textContent = 'Editar pregunta';
    document.getElementById('admin-q-tipo').value = q.tipo || 'mc';
    document.getElementById('admin-q-text').value = q.texto;
    document.getElementById('admin-q-expl').value = q.explicacion || '';
    document.getElementById('admin-options').innerHTML = '';
    (q.opciones || []).forEach((op, i) => this.addOptionRow(op, i === q.correcta));
    if (!(q.opciones || []).length) { this.addOptionRow('', true); this.addOptionRow('', false); }
    this.toggleTipo();
    document.getElementById('admin-cancel-edit').style.display = 'inline-flex';
    document.getElementById('admin-save-btn').textContent = 'Actualizar pregunta';
    document.getElementById('admin-error').textContent = '';
    window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' });
  },

  async deleteQuestion(id){
    if (!confirm('¿Eliminar esta pregunta del banco?')) return;
    const local = document.getElementById('admin-local').value;
    const updated = this.currentQuestions.filter(x => x.id !== id);
    await Bank.set(local, updated);
    this.loadList();
  },

  async saveQuestion(){
    const local = document.getElementById('admin-local').value;
    const errEl = document.getElementById('admin-error');
    errEl.textContent = '';

    if (!local) { errEl.textContent = 'Seleccioná un local.'; return; }
    const texto = document.getElementById('admin-q-text').value.trim();
    if (!texto) { errEl.textContent = 'Escribí el enunciado de la pregunta.'; return; }

    const tipo = document.getElementById('admin-q-tipo').value;
    let opciones = [], correctIdx = null;

    if (tipo === 'mc') {
      const rows = [...document.getElementById('admin-options').querySelectorAll('.option-row')];
      opciones = rows.map(r => r.querySelector('input[type="text"]').value.trim());
      if (opciones.some(o => !o)) { errEl.textContent = 'Completá el texto de todas las opciones.'; return; }
      correctIdx = rows.findIndex(r => r.querySelector('input[type="radio"]').checked);
      if (correctIdx === -1) { errEl.textContent = 'Marcá cuál es la opción correcta.'; return; }
    }

    const explicacion = document.getElementById('admin-q-expl').value.trim();

    let questions = await Bank.get(local);
    if (this.editingId) {
      questions = questions.map(q => q.id === this.editingId
        ? { ...q, tipo, texto, opciones, correcta: correctIdx, explicacion }
        : q);
    } else {
      questions.push({
        id: 'q_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        tipo, texto, opciones, correcta: correctIdx, explicacion
      });
    }
    await Bank.set(local, questions);
    this.resetForm();
    this.loadList();
  }
};

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

// ══════════════════════════════════════════════════════════════
//  EVALUACIÓN
// ══════════════════════════════════════════════════════════════
const TIME_MC = 120;   // 2 min — preguntas de opción múltiple
const TIME_DEV = 1200; // 20 min — preguntas de desarrollo
const PASS_THRESHOLD = 70; // % (sobre las preguntas de opción múltiple)

const Eval = {
  local: '', dni: '', questions: [], idx: 0, correctCount: 0, timerInt: null, timeLeft: 0, answered: false,

  async start(){
    const local = document.getElementById('login-local').value;
    const dni = document.getElementById('login-dni').value.trim();
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';

    if (!local) { errEl.textContent = 'Seleccioná tu local.'; return; }
    if (!dni) { errEl.textContent = 'Ingresá tu DNI.'; return; }

    const questions = await Bank.get(local);
    if (!questions.length) {
      errEl.textContent = 'No hay preguntas cargadas para este local. Consultá con el administrador.';
      return;
    }

    this.local = local; this.dni = dni;
    this.questions = questions;
    this.idx = 0; this.correctCount = 0;
    this.responses = [];

    document.getElementById('eval-local-label').textContent = localName(local) + ' · DNI ' + dni;
    showView('view-eval');
    this.renderQuestion();
  },

  renderQuestion(){
    this.answered = false;
    const q = this.questions[this.idx];
    document.getElementById('eval-progress').textContent = `Pregunta ${this.idx + 1} de ${this.questions.length}`;
    document.getElementById('eval-q-title').textContent = q.texto;

    const optsWrap = document.getElementById('eval-options');
    const devWrap = document.getElementById('eval-dev-wrap');
    optsWrap.innerHTML = '';

    if (q.tipo === 'desarrollo') {
      optsWrap.style.display = 'none';
      devWrap.style.display = 'block';
      document.getElementById('eval-dev-answer').value = '';
    } else {
      devWrap.style.display = 'none';
      optsWrap.style.display = 'block';
      q.opciones.forEach((op, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = op;
        btn.onclick = () => this.selectAnswer(i);
        optsWrap.appendChild(btn);
      });
    }

    this.startTimer();
  },

  startTimer(){
    clearInterval(this.timerInt);
    const q = this.questions[this.idx];
    const limit = (q.tipo === 'desarrollo') ? TIME_DEV : TIME_MC;
    this.timeLeft = limit;
    const timerEl = document.getElementById('eval-timer');
    const fillEl = document.getElementById('eval-timer-fill');
    timerEl.classList.remove('urgent'); fillEl.classList.remove('urgent');
    timerEl.textContent = this.formatTime(this.timeLeft);
    fillEl.style.width = '100%';

    this.timerInt = setInterval(() => {
      this.timeLeft--;
      timerEl.textContent = this.formatTime(Math.max(this.timeLeft,0));
      fillEl.style.width = (Math.max(this.timeLeft,0) / limit * 100) + '%';
      if (this.timeLeft <= (limit <= 120 ? 10 : 60)) { timerEl.classList.add('urgent'); fillEl.classList.add('urgent'); }
      if (this.timeLeft <= 0) {
        clearInterval(this.timerInt);
        if (q.tipo === 'desarrollo') this.submitDev(); else this.selectAnswer(-1);
      }
    }, 1000);
  },

  formatTime(sec){
    if (sec < 60) return sec + 's';
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + String(s).padStart(2,'0');
  },

  selectAnswer(selectedIdx){
    if (this.answered) return;
    this.answered = true;
    clearInterval(this.timerInt);

    const q = this.questions[this.idx];
    const isCorrect = selectedIdx === q.correcta;
    if (isCorrect) this.correctCount++;

    this.responses.push({
      tipo: 'mc', pregunta: q.texto, seleccionada: selectedIdx, correcta: q.correcta, esCorrecta: isCorrect
    });

    const btns = document.querySelectorAll('#eval-options .opt-btn');
    btns.forEach((b, i) => {
      b.disabled = true;
      if (i === q.correcta) b.classList.add('correct');
      else if (i === selectedIdx) b.classList.add('wrong');
    });

    setTimeout(() => {
      this.idx++;
      if (this.idx >= this.questions.length) this.finish();
      else this.renderQuestion();
    }, 1300);
  },

  submitDev(){
    if (this.answered) return;
    this.answered = true;
    clearInterval(this.timerInt);

    const q = this.questions[this.idx];
    const respuesta = document.getElementById('eval-dev-answer').value.trim();

    this.responses.push({
      tipo: 'desarrollo', pregunta: q.texto, respuesta, revisarManualmente: true
    });

    this.idx++;
    if (this.idx >= this.questions.length) this.finish();
    else this.renderQuestion();
  },

  async finish(){
    const mcResponses = this.responses.filter(r => r.tipo === 'mc');
    const devResponses = this.responses.filter(r => r.tipo === 'desarrollo');
    const totalMc = mcResponses.length;
    const pct = totalMc ? Math.round((this.correctCount / totalMc) * 100) : 0;
    const passed = pct >= PASS_THRESHOLD;

    document.getElementById('result-score').textContent = `${this.correctCount}/${totalMc}`;
    document.getElementById('result-score').className = 'result-score ' + (passed ? 'pass' : 'fail');
    document.getElementById('result-status').textContent = passed ? 'Aprobado' : 'No aprobado';
    document.getElementById('result-status').className = 'result-status ' + (passed ? 'pass' : 'fail');
    document.getElementById('result-local').textContent = localName(this.local);
    document.getElementById('result-dni').textContent = this.dni;
    document.getElementById('result-pct').textContent = pct + '%';
    document.getElementById('result-date').textContent = new Date().toLocaleString('es-AR');
    document.getElementById('result-save-note').textContent = devResponses.length
      ? 'Guardando resultado… (las preguntas de desarrollo requieren revisión manual)'
      : 'Guardando resultado…';

    showView('view-result');

    const saved = await Results.save({
      local: this.local, dni: this.dni, correctas: this.correctCount, total: totalMc,
      porcentaje: pct, aprobado: passed, respuestas: this.responses,
      preguntasDesarrolloPendientes: devResponses.length,
      fecha: Date.now()
    });
    document.getElementById('result-save-note').textContent = saved
      ? (devResponses.length ? 'Resultado guardado · desarrollo pendiente de revisión manual.' : 'Resultado guardado correctamente.')
      : 'No se pudo guardar el resultado.';
  },

  reset(){
    document.getElementById('login-dni').value = '';
    document.getElementById('login-error').textContent = '';
    showView('view-login');
  }
};
