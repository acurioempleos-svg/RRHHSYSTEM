<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciclo del empleado y liquidación</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F3;--panel:#fff;--ink:#1B2B30;--muted:#5E7076;--line:#D7DFDD;--accent:#0D6B58;--accent-d:#0A5343;--signal:#B4700F;--danger:#B23A2B;--ok:#2F7D4F;--r:8px}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 22px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}
header::-webkit-scrollbar{height:0}
header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.01em;flex:none}
.tabs{display:flex;gap:4px;flex:none}
.tabs button{background:none;border:0;color:#B9C7CB;font:inherit;font-weight:500;padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:#fff}
.tabs button[aria-current=page]{background:#ffffff1c;color:#fff}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;color:#B9C7CB;flex:none}
.hdr-right .warn{color:#F2C46B}
.detail-bar{position:sticky;top:var(--hh,58px);z-index:4;background:var(--bg);padding:10px 0;margin:0 0 14px}
main{max-width:1180px;margin:0 auto;padding:22px}
.view[hidden]{display:none}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
h3{font-size:14px;margin:0 0 10px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack>*+*{margin-top:16px}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar input[type=search]{flex:1;min-width:220px}
input,select,textarea{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input:disabled,select:disabled{background:#F1F4F3;color:var(--muted)}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:13px}
.tablewrap{padding:0;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-weight:600;font-size:13px;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.grid tbody tr[data-act]{cursor:pointer}
.grid tbody tr[data-act]:hover{background:#F1F4F3}
#v-emp .grid th,#v-emp .grid td{padding:6px 9px;font-size:13.5px}
#v-emp .grid th:nth-child(1),#v-emp .grid td:nth-child(1){position:sticky;left:0;background:#fff;z-index:2}
#v-emp .grid th:nth-child(2),#v-emp .grid td:nth-child(2){position:sticky;left:var(--sticky1,64px);background:#fff;z-index:2;box-shadow:2px 0 4px -2px rgba(0,0,0,.15)}
#v-emp .grid thead th{z-index:3}
#v-emp .grid tbody tr:hover td:nth-child(1),#v-emp .grid tbody tr:hover td:nth-child(2){background:#F1F4F3}
#v-emp .grid tbody td{border-bottom:1px solid #E9EEEC}
#v-emp .grid td[data-label=Nombre]{min-width:230px}
#v-emp .grid tbody tr.tint td{border-bottom:1px solid rgba(255,255,255,.9)}
#v-emp .grid tbody tr.tint:hover{filter:brightness(.965)}
#v-emp .grid tbody tr:hover td:nth-child(1){box-shadow:inset 3px 0 0 var(--accent)}
#v-emp .grid tbody tr.grp td{position:static;box-shadow:none;border-bottom:0;border-top:12px solid #fff;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
#v-emp .grid tbody tr.grp:first-child td{border-top:0}

td.num,th.num{text-align:right}
.empty{color:var(--muted);text-align:center;padding:28px 14px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:500;background:#E6ECEA;color:#41565C}
.alta{display:inline-block;min-width:26px;text-align:center;font-weight:700;border-radius:6px;padding:1px 8px;color:#fff}.alta-N{background:#2F7D4F}.alta-S{background:#B23A2B}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle;border:1px solid rgba(0,0,0,.12)}
.colorpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.colorpick label{cursor:pointer;display:inline-flex;position:relative}
.colorpick input{position:absolute;opacity:0;width:0;height:0}
.cdot{width:24px;height:24px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px transparent,inset 0 0 0 1px rgba(0,0,0,.08)}
.colorpick input:checked+.cdot{box-shadow:0 0 0 2px var(--ink),inset 0 0 0 1px rgba(0,0,0,.08)}
.colorpick input:focus-visible+.cdot{outline:2px solid var(--accent);outline-offset:2px}
.stat{display:flex;align-items:baseline;gap:14px;margin:18px 0 12px}.stat strong{font-size:52px;line-height:1;font-weight:700;color:var(--accent);letter-spacing:-.02em}.stat span{font-size:16px}
.st-activo{background:#DDF0E4;color:#1F6B3F}.st-licencia{background:#F8E9CB;color:#8A5608}.st-egreso{background:#F6DDD7;color:#9A3222}
.st-liquidado{background:#D3E8E3;color:#0A5343}.st-preingreso{background:#DCE7F3;color:#28527F}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.cols.liq{grid-template-columns:minmax(0,340px) minmax(0,1fr)}

  #v-emp .grid tbody td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);position:static;background:none;box-shadow:none}

  #v-emp .grid tbody td:last-child{border-bottom:0}
  #v-emp .grid tbody td::before{content:attr(data-label);font-weight:600;color:var(--muted);font-size:12px;flex:none}
  #v-emp .grid tbody td[data-label=Nombre]{font-weight:600}
  #v-emp .grid thead{white-space:nowrap}
  #v-emp .grid tbody tr.grp{border:0;padding:0;margin:16px 10px 4px}
  #v-emp .grid tbody tr.grp td{display:block;border-radius:8px;padding:8px 12px}
  #v-emp .grid tbody tr.grp td::before{content:none}
  #v-emp .grid td[data-label=Nombre]{min-width:0}
}

.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}

.sub:first-child{margin-top:0;padding-top:0;border:0}
.docs{display:grid;gap:6px}
.docs label{display:flex;gap:8px;align-items:center}
.docs input{width:auto}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.row>*{flex:1;min-width:110px}
.row>.btn{flex:0 0 auto}
.muted{color:var(--muted);font-size:13px}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;margin:8px 0;position:relative;line-height:1.3}
.sw[hidden]{display:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .knob{width:38px;height:22px;background:#C4CFCD;border-radius:99px;position:relative;flex:0 0 auto;transition:background .15s}
.sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+.knob{background:var(--accent)}
.sw input:checked+.knob::after{transform:translateX(16px)}
.sw input:focus-visible+.knob{outline:2px solid var(--accent);outline-offset:2px}

.recibo{padding:0;overflow:hidden}
.rc-head{padding:18px 22px;border-bottom:1px solid var(--line)}
.rc-head h2{margin:0 0 2px}
.rc-head .who{display:flex;gap:6px 22px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin-top:6px}
.rc-head .who b{color:var(--ink);font-weight:600}
.ledger td{padding:8px 22px}
.ledger tr.tot td{font-weight:600;background:#F6F8F7}
.ledger tr.sec td{font-size:12.5px;font-weight:600;color:var(--muted);background:#F6F8F7;padding:6px 22px}
.tag{font-size:12px;color:var(--muted);margin-left:8px}
.neto{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px 22px;background:var(--ink);color:#fff}
.neto span{font-size:14px;color:#B9C7CB}
.neto strong{font-size:32px;font-weight:700;letter-spacing:-.01em}
.avisos{padding:12px 22px;background:#FBF1DD;color:#7A4B06;font-size:13.5px;border-bottom:1px solid var(--line)}
.avisos p{margin:2px 0}
.rc-foot{padding:14px 22px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.actions{padding:14px 22px;display:flex;gap:8px;flex-wrap:wrap;align-items:end;border-top:1px solid var(--line);background:#FAFBFA}
.actions .fld{min-width:140px}
.checks{padding:14px 22px;border-top:1px solid var(--line)}
.checks label{display:flex;gap:8px;align-items:center;margin:4px 0}
.checks input{width:auto}
.msg{padding:26px 22px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
.hist{max-height:220px;overflow:auto;font-size:13.5px}
.hist p{margin:0;padding:5px 0;border-bottom:1px solid var(--line)}
.hist time{color:var(--muted);font-size:12.5px;display:block}
.alerts{display:grid;gap:10px;margin-bottom:16px}
.alert{border:1px solid var(--line);border-left:4px solid var(--signal);border-radius:var(--r);background:#fff;padding:12px 16px}
.alert.crit{border-left-color:var(--danger)}
.alert.ok{border-left-color:var(--ok)}
.alert h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.alert h4 .n{background:var(--signal);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:0 8px;min-width:20px;text-align:center;display:inline-block}
.alert.crit h4 .n{background:var(--danger)}
.alert ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.alert ul li{margin:2px 0}
.alert ul a,.alert ul span.lnk{color:var(--accent-d);cursor:pointer;text-decoration:underline;font-weight:500}
.tabs .bdg{display:inline-block;min-width:18px;padding:0 6px;margin-left:5px;border-radius:99px;background:#E4685B;color:#fff;font-size:11.5px;font-weight:700;text-align:center;line-height:18px}
.bdg[hidden]{display:none}
.btn:disabled{opacity:.4;cursor:default}.btn:disabled:hover{border-color:var(--line);color:var(--ink)}
.fpanel{padding:0;margin-bottom:14px}
.fpanel>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px 12px;font-weight:600;user-select:none}
.fpanel>summary::-webkit-details-marker{display:none}
.fpanel>summary .chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px}
.fpanel[open]>summary .chev{transform:rotate(45deg)}
.fpanel[open]>summary{border-bottom:1px solid var(--line)}
.fpanel .fcount{display:inline-block;min-width:20px;padding:0 7px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:20px}
.fpanel .fcount[hidden]{display:none}
.fpanel .fspace{flex:1}
.fg-f{display:flex;flex-wrap:wrap;gap:8px 10px;padding:10px 14px 12px}
.ff{display:flex;flex-direction:column;gap:2px;flex:0 1 128px;min-width:110px}
.ff.rng2{flex:0 1 275px;min-width:265px}
.ff-l{font-size:11px;font-weight:600;color:var(--muted);line-height:1.2}
.ff input,.ff select{padding:3px 7px;font-size:13px;min-width:0;height:28px}
.ff.on input,.ff.on select{border-color:var(--accent);background:#F1F8F6}
.ff.on .ff-l{color:var(--accent)}
.rr{display:flex;align-items:center;gap:4px}.rr>span{color:var(--muted);font-size:12px}.rr input{flex:1}
@media(max-width:760px){.ff,.ff.rng2{flex:1 1 45%}}
.v-bad{color:var(--danger);font-weight:600}.v-soon{color:var(--signal);font-weight:600}
.ord{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px}
.ord-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:grab}
.ord-item.dragging{opacity:.45}
.ord-item.over{border-color:var(--accent);box-shadow:0 0 0 2px #0D6B5833}
.ord-item .grip{color:var(--muted);font-size:16px;line-height:1}
.ord-item .ord-n{width:22px;color:var(--muted);font-size:13px;text-align:right}
.ord-item .ord-name{flex:1;font-weight:500}
.ord-btns{display:flex;gap:4px}
.ord-item.loc{flex-wrap:wrap}
.sw-row{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:2px 0 4px 64px}
.csw{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.16);padding:0;cursor:pointer}
.csw:hover{transform:scale(1.12)}
.csw[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}
.sync{display:inline-flex;align-items:center;gap:5px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:#7C8B8F;flex:0 0 auto}
.sync.on .dot{background:#3FD584}
.sync.off .dot{background:#F2C46B}
.sync.err .dot{background:#E4685B}
.bars{display:grid;gap:7px;margin:10px 0}
.bars .brow{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bars .btrack{background:#E6ECEA;border-radius:4px;height:14px;overflow:hidden}
.bars .bfill{height:100%;background:var(--accent);border-radius:4px}
.bars .bfill.neg{background:var(--danger)}
.bars .bval{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.statgrid .sbox{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.statgrid .sbox strong{display:block;font-size:26px;color:var(--accent);letter-spacing:-.01em}
.statgrid .sbox span{font-size:12.5px;color:var(--muted)}

.simbox .win{color:var(--ok);font-weight:600}
@media print{header,.bar,#liq-form,#liq-list,.actions,.checks,.no-print,#toast{display:none!important}body{background:#fff}main{padding:0;max-width:none}.card{border:0}.cols.liq{display:block}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body.print-only{-webkit-print-color-adjust:exact;print-color-adjust:exact}body.print-only header,body.print-only .view[hidden]{display:none!important}body.print-only .view>*:not(.print-target){display:none!important}body.print-only #liq-list.print-target,body.print-only #ficha.print-target{display:block!important}}
.llbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}.llbar .fld{margin:0}
</style>
</head>
<body>
<header>
  <h1>Ciclo del empleado</h1>
  <nav class="tabs" aria-label="Secciones">
    <button data-act="tab" data-tab="emp">Empleados</button>
    <button data-act="tab" data-tab="ale">Alertas <span class="bdg" id="ale-n" hidden>0</span></button>
    <button data-act="tab" data-tab="liq">Liquidación</button>
    <button data-act="tab" data-tab="est">Historial y estadística</button>
    <button data-act="tab" data-tab="par">Parámetros</button>
  </nav>
  <div class="hdr-right">
    <span id="sync" class="sync off"><span class="dot"></span><span id="sync-txt">Sin sincronización</span></span>
    <span id="respaldo"></span>
    <button class="btn sm" data-act="export">Exportar respaldo</button>
    <label class="btn sm" style="cursor:pointer">Importar<input type="file" id="imp" accept="application/json,.json" hidden></label>
  </div>
</header>
<main>
  <section class="view" id="v-emp"></section>
  <section class="view" id="v-ale" hidden></section>
  <section class="view" id="v-liq" hidden></section>
  <section class="view" id="v-est" hidden></section>
  <section class="view" id="v-par" hidden></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
//==LOGIC-START==
const DAY = 864e5;
const pd = s => new Date(s + 'T00:00:00');
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const dias = (a, b) => Math.round((b - a) / DAY) + 1;                 // inclusive
const fmtISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const ym = d => fmtISO(d).slice(0, 7);
const mejor = (rem, desde, hasta) =>
  Math.max(0, ...rem.filter(r => r.periodo >= desde && r.periodo <= hasta).map(r => +r.habitual || 0));
const mesesEntre = (a, b) => {
  let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  if (b.getDate() < a.getDate()) m--;
  return m;
};
// Feriados nacionales de Argentina (inamovibles + trasladables + no laborables con fines turísticos).
// Fuente 2026: Decreto 614/2025 y Resolución 164/2025 (Jefatura de Gabinete). 2027: fechas fijas confirmadas;
// las trasladables de ago/oct/nov 2027 son estimadas según la regla de la Ley 27.399 y deben confirmarse cuando
// el Gobierno publique la resolución anual (normalmente en diciembre del año anterior). Para sumar años nuevos,
// agregá un array de fechas ISO 'YYYY-MM-DD' a este objeto.
const FERIADOS_AR = {
  2026: ['2026-01-01','2026-02-16','2026-02-17','2026-03-23','2026-03-24','2026-04-02','2026-04-03','2026-05-01',
         '2026-05-25','2026-06-17','2026-06-20','2026-07-09','2026-07-10','2026-08-17','2026-10-12','2026-11-20',
         '2026-12-07','2026-12-08','2026-12-25'],
  2027: ['2027-01-01','2027-02-08','2027-02-09','2027-03-24','2027-03-26','2027-04-02','2027-05-01','2027-05-25',
         '2027-06-17','2027-06-20','2027-07-09','2027-08-16','2027-10-11','2027-11-22','2027-12-08','2027-12-25'],
};
const feriadosSet = new Set(Object.values(FERIADOS_AR).flat());
const esFeriado = iso => feriadosSet.has(iso);
function addHabiles(s, n) {                                           // salta fines de semana y feriados nacionales

}

// Último día del período de prueba (ingreso + N meses − 1 día)
function finDePrueba(ingISO, meses) {
  const i = pd(ingISO);
  const d = new Date(i.getFullYear(), i.getMonth() + (+meses || 0), i.getDate());
  d.setDate(d.getDate() - 1);
  return fmtISO(d);
}

// Ley 27.802 (vigente desde el 06/03/2026) modificó el art. 231 LCT: durante el período de prueba el empleador ya no debe preaviso.
// Antes de esa fecha, el fin de prueba lleva preaviso de 15 días (o su indemnización sustitutiva).
const SIN_PREAVISO_PRUEBA_DESDE = '2026-03-06';
const preavisoAplica = (tipo, fechaISO) => tipo === 'despido_sin_causa' || tipo === 'despido_indirecto'
  || (tipo === 'fin_prueba' && (!fechaISO || fechaISO < SIN_PREAVISO_PRUEBA_DESDE));

function calcularLiquidacion({ emp, rem, egreso, P }) {
  const ing = pd(emp.fechaIngreso), f = pd(egreso.fecha), t = egreso.tipo;
  const sueldo = +emp.sueldoActual || 0, v30 = sueldo / 30, v25 = sueldo / 25;
  const C = [], avisos = [];
  const add = (codigo, desc, monto, remunerativo = true) => { if (monto > 0.004) C.push({ codigo, desc, monto: r2(monto), remunerativo }); };

  const antigReal = (f - ing) / (365.25 * DAY);
  const meses = mesesEntre(ing, new Date(f.getTime() + DAY));
  const anios = Math.floor(meses / 12) + (meses % 12 > 3 ? 1 : 0);      // fracción > 3 meses = 1 año
  const mrnh = Math.max(mejor(rem, ym(new Date(f.getFullYear(), f.getMonth() - 11, 1)), ym(f)), sueldo);

  // 1. Días trabajados del mes
  const iniMes = new Date(f.getFullYear(), f.getMonth(), 1);
  const dTrab = Math.min(30, dias(ing > iniMes ? ing : iniMes, f));
  add('DIAS', `Días trabajados del mes (${dTrab})`, v30 * dTrab);

  // Renuncia / desvinculación con pago de días trabajados: se paga únicamente el período trabajado
  if (t === 'renuncia_dias' || t === 'desvinculacion_dias') {
    avisos.push('Liquidación de solo días trabajados: se paga únicamente el período trabajado del mes. No incluye SAC, vacaciones, preaviso, integración, indemnizaciones, feriados ni otros agregados.');
    const totalSolo = r2(C.reduce((s, c) => s + c.monto, 0));
    return { conceptos: C, total: totalSolo, avisos,
             meta: { mrnh: r2(mrnh), anios, meses, sueldo, base245: 0, mesesPre: 0, antigReal: +antigReal.toFixed(2) } };
  }

  // 2. SAC proporcional
  const s1 = f.getMonth() < 6;
  const iniSem = new Date(f.getFullYear(), s1 ? 0 : 6, 1);
  const finSem = new Date(f.getFullYear(), s1 ? 6 : 12, 0);
  const mejorSem = Math.max(mejor(rem, ym(iniSem), ym(f)), sueldo);
  add('SAC', 'SAC proporcional', mejorSem / 2 * dias(ing > iniSem ? ing : iniSem, f) / dias(iniSem, finSem));

  // 3. Vacaciones no gozadas
  const antig31 = (new Date(f.getFullYear(), 11, 31) - ing) / (365.25 * DAY);
  const tramo = P.vacaciones.find(x => antig31 <= x.hasta) || P.vacaciones[P.vacaciones.length - 1];
  const iniAnio = new Date(f.getFullYear(), 0, 1);
  const diasAnio = dias(ing > iniAnio ? ing : iniAnio, f);
  const diasVac = Math.max(0, tramo.dias * diasAnio / 365 - (+egreso.vacGozadasAnio || 0)) + (+egreso.vacPendientesAnt || 0);
  add('VAC', `Vacaciones no gozadas (${diasVac.toFixed(2)} días)`, diasVac * v25);
  add('SAC_VAC', 'SAC s/ vacaciones', diasVac * v25 / 12);

  // 4. Preaviso (apagado por defecto: se activa a mano)
  const enPrueba = f <= pd(finDePrueba(emp.fechaIngreso, P.mesesPrueba));
  if (t === 'fin_prueba' && !enPrueba) avisos.push('La fecha de egreso es posterior al fin del período de prueba: corresponde tratarlo como despido sin causa.');
  if (t === 'despido_sin_causa' && enPrueba) avisos.push('El egreso cae dentro del período de prueba: verificá si corresponde "Fin de período de prueba".');
  if (t === 'fin_prueba') {
    avisos.push('Fin del período de prueba (art. 92 bis LCT): no genera antigüedad, por lo que no corresponde indemnización del art. 245 ni integración del mes. Se liquidan los días trabajados, el SAC proporcional y las vacaciones proporcionales.'
      + (preavisoAplica(t, egreso.fecha)
        ? ' Como el egreso es anterior al 06/03/2026, corresponde preaviso de 15 días (o su indemnización sustitutiva).'
        : ' Desde el 06/03/2026 (Ley 27.802, art. 231 LCT) tampoco se debe preaviso durante el período de prueba.'));
    if (emp.modalidad && emp.modalidad !== 'indeterminado') avisos.push('El período de prueba del art. 92 bis rige para contratos por tiempo indeterminado. Este empleado figura con otra modalidad: verificá que corresponda usar este tipo de egreso.');
  }
  let mesesPre = 0;
  if (egreso.pagarPreaviso && preavisoAplica(t, egreso.fecha)) {
    mesesPre = t === 'fin_prueba' ? 0.5 : (antigReal <= 5 ? 1 : 2);
    add('PREAVISO', `Preaviso sustitutivo (${mesesPre === 0.5 ? '15 días' : mesesPre + (mesesPre === 1 ? ' mes' : ' meses')})`, sueldo * mesesPre);
    add('SAC_PRE', 'SAC s/ preaviso', sueldo * mesesPre / 12);
  }

  // 5. Integración del mes de despido (apagada por defecto)
  if (egreso.pagarIntegracion && (t === 'despido_sin_causa' || t === 'despido_indirecto')) {
    const diasMes = new Date(f.getFullYear(), f.getMonth() + 1, 0).getDate();
    const integ = v30 * (diasMes - f.getDate());
    add('INTEG', 'Integración mes de despido (art. 233)', integ);
    add('SAC_INT', 'SAC s/ integración', integ / 12);
  }

  // 6. Indemnización por antigüedad (art. 245) — no remunerativa
  let base245 = 0;
  if (t === 'despido_sin_causa' || t === 'fallecimiento' || t === 'despido_indirecto') {
    const tope = +P.topeCCT || 0;
    base245 = tope > 0 ? Math.max(Math.min(mrnh, tope), mrnh * 0.67) : mrnh;
    if (!(tope > 0)) avisos.push('Falta cargar el tope del CCT en Parámetros: la base del art. 245 no está topeada.');
    const ind = Math.max(anios, 1) * base245 * (t === 'fallecimiento' ? 0.5 : 1);
    add('IND245', `Indemnización por antigüedad (${anios} ${anios === 1 ? 'año' : 'años'}${t === 'fallecimiento' ? ', 50 %' : ''})`, ind, false);
    if (t === 'despido_indirecto') avisos.push('Despido indirecto: se calculó como un despido sin causa (art. 246 LCT). Verificá que la injuria invocada por el empleado esté documentada.');
  }
  if (t === 'mutuo_acuerdo') add('ACUERDO', 'Suma acordada (art. 241)', +egreso.montoPactado || 0, false);
  if (t === 'abandono_trabajo') avisos.push('Abandono de trabajo: se liquida como egreso sin indemnización. Verificá que se haya cursado la intimación previa a reintegrarse (art. 244 LCT) antes de dar por configurado el abandono.');
  if (t === 'jubilacion') avisos.push('Retiro por jubilación: se liquida sin indemnización por antigüedad, asumiendo que el empleado reúne los requisitos para jubilarse. Si la empresa intimó a jubilarse antes de que estén cumplidos, corresponde indemnización reducida (arts. 252/253 LCT) y hay que calcularla aparte.');

  // 7. Feriados trabajados y agregados no remunerativos del mes de egreso (cargados en el legajo)
  if (+egreso.feriados > 0) add('FERIADOS', `Feriados trabajados del mes (${egreso.feriados})`, v30 * egreso.feriados);
  (egreso.nremun || []).forEach(n => add('NREM', n.concepto || 'Agregado no remunerativo', +n.monto || 0, false));

  const total = r2(C.reduce((s, c) => s + c.monto, 0));
  return { conceptos: C, total, avisos,
           meta: { mrnh: r2(mrnh), anios, meses, sueldo, base245: r2(base245), mesesPre, antigReal: +antigReal.toFixed(2) } };
}
//==LOGIC-END==

/* ================= Nube con JSONBin.io (gratis, cifrada de punta a punta) =================
   Guarda todos los datos como un "bin" cifrado en tu cuenta de JSONBin.io. Antes de subirlos se
   cifran en este navegador (AES-256-GCM, clave derivada con PBKDF2) usando la clave que definas
   en Parámetros: en JSONBin solo queda texto ilegible, aunque alguien tenga la API key.
   Configuración (una sola vez, ~2 minutos):
   1. Creá una cuenta gratis en https://jsonbin.io.
   2. Menú "API Keys" → copiá la clave "X-MASTER-KEY" (NO la "X-ACCESS-KEY").
   3. Pegá esa clave junto con una clave de cifrado en Parámetros → "Guardado en la nube
      (JSONBin)" y dejá "ID del bin" vacío la primera vez → "Guardar y conectar". La app crea el
      bin sola y te muestra su ID.
   4. En cada otra computadora, pegá la misma X-MASTER-KEY, la misma clave de cifrado y ese ID de
      bin, para que todas compartan la misma información.
   Limitaciones: el plan gratis permite 10.000 pedidos por mes (de sobra para un equipo chico).
   Gana el último que guarda (no hay fusión de cambios) y los cambios de otra computadora pueden
   tardar hasta 20 s en verse. */
const localId = uidSync();
function uidSync() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function setSync(state, txt) { const el = $('#sync'); if (!el) return; el.className = 'sync ' + state; const t = $('#sync-txt'); if (t) t.textContent = txt; }
const horaAr = () => new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
const b64 = buf => { const a = new Uint8Array(buf); let t = ''; for (let i = 0; i < a.length; i += 0x8000) t += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(t); };
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function crKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function crEncrypt(bytes, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await crKey(pass, salt), bytes);
  return { salt: b64(salt), iv: b64(iv), data: b64(ct) };
}
async function crDecrypt(env, pass) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, await crKey(pass, unb64(env.salt)), unb64(env.data));
  return new Uint8Array(pt);
}
// Compresión gzip nativa (antes de cifrar / después de descifrar) para entrar en el límite de 100kb de JSONBin free.
async function gzComp(str) {
  const cs = new CompressionStream('gzip');
  const stream = new Blob([new TextEncoder().encode(str)]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function gzDecomp(bytes) {
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new TextDecoder().decode(await new Response(stream).arrayBuffer());
}
const JB_KEY = 'rrhh_ciclo_jb_cfg', JB_META = 'rrhh_ciclo_jb_meta';

let jbReady = false, jbBusy = false, jbTimer = null, jbPoll = null, jbRev = 0, jbApplyingRemote = false;
function jbConfig() {

function jbMeta() { try { return JSON.parse(localStorage.getItem(JB_META) || '{}') || {}; } catch (e) { return {}; } }
function setJbMeta(m) { try { localStorage.setItem(JB_META, JSON.stringify(Object.assign(jbMeta(), m))); } catch (e) {} }

const historialMesesNube = () => +((S.parametros || {}).historialMesesNube ?? 12);

async function jbUpload() {

    const stamp = new Date().toISOString();

    const env = Object.assign({ v: 2, actualizado: stamp, _local: localId }, await crEncrypt(await gzComp(JSON.stringify(payload)), cfg.clave));
    if (!cfg.binId) {

// mode: 'first' (al abrir/conectar), 'auto' (sondeo periódico), 'force' (botón "Traer ahora")
async function jbPull(mode = 'auto') {
  const cfg = jbConfig(); if (!cfg || jbBusy) return;
  if (!cfg.binId) {
    jbReady = true;
    if (S.empleados.length) jbPush(); else setSync('on', 'Conectado a JSONBin (todavía no hay datos en la nube)');
    return;
  }
  const meta = jbMeta();
  if (mode === 'auto' && meta.dirty) return;
  try {
    const r = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(cfg.binId)}/latest`, { headers: { 'X-Master-Key': cfg.apiKey, 'X-Bin-Meta': 'false' }, cache: 'no-store' });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || ('HTTP ' + r.status)); }
    const env = await r.json();
    jbReady = true;
    const propio = env._local === localId;
    const viejo = mode !== 'force' && env.actualizado && meta.lastRemote && env.actualizado <= meta.lastRemote;
    if (propio || viejo) { setSync('on', 'Sincronizado con JSONBin'); return; }
    let data;
    try {
      const pt = await crDecrypt(env, cfg.clave);
      const txt = (env.v >= 2) ? await gzDecomp(pt) : new TextDecoder().decode(pt);
      data = JSON.parse(txt);
    } catch (e) { setSync('err', 'JSONBin: clave incorrecta o datos dañados'); return; }
    if (!data || !Array.isArray(data.empleados)) { setSync('err', 'JSONBin: los datos de la nube no tienen el formato esperado'); return; }
    if (mode === 'auto' && document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;   // no pisar lo que se está tipeando
    const sinSync = !meta.lastRemote && S.empleados.length > 0;
    if (mode === 'force') {
      if (!confirm(`Se van a reemplazar los datos de este navegador por los de la nube (${data.empleados.length} empleados). ¿Continuar?`)) return;
    } else if (meta.dirty || sinSync) {
      const ok = confirm(`En la nube hay datos (${data.empleados.length} empleados) distintos a los de este navegador.\n\nAceptar: usar los de la nube y descartar los de este navegador.\nCancelar: conservar los de este navegador y reemplazar los de la nube.\n\nSi dudás, cancelá, exportá un respaldo y volvé a intentar.`);
      if (!ok) { jbPush(); return; }
    }
    jbApplyingRemote = true;
    try {
      const historialPropio = S.historial;
      S = normalize(data);
      const idsNube = new Set(S.historial.map(h => h.id));
      const faltantes = historialPropio.filter(h => !idsNube.has(h.id));   // ej. historial viejo recortado al subir a la nube (ver historialMesesNube)
      if (faltantes.length) S.historial = S.historial.concat(faltantes);
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      if (UI.detail && UI.detail !== 'new' && !S.empleados.some(x => x.id === UI.detail)) UI.detail = null;
      go(UI.tab); paintRespaldo();
    } finally { jbApplyingRemote = false; }
    setJbMeta({ lastRemote: env.actualizado, dirty: false });
    setSync('on', 'Sincronizado con JSONBin'); toast('Datos actualizados desde la nube');
  } catch (e) { setSync('err', ('JSONBin: no se pudo leer (' + (e.message || 'sin conexión') + ')').slice(0, 140)); }
}

function barras(items, { money: enPlata = false } = {}) {                 // items: [{label, value, neg}]
  if (!items.length) return '<p class="muted" style="margin:0">Sin datos para mostrar.</p>';
  const max = Math.max(1, ...items.map(i => Math.abs(i.value)));
  return `<div class="bars">${items.map(i => `<div class="brow"><span>${esc(i.label)}</span><span class="btrack"><span class="bfill${i.neg ? ' neg' : ''}" style="width:${Math.max(2, Math.round(Math.abs(i.value) / max * 100))}%"></span></span><span class="bval">${enPlata ? money(i.value) : i.value}</span></div>`).join('')}</div>`;
}
function lineChart(points, { w = 560, h = 150, fmtY = n => n } = {}) {    // points: [{x:label, y:number}]
  if (points.length < 2) return points.length === 1 ? `<p class="muted" style="margin:0">Solo hay un valor cargado (${esc(points[0].x)}: ${fmtY(points[0].y)}).</p>` : '<p class="muted" style="margin:0">Sin datos suficientes para el gráfico.</p>';
  const pad = { l: 54, r: 12, t: 12, b: 26 };
  const ys = points.map(p => p.y), yMin = Math.min(0, ...ys), yMax = Math.max(...ys) || 1;
  const X = i => pad.l + (i / (points.length - 1)) * (w - pad.l - pad.r);
  const Y = v => h - pad.b - ((v - yMin) / ((yMax - yMin) || 1)) * (h - pad.t - pad.b);
  const pathPts = points.map((p, i) => `${X(i)},${Y(p.y)}`).join(' ');
  const gridY = [yMin, (yMin + yMax) / 2, yMax];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:220px" role="img" aria-label="Gráfico de evolución">
    ${gridY.map(v => `<line x1="${pad.l}" y1="${Y(v)}" x2="${w - pad.r}" y2="${Y(v)}" stroke="#E6ECEA" stroke-width="1"/><text x="${pad.l - 8}" y="${Y(v) + 4}" font-size="10" text-anchor="end" fill="#5E7076">${esc(fmtY(v))}</text>`).join('')}
    <polyline points="${pathPts}" fill="none" stroke="#0D6B58" stroke-width="2"/>
    ${points.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="3" fill="#0D6B58"><title>${esc(p.x)}: ${esc(fmtY(p.y))}</title></circle>`).join('')}
    ${points.map((p, i) => (i === 0 || i === points.length - 1 || points.length <= 8) ? `<text x="${X(i)}" y="${h - 6}" font-size="10" text-anchor="middle" fill="#5E7076">${esc(p.x)}</text>` : '').join('')}
  </svg>`;
}

/* Orden de los puestos en la nómina: lo define el usuario en Parámetros → "Orden de los puestos".
   Mientras no lo toque, se usa este orden de partida: Salón antes que Cocina y, dentro de cada área,
   los jefes primero. Los puestos que no estén en la lista van al final. */
const AREA_SALON = ['Recepcion', 'Caja', 'Supervision', 'Jefe de barra', 'Barra', 'Camarero', 'Camarero Jr', 'Corredor', 'Volante', 'Valet Parking'];
const AREA_COCINA = ['Chef', 'Sous Chef', 'Cocina', 'Pasteleria', 'Produccion', 'Bacha', 'Almacen'];
const JEFES_PUESTOS = ['Supervision', 'Jefe de barra', 'Chef', 'Sous Chef'];
const PUESTOS_UNICOS = [...new Set(PUESTOS)];
const areaDe = p => AREA_SALON.includes(p) ? 0 : AREA_COCINA.includes(p) ? 1 : 2;
const nivelDe = p => JEFES_PUESTOS.includes(p) ? 0 : 1;
const posEnArea = p => { const a = [AREA_SALON, AREA_COCINA][areaDe(p)]; return a ? a.indexOf(p) : PUESTOS_UNICOS.indexOf(p); };
function puestosExtra() { return [...new Set(S.empleados.map(e => (e.puesto || '').trim()).filter(p => p && !PUESTOS_UNICOS.includes(p)))]; }
function ordenPuestos() {
  const todos = [...PUESTOS_UNICOS, ...puestosExtra()];
  const guardado = (S.ordenPuestos || []).filter((p, i, a) => todos.includes(p) && a.indexOf(p) === i);
  const base = todos.slice().sort((a, b) => areaDe(a) - areaDe(b) || nivelDe(a) - nivelDe(b) || posEnArea(a) - posEnArea(b));
  return guardado.concat(base.filter(p => !guardado.includes(p)));
}
/* Orden de los locales en la nómina: por defecto el orden de LOCALES, pero se puede
   reordenar desde Parámetros → "Orden de los locales" (igual que el orden de los puestos). */
function localesExtra() { return [...new Set(S.empleados.map(e => (e.local || '').trim()).filter(l => l && !LOCALES.includes(l)))]; }
function ordenLocales() {
  const todos = [...LOCALES, ...localesExtra()];
  const guardado = (S.ordenLocales || []).filter((l, i, a) => todos.includes(l) && a.indexOf(l) === i);
  return guardado.concat(todos.filter(l => !guardado.includes(l)));
}
const ordenNomina = () => {
  const oml = new Map(ordenLocales().map((l, i) => [l, i]));
  const omp = new Map(ordenPuestos().map((p, i) => [p, i]));

    || (omp.has(a.puesto) ? omp.get(a.puesto) : 9999) - (omp.has(b.puesto) ? omp.get(b.puesto) : 9999)
    || (a.apellido || '').localeCompare(b.apellido || '');
};

function calcAlertas() {
  const hoy = today(), lim = fmtISO(new Date(Date.now() + 15 * DAY));
  const activos = enNomina();
  const prueba = activos.filter(e => { const fp = finPruebaDe(e); return fp && fp >= hoy && fp <= lim; }).sort((a, b) => finPruebaDe(a).localeCompare(finPruebaDe(b)));
  const sinAlta = activos.filter(e => !e.alta);
  const vLibreta = activos.filter(e => e.libretaSanitariaVenc && e.libretaSanitariaVenc >= hoy && e.libretaSanitariaVenc <= lim);
  const vDni = activos.filter(e => e.dniVenc && e.dniVenc >= hoy && e.dniVenc <= lim);
  const vencidos = activos.filter(e => (e.libretaSanitariaVenc && e.libretaSanitariaVenc < hoy) || (e.dniVenc && e.dniVenc < hoy));
  const pend = S.liquidaciones.filter(l => l.estado === 'borrador' || l.estado === 'aprobada');
  const bands = { d60: [], d30: [], d15: [] };
  pend.forEach(l => {
    const venc = addHabiles(l.inputs.fecha, 4);
    if (venc >= hoy) return;
    const atraso = Math.round((pd(hoy) - pd(venc)) / DAY);
    const item = { l, emp: S.empleados.find(x => x.id === l.empleadoId), atraso };
    if (atraso >= 60) bands.d60.push(item); else if (atraso >= 30) bands.d30.push(item); else if (atraso >= 15) bands.d15.push(item);
  });
  const vigentes = S.empleados.filter(e => !['liquidado', 'archivado', 'egreso'].includes(e.estado));
  const solAlta = vigentes.filter(e => e.solicitaAlta), solAumento = vigentes.filter(e => e.solicitaAumento);
  const nomE = id => S.empleados.find(x => x.id === id), enNom = id => nomE(id) && ['activo', 'licencia'].includes(nomE(id).estado);
  const finPronto = arr => arr.filter(x => x.hasta >= hoy && x.hasta <= lim && enNom(x.empleadoId)).sort((a, b) => a.hasta.localeCompare(b.hasta)).map(x => ({ e: nomE(x.empleadoId), x }));
  const licFin = finPronto(S.licencias), vacFin = finPronto(S.vacaciones);
  return { prueba, sinAlta, vLibreta, vDni, vencidos, bands, solAlta, solAumento, licFin, vacFin };
}

function saldoVac(e, anio = new Date().getFullYear()) {
  if (!e || !e.fechaIngreso) return null;
  const ing = pd(e.fechaIngreso), ini = new Date(anio, 0, 1), fin = new Date(anio, 11, 31), V = S.parametros.vacaciones;
  if (ing > fin) return null;
  const tramo = V.find(x => (fin - ing) / (365.25 * DAY) <= x.hasta) || V[V.length - 1], trab = dias(ing > ini ? ing : ini, fin);
  const corresp = ing > ini && trab < 183 ? Math.floor(trab / 20) : tramo.dias;
  const goz = S.vacaciones.filter(v => v.empleadoId === e.id && +v.anio === anio).reduce((t, v) => t + (+v.dias || 0), 0);
  return { anio, corresp, goz, rest: corresp - goz };
}
function saldoVacHtml(e) {

}

const novMes = (empId, fecha) => { const m = String(fecha || '').slice(0, 7);
  return { feriados: S.novedades.filter(n => n.empleadoId === empId && n.tipo === 'feriado' && n.mes === m).length,
           nremun: S.novedades.filter(n => n.empleadoId === empId && n.tipo === 'nremun' && n.mes === m).map(n => ({ concepto: n.concepto, monto: n.monto })) }; };
function readLiqForm() {
  return { tipo: $('#l-tipo').value, fecha: $('#l-fecha').value, pagarPreaviso: $('#l-prea').checked, pagarIntegracion: $('#l-integ').checked,
    montoPactado: +$('#l-monto').value || 0, vacGozadas: +$('#l-vg').value || 0, vacPend: +$('#l-vp').value || 0 };
}

function updateLiq() {
  const L = UI.liq, box = $('#liq-res');
  if (!L || !L.empId) { $('#row-monto').hidden = true; $('#row-prea').hidden = true; $('#row-integ').hidden = true; box.innerHTML = '<div class="msg">Elegí un empleado para calcular su liquidación final.</div>'; return; }
  const emp = S.empleados.find(x => x.id === L.empId);
  const liq = L.id ? S.liquidaciones.find(x => x.id === L.id) : null;
  const locked = !!liq && liq.estado !== 'borrador';
  if (!locked) L.inputs = readLiqForm();
  const inp = L.inputs;
  $('#row-monto').hidden = inp.tipo !== 'mutuo_acuerdo';
  $('#row-prea').hidden = !preavisoAplica(inp.tipo, inp.fecha);
  $('#row-integ').hidden = !['despido_sin_causa', 'despido_indirecto'].includes(inp.tipo);

  let res;
  if (locked) res = liq.result;
  else {
    L.res = null;
    if (!emp.fechaIngreso) { box.innerHTML = '<div class="msg">Falta la fecha de ingreso del empleado. Cargala en su legajo.</div>'; return; }
    if (!(+emp.sueldoActual > 0)) { box.innerHTML = '<div class="msg">Falta el sueldo mensual normal y habitual del empleado. Cargalo en su legajo.</div>'; return; }
    if (!inp.fecha) { box.innerHTML = '<div class="msg">Elegí la fecha de egreso.</div>'; return; }
    if (pd(inp.fecha) < pd(emp.fechaIngreso)) { box.innerHTML = '<div class="msg">La fecha de egreso es anterior a la fecha de ingreso.</div>'; return; }
    res = calcularLiquidacion({ emp, rem: S.remuneraciones.filter(r => r.empleadoId === emp.id),
      egreso: { tipo: inp.tipo, fecha: inp.fecha, pagarPreaviso: inp.pagarPreaviso, pagarIntegracion: inp.pagarIntegracion, montoPactado: inp.montoPactado, vacGozadasAnio: inp.vacGozadas, vacPendientesAnt: inp.vacPend, ...novMes(emp.id, inp.fecha) },
      P: S.parametros });
    L.res = res;
  }
  const hab = res.conceptos.filter(c => c.remunerativo), nor = res.conceptos.filter(c => !c.remunerativo);
  const est = liq ? liq.estado : 'borrador';
  const vence = addHabiles(inp.fecha, 4);
  let simHtml = '';
  if (!locked && preavisoAplica(inp.tipo, inp.fecha)) {
    const egresoBase = { tipo: inp.tipo, fecha: inp.fecha, pagarIntegracion: inp.pagarIntegracion, montoPactado: inp.montoPactado, vacGozadasAnio: inp.vacGozadas, vacPendientesAnt: inp.vacPend, ...novMes(emp.id, inp.fecha) };
    const remEmp = S.remuneraciones.filter(r => r.empleadoId === emp.id);
    const sinP = calcularLiquidacion({ emp, rem: remEmp, egreso: { ...egresoBase, pagarPreaviso: false }, P: S.parametros });
    const conP = calcularLiquidacion({ emp, rem: remEmp, egreso: { ...egresoBase, pagarPreaviso: true }, P: S.parametros });
    const dif = r2(conP.total - sinP.total);
    simHtml = `<div class="simbox"><h3 style="margin-bottom:6px">Simulador: con vs. sin preaviso</h3>
      <p class="muted" style="margin-top:0">Compara el total a pagar activando o no el preaviso sustitutivo, sin cambiar lo que tenés cargado arriba.</p>
      <table><thead><tr><th></th><th class="num">Sin preaviso</th><th class="num">Con preaviso</th></tr></thead><tbody>
        <tr><td>Total liquidación</td><td class="num">${money(sinP.total)}</td><td class="num">${money(conP.total)}</td></tr>
        <tr><td>Diferencia</td><td class="num" colspan="2" style="text-align:right">${money(dif)} adicional pagando preaviso</td></tr>
      </tbody></table></div>`;
  }
  const totRes = totalDe(res), repBase = locked ? (liq && liq.reparto) : (L.rep || (liq && liq.reparto));
  const repE = repBase ? Math.min(Math.max(+repBase.efectivo || 0, 0), totRes) : 0, repT = r2(totRes - repE);
  if (!locked) L.rep = { efectivo: repE, transferencia: repT };
  let acciones = '';
  if (est === 'borrador') acciones = `<div class="actions"><label class="fld"><span>En efectivo</span><input type="number" id="rep-efe" step="0.01" min="0" value="${repE}"></label><label class="fld"><span>Por transferencia</span><input type="number" id="rep-tra" step="0.01" min="0" value="${repT}"></label><div class="muted" style="flex-basis:100%;margin:0">Total a cobrar: ${money(totRes)}. Elegí cuánto va en efectivo y cuánto por transferencia: al cargar uno, el otro se completa solo. Se guarda con el borrador.</div><button class="btn" data-act="saveLiq">Guardar borrador</button><button class="btn primary" data-act="approveLiq">Aprobar liquidación</button><button class="btn no-print" data-act="print">Imprimir recibo</button>${liq ? '<button class="btn danger" data-act="discardLiq">Descartar</button>' : ''}</div>`;
  else if (est === 'aprobada') acciones = `<div class="actions"><label class="fld"><span>Fecha de pago</span><input type="date" id="pay-fecha" value="${today()}"></label><label class="fld"><span>En efectivo</span><input type="number" id="pay-efe" step="0.01" min="0" value="${repE}"></label><label class="fld"><span>Por transferencia</span><input type="number" id="pay-tra" step="0.01" min="0" value="${repT}"></label><div class="muted" id="pay-chk" style="flex-basis:100%;margin:0">Total a pagar: ${money(totalDe(res))}. Repartí el monto entre efectivo y transferencia: al cargar uno, el otro se completa solo.</div><button class="btn primary" data-act="payLiq">Registrar pago</button><button class="btn" data-act="print">Imprimir recibo</button><button class="btn" data-act="reopenLiq">Volver a borrador</button></div>`;
  else {
    const c = liq.cierre || {}, ok = c.recibo && c.art80 && c.baja;
    acciones = `<div class="checks"><h3>Cierre del legajo</h3>
      <label><input type="checkbox" data-cierre="recibo" ${c.recibo ? 'checked' : ''} ${est === 'cerrada' ? 'disabled' : ''}> Recibo firmado por el empleado</label>
      <label><input type="checkbox" data-cierre="art80" ${c.art80 ? 'checked' : ''} ${est === 'cerrada' ? 'disabled' : ''}> Certificado de trabajo (art. 80) entregado</label>
      <label><input type="checkbox" data-cierre="baja" ${c.baja ? 'checked' : ''} ${est === 'cerrada' ? 'disabled' : ''}> Baja informada en ARCA</label>
      ${est === 'pagada' ? `<div style="margin-top:10px"><button class="btn primary" data-act="archiveLiq" ${ok ? '' : 'disabled'}>Archivar legajo</button></div>` : '<p class="muted">Legajo archivado.</p>'}</div>
      <div class="actions"><button class="btn" data-act="print">Imprimir recibo</button></div>`;
  }
  const row = c => `<tr><td>${esc(c.desc)}${c.remunerativo ? '' : '<span class="tag">no remunerativo</span>'}</td><td class="num">${money(c.monto)}</td></tr>`;
  box.innerHTML = `
    <div class="rc-head"><h2>Liquidación final <span class="chip" style="vertical-align:middle;margin-left:6px">${LIQ_ESTADOS[est]}</span></h2>
      <div class="who"><span><b>${esc(emp.apellido)}, ${esc(emp.nombre)}</b></span><span>Legajo ${esc(emp.legajo)}</span><span>CUIL ${esc(emp.cuil || '—')}</span><span>Ingreso ${fdate(emp.fechaIngreso)}</span><span>Egreso ${fdate(inp.fecha)}</span><span>${esc(TIPOS[inp.tipo])}</span></div></div>
    ${res.avisos.length ? `<div class="avisos">${res.avisos.map(a => `<p>${esc(a)}</p>`).join('')}</div>` : ''}
    <table class="ledger"><tbody>
      <tr class="sec"><td colspan="2">Haberes</td></tr>
      ${hab.map(row).join('')}${nor.map(row).join('')}
    </tbody></table>
    <div class="neto"><span>Total a cobrar</span><strong>${money(totalDe(res))}</strong></div>
    <div class="rc-foot">Mejor remuneración ${money(res.meta.mrnh)}, antigüedad ${res.meta.anios} ${res.meta.anios === 1 ? 'año' : 'años'} (${Math.floor(res.meta.meses / 12)} años y ${res.meta.meses % 12} meses). Plazo de pago (art. 128): ${fdate(vence)}, sin contar fines de semana ni feriados.${liq && liq.pago ? ` Pagada el ${fdate(liq.pago.fecha)} por ${esc(liq.pago.medio.toLowerCase())}${liq.pago.efectivo > 0 && liq.pago.transferencia > 0 ? ` (${money(liq.pago.efectivo)} en efectivo y ${money(liq.pago.transferencia)} por transferencia)` : ''}.` : ''}</div>
    ${acciones}${simHtml}`;
}

function persistLiq(estado) {
  const L = UI.liq;
  if (!L || !L.res) { toast('Completá los datos para poder calcular.'); return; }
  const emp = S.empleados.find(x => x.id === L.empId);
  let liq = L.id ? S.liquidaciones.find(x => x.id === L.id) : null;
  const nueva = !liq;
  if (nueva) { liq = { id: uid(), empleadoId: emp.id, creada: today(), cierre: {}, pago: null }; S.liquidaciones.push(liq); L.id = liq.id; }
  liq.inputs = clone(L.inputs); liq.result = clone(L.res); liq.parametros = clone(S.parametros); liq.estado = estado; liq.actualizada = today(); liq.reparto = L.rep ? clone(L.rep) : null;
  emp.estado = 'egreso'; emp.fechaEgreso = liq.inputs.fecha; emp.tipoEgreso = liq.inputs.tipo;
  log(emp.id, `Liquidación ${nueva ? 'creada' : 'actualizada'} (${TIPOS[liq.inputs.tipo]}, egreso ${fdate(liq.inputs.fecha)}): ${LIQ_ESTADOS[estado].toLowerCase()}, total ${money(totalDe(liq.result))}`);
  save(); renderLiq(); toast(estado === 'aprobada' ? 'Liquidación aprobada' : 'Borrador guardado');
}
function pickEmp(id) {
  if (!id) { UI.liq = null; return renderLiq(); }
  const ultima = S.liquidaciones.filter(l => l.empleadoId === id).slice(-1)[0];
  UI.liq = ultima ? { id: ultima.id, empId: id } : { empId: id };
  renderLiq();
}
function onRepInput(t) {
  const L = UI.liq; if (!L || !L.res) return;
  const tot = totalDe(L.res), esE = t.id === 'rep-efe', otro = $(esE ? '#rep-tra' : '#rep-efe');
  const v = Math.min(Math.max(+t.value || 0, 0), tot);
  if ((+t.value || 0) > tot) t.value = tot;
  otro.value = r2(tot - v);
  const efe = esE ? v : r2(tot - v);
  L.rep = { efectivo: efe, transferencia: r2(tot - efe) };
}
function onPayInput(t) {
  const l = S.liquidaciones.find(x => x.id === UI.liq.id); if (!l) return;
  const tot = totalDe(l.result), otro = $(t.id === 'pay-efe' ? '#pay-tra' : '#pay-efe');
  const v = Math.min(Math.max(+t.value || 0, 0), tot);
  if ((+t.value || 0) > tot) t.value = tot;
  otro.value = r2(tot - v);
}
function onLiqInput(t) {
  if (t.id === 'l-emp') { UI.liqFrom = null; return pickEmp(t.value); }

function paintRotacion() {
  const loc = UI.stRotLocal;
  const meses = []; const d = new Date(); d.setDate(1);
  for (let i = 11; i >= 0; i--) { const m = new Date(d.getFullYear(), d.getMonth() - i, 1); meses.push(ym(m)); }
  const enLocal = e => (e.local || '').trim() === loc;
  const altasPorMes = {}, bajasPorMes = {};
  meses.forEach(m => { altasPorMes[m] = 0; bajasPorMes[m] = 0; });
  S.empleados.filter(enLocal).forEach(e => { if (e.fechaIngreso) { const m = e.fechaIngreso.slice(0, 7); if (m in altasPorMes) altasPorMes[m]++; } });
  S.liquidaciones.forEach(l => { const emp = S.empleados.find(x => x.id === l.empleadoId); if (emp && enLocal(emp) && l.inputs?.fecha) { const m = l.inputs.fecha.slice(0, 7); if (m in bajasPorMes) bajasPorMes[m]++; } });
  const totAltas = Object.values(altasPorMes).reduce((s, v) => s + v, 0), totBajas = Object.values(bajasPorMes).reduce((s, v) => s + v, 0);
  const max = Math.max(1, ...meses.map(m => Math.max(altasPorMes[m], bajasPorMes[m])));
  $('#st-rot').innerHTML = `
    <div class="legend"><span><i style="background:#0D6B58"></i>Ingresos (${totAltas})</span><span><i style="background:#B23A2B"></i>Egresos (${totBajas})</span></div>
    <div style="display:grid;grid-template-columns:repeat(${meses.length},1fr);gap:5px;align-items:end;height:140px;padding-top:6px">
      ${meses.map(m => `<div style="display:flex;gap:2px;align-items:end;height:100%;justify-content:center"><div title="Ingresos ${fper(m)}: ${altasPorMes[m]}" style="width:9px;background:#0D6B58;border-radius:2px 2px 0 0;height:${Math.max(2, altasPorMes[m] / max * 100)}%"></div><div title="Egresos ${fper(m)}: ${bajasPorMes[m]}" style="width:9px;background:#B23A2B;border-radius:2px 2px 0 0;height:${Math.max(2, bajasPorMes[m] / max * 100)}%"></div></div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(${meses.length},1fr);gap:5px;margin-top:4px">${meses.map(m => `<div style="font-size:10px;color:var(--muted);text-align:center;writing-mode:vertical-rl">${m.slice(2)}</div>`).join('')}</div>`;
}
function paintAntig() {

/* ================= Planilla de sueldos (Excel) =================

      xlsHoja(wb, 'Por mes', 'Liquidaciones por mes de egreso', sub, ['Mes de egreso', 'Total'], liqPorMes(f).map(([m, v]) => [fper(m), v]), { w: [30, 20], num: [1], tot: ['TOTAL', tot] });
      await xlsGuardar(wb, `liquidaciones${ov ? '-' + INF_ARCH[ov.tipo] : ''}-${today()}.xlsx`);
    } catch (e) { console.error(e); toast(e.message || 'No se pudo generar el Excel.'); }
  },
  empXlsx: async () => {
    const rows = UI.rowsVis || []; if (!rows.length) return toast('No hay empleados para exportar.');
    try {
      const G = GEMP, ids = ordenColsEmp().filter(id => colVisible(id) && G[id]), EJ = await cargarExcelJS(), wb = new EJ.Workbook();
      xlsHoja(wb, 'Empleados', 'Nómina de colaboradores', `${rows.length} registro${rows.length === 1 ? '' : 's'}  ·  Emitido el ${fdate(today())}  ·  Acurio Restaurantes`, ['Legajo', 'Nombre', ...ids.map(id => G[id][0])],
        rows.map(e => [e.legajo || '', `${e.apellido}, ${e.nombre}`, ...ids.map(id => G[id][1](e) ?? '')]), { locs: rows.map(e => e.local), ctr: [ids.indexOf('alta') + 2].filter(i => i > 1) });
      await xlsGuardar(wb, `empleados-${today()}.xlsx`);
    } catch (e) { console.error(e); toast(e.message || 'No se pudo generar el Excel.'); }
  },
  estXlsx: async () => {
    try {
      const secs = estSecs(); if (!secs.length) return toast('No hay datos para exportar.');
      const EJ = await cargarExcelJS(), wb = new EJ.Workbook(), usados = new Set(), sub = `Estadística  ·  Emitido el ${fdate(today())}  ·  Acurio Restaurantes`, num = v => { const n = Number(String(v).replace(/[^\d,-]/g, '').replace(',', '.')); return isNaN(n) ? v : n; };
      secs.forEach((x, i) => {
        let n = x.t.replace(/[\\/?*[\]:]/g, '').slice(0, 27) || 'Hoja'; while (usados.has(n)) n = n.slice(0, 24) + '_' + i; usados.add(n);
        xlsHoja(wb, n, x.t, x.n ? sub + '  ·  ' + x.n : sub, x.head, x.body.map(r => r.map((v, j) => (x.num || []).includes(j) ? num(v) : /^\d+$/.test(v) ? +v : v)), { num: x.num, ctr: x.ctr, loc: x.loc });
      });
      await xlsGuardar(wb, `estadistica-${today()}.xlsx`);
    } catch (e) { console.error(e); toast(e.message || 'No se pudo generar el Excel.'); }
  },
  savePar: () => {
    const g = id => +$('#' + id).value || 0, P = S.parametros;
    P.mesesPrueba = g('par-prueba'); P.topeCCT = g('par-tope');
    P.vacaciones = [{ hasta: 5, dias: g('par-v1') }, { hasta: 10, dias: g('par-v2') }, { hasta: 20, dias: g('par-v3') }, { hasta: 999, dias: g('par-v4') }];
    if ($('#par-histmeses')) P.historialMesesNube = g('par-histmeses');
    save(); toast('Parámetros guardados');
  },
  jbTamano: async b => {
    b.textContent = 'Calculando…'; b.disabled = true;
    try {
      const full = await gzComp(JSON.stringify(S)), nube = await gzComp(JSON.stringify(Object.assign({}, S, { historial: historialParaNube(S.historial) })));
      const kb = n => (n / 1024).toFixed(1) + ' KB';
      $('#jb-tam').innerHTML = `Comprimido: ${kb(full.length)} completo, ${kb(nube.length)} lo que se sube a la nube (el límite gratis de JSONBin es 100 KB por bin, ya cifrado). <button class="btn sm" type="button" data-act="jbTamano" style="margin-left:6px">Recalcular</button>`;
    } catch (e) { toast('No se pudo calcular el tamaño.'); b.disabled = false; b.textContent = 'Calcular tamaño'; }
  },
  jbConectar: () => {
    const v = id => $('#' + id).value.trim();
    const cfg = { apiKey: v('jb-key'), clave: $('#jb-clave').value, binId: v('jb-bin') };
    if (!cfg.apiKey || !cfg.clave) { toast('Completá la X-MASTER-KEY y la clave de cifrado.'); return; }
    if (cfg.clave.length < 8) { toast('La clave de cifrado debe tener al menos 8 caracteres.'); return; }
    if (!window.crypto || !crypto.subtle) { toast('Este navegador no permite cifrar. Abrí el archivo desde https o localhost.'); return; }
    try { localStorage.setItem(JB_KEY, JSON.stringify(cfg)); } catch (e) { toast('No se pudo guardar la configuración en este navegador.'); return; }
    jbReady = false; jbInit(); renderPar(); toast('Conectando con JSONBin…');
  },
  jbSubir: () => { if (!confirm('Se van a reemplazar los datos de la nube por los de este navegador. ¿Continuar?')) return; jbPush(); clearTimeout(jbTimer); jbUpload(); },
  jbTraer: () => { jbPull('force'); },
  jbDesconectar: () => { jbDisconnect(); renderPar(); toast('JSONBin desconectado (los datos de la nube no se borran)'); },
  export: () => {
    S.lastExport = new Date().toISOString(); save(); paintRespaldo();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
    a.download = `rrhh-ciclo-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  impEmpPlantilla: () => {
    const headers = ['Legajo', 'Nombre', 'Apellido', 'DNI', 'CUIL', 'Fecha nacimiento', 'Teléfono', 'Email', 'Domicilio',
      'Contacto emergencia', 'Teléfono emergencia', 'CBU', 'Banco', 'Estado', 'Local', 'Razón social', 'Puesto', 'Alta', 'Categoría CCT',
      'Modalidad', 'Fecha de ingreso', 'Sueldo', 'Vto. DNI / precaria', 'Vto. libreta sanitaria', 'Régimen 710'];
    const ejemplo = ['', 'Juan', 'Pérez', '30111222', '', '', '', '', '', '', '', '', '', 'activo', 'BCP', 'Sabores Incas', 'Camarero', '', '', '', '2024-03-01', 500000, '', '', ''];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([headers, ejemplo]), 'Empleados');
    XLSX.writeFile(wb, 'plantilla-empleados.xlsx');
  }
};

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e); });
const NAV_ACTS = new Set(['tab', 'back', 'openEmp', 'newEmp', 'openLiq']);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !UI.dirty || !NAV_ACTS.has(b.dataset.act)) return;
  if (!confirm('Tenés cambios sin guardar en el legajo. ¿Salir sin guardar?')) { e.stopPropagation(); e.preventDefault(); } else UI.dirty = false;
}, true);
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#emp-form')) UI.dirty = true; });
window.addEventListener('beforeunload', e => { if (UI.dirty) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('tr[data-act]')) e.target.click(); });
const UC_EXCLUDE = new Set(['email', 'date', 'month', 'number', 'search', 'password', 'checkbox', 'radio', 'file', 'color', 'time', 'datetime-local', 'range', 'url']);
document.addEventListener('input', e => {
  const t = e.target;
  if ((t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && !UC_EXCLUDE.has(t.type))) && !t.readOnly) {
    const up = t.value.toUpperCase();
    if (up !== t.value) { const p = t.selectionStart, q = t.selectionEnd; t.value = up; t.setSelectionRange(p, q); }
  }
  if (t.id === 'q') { UI.q = t.value; paintRows(); }
  else if (t.id === 'fe') { UI.fe = t.value; paintRows(); }
  else if (t.dataset && t.dataset.f !== undefined) { UI.f[t.dataset.f] = t.value; paintRows(); }
  else if (t.id === 'vista-sel') { const v = (S.vistasEmp || []).find(x => x.id === t.value); UI.vistaSel = t.value; if (v) { UI.q = v.q; UI.fe = v.fe; UI.f = clone(v.f); } renderEmp(); }
  else if (t.id && t.id.startsWith('ll-')) { UI.ll[t.id.slice(3)] = t.value; paintLiqLista(); }
  else if (t.id === 'st-local') { UI.stLocal = t.value; paintEst(); }
  else if (t.id === 'st-puesto') { UI.stPuesto = t.value; paintEst(); }
  else if (t.id === 'sol-local') { UI.solLocal = t.value; paintSolicitudes(); }
  else if (t.id === 'st-rot-local') { UI.stRotLocal = t.value; paintRotacion(); }
  else if (t.id === 'cn-local') { UI.costoLocal = t.value; paintCostoNomina(); }
  else if (t.id === 'cn-puesto') { UI.costoPuesto = t.value; paintCostoNomina(); }
  else if (t.id === 'per-desde') { UI.perDesde = t.value; paintPeriodo(); }
  else if (t.id === 'per-hasta') { UI.perHasta = t.value; paintPeriodo(); }
  else if (t.id === 'per-local') { UI.perLocal = t.value; paintPeriodo(); }
  else if (t.id === 'h-emp') { UI.hEmp = t.value; paintHist(); }
  else if (t.id === 'pl-mes') UI.planillaMes = t.value;
  else if (t.name === 'fechaIngreso' && t.closest('#emp-form')) $('#fin-prueba').value = t.value ? fdate(finDePrueba(t.value, S.parametros.mesesPrueba)) : '—';
  else if (t.id === 'rep-efe' || t.id === 'rep-tra') onRepInput(t);
  else if (t.id === 'pay-efe' || t.id === 'pay-tra') onPayInput(t);
  else if (t.closest && t.closest('#liq-form')) onLiqInput(t);
  else if (t.dataset && t.dataset.cierre) {
    const l = S.liquidaciones.find(x => x.id === UI.liq.id); l.cierre = l.cierre || {}; l.cierre[t.dataset.cierre] = t.checked; save(); updateLiq();
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.col) {
    S.parametros.colsEmp = S.parametros.colsEmp || {};
    S.parametros.colsEmp[e.target.dataset.col] = e.target.checked;
    save(); toast('Columnas actualizadas'); return;
  }
  if (e.target.id !== 'imp-emp') return;
  const file = e.target.files[0]; if (!file) return;
  const nombreSpan = $('#imp-emp-nombre'); if (nombreSpan) nombreSpan.textContent = file.name;
  const rd = new FileReader();
  rd.onload = () => {
    const resBox = () => $('#imp-emp-resultado');
    try {
      const wb = XLSX.read(rd.result, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: true });
      if (!rows.length) { if (resBox()) resBox().innerHTML = '<span style="color:var(--danger)">El archivo no tiene filas de datos.</span>'; return; }
      const colMap = impEmpColMap(Object.keys(rows[0]));
      const errores = [], cambios = [];
      rows.forEach((row, i) => {
        const d = {}; Object.entries(colMap).forEach(([h, f]) => d[f] = row[h]);
        const nombre = String(d.nombre ?? '').trim(), apellido = String(d.apellido ?? '').trim(), dni = String(d.dni ?? '').trim();
        if (!nombre || !apellido || !dni) { errores.push(`Fila ${i + 2}: falta nombre, apellido o DNI.`); return; }
        const legajoRaw = String(d.legajo ?? '').trim();
        let prev = null;
        if (legajoRaw) prev = S.empleados.find(x => x.legajo === legajoRaw);
        if (!prev && dni) prev = S.empleados.find(x => x.dni === dni);
        const legajo = legajoRaw || (prev ? prev.legajo : String(S.empleados.reduce((m, x) => Math.max(m, parseInt(x.legajo) || 0), 0) + cambios.filter(c => c.isNew).length + 1).padStart(4, '0'));
        if (S.empleados.some(x => x.legajo === legajo && (!prev || x.id !== prev.id))) { errores.push(`Fila ${i + 2}: el legajo ${legajo} ya está usado por otro empleado.`); return; }
        const nuevo = Object.assign({}, prev || { id: uid(), creado: today() }, {
          legajo, nombre, apellido, dni,
          cuil: impTxt(d.cuil, prev && prev.cuil), fechaNac: impFecha(d.fechaNac) || (prev ? prev.fechaNac : ''),
          tel: impTxt(d.tel, prev && prev.tel), email: impTxt(d.email, prev && prev.email), domicilio: impTxt(d.domicilio, prev && prev.domicilio),
          emergenciaNombre: impTxt(d.emergenciaNombre, prev && prev.emergenciaNombre), emergenciaTel: impTxt(d.emergenciaTel, prev && prev.emergenciaTel),
          cbu: impTxt(d.cbu, prev && prev.cbu), banco: impTxt(d.banco, prev && prev.banco),
          estado: (d.estado !== undefined && String(d.estado).trim() !== '' && impEstado(d.estado)) || (prev ? prev.estado : 'activo'),
          local: d.local !== undefined && String(d.local).trim() !== '' ? canonLocal(d.local) : (prev ? prev.local : ''),
          razonSocial: d.razonSocial !== undefined && String(d.razonSocial).trim() !== '' ? canonRazon(d.razonSocial) : (prev ? prev.razonSocial : ''),
          puesto: d.puesto !== undefined && String(d.puesto).trim() !== '' ? impPuesto(d.puesto) : (prev ? prev.puesto : ''),
          alta: d.alta !== undefined && String(d.alta).trim() !== '' ? impAlta(d.alta) : (prev ? prev.alta : ''),
          categoriaCCT: impTxt(d.categoriaCCT, prev && prev.categoriaCCT), modalidad: impTxt(d.modalidad, prev && prev.modalidad),
          fechaIngreso: impFecha(d.fechaIngreso) || (prev ? prev.fechaIngreso : ''),
          sueldoActual: d.sueldoActual !== undefined && String(d.sueldoActual).trim() !== '' ? impNum(d.sueldoActual) : (prev ? prev.sueldoActual : 0),
          docs: prev ? prev.docs : { dni: false, cuil: false, contrato: false },
          libretaSanitariaVenc: impFecha(d.libretaSanitariaVenc) || (prev ? prev.libretaSanitariaVenc : ''),
          dniVenc: impFecha(d.dniVenc) || (prev ? prev.dniVenc : ''),
          rifl: d.rifl !== undefined && String(d.rifl).trim() !== '' ? impBool(d.rifl) : (prev ? !!prev.rifl : false)
        });
        cambios.push({ prev, nuevo, isNew: !prev });
      });
      if (!cambios.length) {
        if (resBox()) resBox().innerHTML = `<span style="color:var(--danger)">No se pudo importar ninguna fila.</span>${errores.length ? '<br>' + errores.slice(0, 12).map(esc).join('<br>') : ''}`;
        e.target.value = ''; return;
      }
      const nuevos = cambios.filter(c => c.isNew).length, actualizados = cambios.length - nuevos;
      if (!confirm(`Se van a crear ${nuevos} legajo(s) nuevo(s) y actualizar ${actualizados}.${errores.length ? ' ' + errores.length + ' fila(s) se van a saltear por datos incompletos.' : ''} ¿Continuar?`)) { e.target.value = ''; return; }
      cambios.forEach(({ prev, nuevo, isNew }) => {
        if (isNew) { S.empleados.push(nuevo); log(nuevo.id, `Legajo creado por importación (${ESTADOS[nuevo.estado] || nuevo.estado})`); }
        else { Object.assign(prev, nuevo); log(nuevo.id, 'Legajo actualizado por importación'); }
        registrarBancoNuevo(nuevo.banco);
      });
      save(); migrarDatos(); paintRespaldo(); go(UI.tab);
      const box = resBox();
      if (box) box.innerHTML = `<span style="color:var(--ok)">Importación lista: ${nuevos} nuevo(s), ${actualizados} actualizado(s).</span>` +
        (errores.length ? `<br><span style="color:var(--signal)">${errores.slice(0, 12).map(esc).join('<br>')}${errores.length > 12 ? `<br>y ${errores.length - 12} más…` : ''}</span>` : '');
      toast('Empleados importados');
    } catch (err) { if (resBox()) resBox().innerHTML = `<span style="color:var(--danger)">No se pudo leer el archivo (${esc(err.message || 'formato no reconocido')}).</span>`; }
    e.target.value = '';
  };
  rd.readAsArrayBuffer(file);
});
$('#imp').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.empleados)) throw new Error('formato');
      if (!confirm(`Se van a reemplazar los datos actuales por los del archivo (${d.empleados.length} empleados). ¿Continuar?`)) return;
      S = normalize(d); migrarDatos(); save(); UI.detail = null; UI.liq = null; paintRespaldo(); go(UI.tab); toast('Respaldo importado');
    } catch (err) { toast('El archivo no es un respaldo válido.'); }
    e.target.value = '';
  };
  rd.readAsText(file);
});

/* Arrastrar y soltar para ordenar los puestos y las columnas (en pantallas táctiles se usan las flechas) */
let dragI = null, dragK = null;
const ordItem = e => { const el = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentElement); return el && el.closest ? el.closest('.ord-item') : null; };
const ORD_KINDS = {
  puesto: { get: ordenPuestos, set: v => S.ordenPuestos = v, paint: paintOrdenPuestos },
  local: { get: ordenLocales, set: v => S.ordenLocales = v, paint: paintOrdenLocales },
  col: { get: ordenColsEmp, set: v => S.ordenColsEmp = v, paint: paintOrdenCols },
};
document.addEventListener('dragstart', e => { const li = ordItem(e); if (!li) return; dragI = +li.dataset.pi; dragK = li.dataset.kind; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragI)); } catch (_) {} li.classList.add('dragging'); });
document.addEventListener('dragover', e => { const li = ordItem(e); if (!li || dragI === null || li.dataset.kind !== dragK) return; e.preventDefault(); $$('.ord-item.over').forEach(x => { if (x !== li) x.classList.remove('over'); }); li.classList.add('over'); });
document.addEventListener('drop', e => {
  const li = ordItem(e); if (!li || dragI === null || li.dataset.kind !== dragK) return; e.preventDefault();
  const K = ORD_KINDS[dragK]; if (!K) return;
  const to = +li.dataset.pi, ord = K.get();
  if (to !== dragI) { const [m] = ord.splice(dragI, 1); ord.splice(to, 0, m); K.set(ord); save(); }
  dragI = null; dragK = null; K.paint();
});
document.addEventListener('dragend', () => { dragI = null; dragK = null; $$('.ord-item').forEach(x => x.classList.remove('dragging', 'over')); });

function migrarDatos() {                                      // "E. Camarero" → "Camarero"; "bcp" → "BCP"
  let cambio = false;
  S.empleados.forEach(e => {
    if (e.puesto && !PUESTOS.includes(e.puesto)) {
      const n = e.puesto.replace(/^[A-Z]{1,2}\.\s*(?:\d+\s+)?/, '').trim();
      if (PUESTOS.includes(n)) { e.puesto = n; cambio = true; }
    }
    if (e.local && canonLocal(e.local) !== e.local) { e.local = canonLocal(e.local); cambio = true; }
    if (e.razonSocial && canonRazon(e.razonSocial) !== e.razonSocial) { e.razonSocial = canonRazon(e.razonSocial); cambio = true; }
  });
  if (cambio) save();
}
migrarDatos();
paintRespaldo();
go('emp');
jbInit();
</script>
