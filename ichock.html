<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Asistencia Barra Chalaca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: barra de madera. Arriba el selector de locales (Todos + 4), abajo dos áreas (Salón, Cocina) y en cada una una tarjeta por puesto con dos columnas: presentes y ausentes. */
:root{
  --navy:#0B2E4F; --ocean:#145C82; --coral:#E8492B; --sand:#F4E9D4; --gold:#F2B705;
  --wood-a:#E4D2A6; --wood-b:#D8C293; --paper:#FFFDF7;
  --ok:#1E7F5C; --ok-bg:#E4F3EA; --no-bg:#FDECE7; --no-ink:#B8341A;
  --font-logo:'Alfa Slab One',serif; --font-display:'Anton',sans-serif; --font-body:'DM Sans',sans-serif;
}
html{ background:var(--wood-a); }
body{ background:var(--wood-a); color:var(--navy); }

/* =====================================================================
   ESTILO BARRA CHALACA — Acurio Restaurantes
   Extraído de "Recursos — Acurio Restaurantes". Reglas y valores copiados
   tal cual del original; solo se quitó lo de los otros dos locales y la
   barra selectora de marcas.

   PALETA   Barra Chalaca: navy #0B2E4F · ocean #145C82 · coral #E8492B · sand #F4E9D4 · gold #F2B705 · madera #E4D2A6/#D8C293 · papel #FFFDF7
   FUENTES  Alfa Slab One (logo) + Anton (títulos, botones, sello, etiquetas) + DM Sans (texto)

   USO: poné class="page active theme-barra" en el contenedor de página.
        Modal de formulario: <div class="ov ov-barra"><div class="sheet">…</div></div>
   ===================================================================== */


*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans', sans-serif; padding:0;}

/* ============ BASE COMPARTIDA ============ */
.page{ padding:36px 16px 60px; min-height:100vh; }
.wrap{ max-width:1040px; margin:0 auto; }
.navbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; }
.brand{ display:flex; align-items:center; gap:14px; }
.brand .icon{ width:46px; height:46px; flex-shrink:0; }
.brand .text{ display:flex; flex-direction:column; line-height:1; }
.brand .sub{ margin-top:8px; font-size:10.5px; letter-spacing:2.5px; font-weight:700; text-transform:uppercase; }
.stamp{ font-family:'Anton',sans-serif; font-size:14px; letter-spacing:1.5px; white-space:nowrap; }
.doodle-row{ display:flex; align-items:center; justify-content:center; gap:24px; margin-bottom:6px; opacity:.96; }
.doodle-row svg{ height:52px; width:auto; }
.doodle-title{ font-family:'Anton',sans-serif; letter-spacing:1px; text-transform:uppercase; }

.toolbar{ display:flex; justify-content:center; gap:10px; margin:18px 0 18px; flex-wrap:wrap; }
.count-pill{ display:flex; align-items:center; font-size:12.5px; font-weight:600; padding:5px 14px; border-radius:999px; background:var(--paper); border:1.5px solid var(--c1); color:var(--ink); }

.files{ display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px; margin-top:6px; }
.file-card{ position:relative; background:var(--paper); color:var(--ink); padding:18px 18px 16px; display:flex; flex-direction:column; gap:8px; }
.file-tag{ align-self:flex-start; font-family:'Anton',sans-serif; font-size:10px; letter-spacing:1.5px; padding:3px 10px; border-radius:999px; background:var(--c1); color:var(--paper); }
.file-name{ font-family:'Anton',sans-serif; font-size:20px; letter-spacing:.5px; color:var(--c1); line-height:1.15; }
.file-desc{ font-size:13.5px; line-height:1.4; opacity:.85; flex:1; }
.dl-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; margin-top:6px; text-decoration:none; cursor:pointer;
  font-family:'Anton',sans-serif; font-size:13px; letter-spacing:1px; color:#fff; background:var(--c2);
  border:2px solid var(--c1); border-radius:999px; padding:10px 18px; box-shadow:3px 3px 0 rgba(0,0,0,0.18);
  transition:transform .12s ease, opacity .15s ease;
}
.dl-btn:hover{ opacity:.88; } .dl-btn:active{ transform:scale(.97); }
.empty{ grid-column:1/-1; text-align:center; padding:46px 20px; background:rgba(255,255,255,0.6); border:2px dashed var(--c1); border-radius:14px; color:var(--ink); }
.empty .big{ font-family:'Anton',sans-serif; font-size:22px; letter-spacing:1px; color:var(--c1); text-transform:uppercase; margin-bottom:6px; }
.empty .small{ font-size:13.5px; opacity:.8; }

footer{ margin-top:28px; display:flex; align-items:center; justify-content:flex-end; gap:10px; font-size:11.5px; font-style:italic; }
footer svg{ height:22px; width:auto; opacity:.85; }

/* ======================================================= */
/* ================= THEME 1: BARRA CHALACA ================ */
/* ======================================================= */
.theme-barra{
  --c1:#0B2E4F; --c2:#E8492B; --paper:#FFFDF7; --ink:#0B2E4F;
  --navy:#0B2E4F; --ocean:#145C82; --coral:#E8492B; --sand:#F4E9D4; --gold:#F2B705; --wood-a:#E4D2A6; --wood-b:#D8C293;
  background-color:var(--wood-a);
  background-image:
    repeating-linear-gradient(180deg,var(--wood-a) 0px,var(--wood-a) 46px,var(--wood-b) 46px,var(--wood-b) 48px),
    radial-gradient(circle at 10% 5%,rgba(255,255,255,0.25) 0%,transparent 45%),
    radial-gradient(circle at 90% 95%,rgba(0,0,0,0.06) 0%,transparent 45%);
  color:var(--ink);
}
.theme-barra .navbar{ background:var(--sand); border-radius:14px; padding:16px 26px; box-shadow:0 8px 0 rgba(7,32,56,0.12),0 14px 26px rgba(11,46,79,0.18); border:2px solid var(--navy); }
.theme-barra .brand .logo{ font-family:'Alfa Slab One',serif; font-size:clamp(24px,3.4vw,34px); color:var(--coral); text-shadow:2px 2px 0 var(--navy); letter-spacing:.5px; }
.theme-barra .brand .sub{ color:var(--ocean); letter-spacing:3px; font-size:11px; }
.theme-barra .stamp{ color:var(--sand); background:var(--coral); padding:10px 22px; border-radius:999px; transform:rotate(-3deg); border:2px dashed var(--sand); box-shadow:3px 3px 0 var(--navy); }
.theme-barra .stripe{ height:8px; margin:22px 0 20px; border-radius:4px; background:repeating-linear-gradient(90deg,var(--navy) 0 22px,var(--coral) 22px 26px); box-shadow:0 2px 0 rgba(0,0,0,0.08); }
.theme-barra .doodle-title{ font-size:22px; color:var(--navy); }
.theme-barra .count-pill{ background:rgba(255,255,255,0.55); }
.theme-barra .file-card{ border:2px solid var(--navy); border-radius:12px; box-shadow:0 6px 0 rgba(7,32,56,0.14),0 12px 22px rgba(11,46,79,0.16); background-image:radial-gradient(circle at 90% 10%,rgba(20,92,130,0.05) 0%,transparent 55%); }
.theme-barra .file-tag{ background:var(--coral); transform:rotate(-2deg); border:1px dashed rgba(255,255,255,0.7); }
.theme-barra footer{ color:var(--ocean); }

@media (max-width:700px){
  .page{ padding:22px 12px 44px; }
  .navbar{ padding:14px 18px !important; }
  .brand .icon{ width:34px !important; height:34px !important; }
  .doodle-row{ gap:10px; } .doodle-row svg{ height:34px !important; }
  .theme-barra .doodle-title{ font-size:15px; }
  .files{ grid-template-columns:1fr; }
  footer{ justify-content:center; }
}

/* ============ COMPLETAR Y PDF ============ */
.btn-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.btn-row.uno{ grid-template-columns:1fr; }
.btn-row .dl-btn{ margin-top:0; padding:9px 8px; font-size:12px; }
.dl-btn.alt{ background:var(--paper); color:var(--c1); }
.dl-btn.main{ margin-top:8px; }

.ov{ position:fixed; inset:0; z-index:100; background:rgba(7,20,35,.62); display:flex; align-items:flex-end; justify-content:center; font-family:'DM Sans',sans-serif; }
.ov.top{ z-index:110; }
.sheet{ background:#fff; color:#1c2630; width:100%; max-width:860px; height:94vh; display:flex; flex-direction:column; border-radius:16px 16px 0 0; overflow:hidden; border:3px solid var(--c1); }
@media(min-width:700px){ .ov{ align-items:center; } .sheet{ border-radius:16px; height:90vh; } }
.sheet-h{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:12px 16px; background:var(--c1); color:#fff; }
.sheet-h .t{ font-family:'Anton',sans-serif; font-size:17px; letter-spacing:.8px; line-height:1.15; }
.sheet-h .t small{ display:block; font-family:'DM Sans',sans-serif; font-size:11.5px; letter-spacing:0; opacity:.85; margin-top:2px; }
.bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.bar-btn{ font-family:'Anton',sans-serif; font-size:12.5px; letter-spacing:1px; border:2px solid #fff; background:var(--c2); color:#fff; border-radius:999px; padding:8px 14px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
.bar-btn.alt{ background:#fff; color:var(--c1); }
.bar-btn:active{ transform:scale(.97); }
.x{ background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:999px; width:34px; height:34px; font-size:17px; cursor:pointer; }
.sheet-b{ overflow:auto; padding:16px; background:var(--fondo); flex:1; }
.sec{ background:#fff; border:2px solid var(--c1); border-radius:12px; padding:14px; margin-bottom:14px; }
.sec h3{ font-family:'Anton',sans-serif; font-weight:400; font-size:15px; letter-spacing:1px; color:var(--c1); margin-bottom:12px; padding-bottom:6px; border-bottom:3px solid var(--c2); text-transform:uppercase; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
.fld{ min-width:0; }
.fld.wide{ grid-column:1/-1; }
.fld label{ display:block; font-size:12px; font-weight:700; color:var(--c1); margin-bottom:4px; }
.fld .tag{ font-weight:400; font-size:10.5px; opacity:.65; margin-left:6px; font-style:italic; }
.fld input,.fld select,.fld textarea{ width:100%; font:16px 'DM Sans',sans-serif; padding:9px 10px; border:2px solid #c9ced6; border-radius:8px; background:#fff; color:#1c2630; }
.fld input:focus,.fld select:focus,.fld textarea:focus{ outline:none; border-color:var(--c2); }
.fld textarea{ resize:vertical; min-height:96px; }
.tbl{ overflow-x:auto; border:2px solid var(--c1); border-radius:8px; }
.tbl table{ border-collapse:collapse; width:100%; min-width:430px; }
.tbl th{ background:var(--c1); color:#fff; font-size:11px; letter-spacing:.5px; padding:6px; text-transform:uppercase; }
.tbl td{ border-top:1px solid #d5d9df; padding:3px; }
.tbl td input{ border-width:1px; padding:6px 7px; font-size:15px; }
.tbl td.st{ background:var(--fondo); font-weight:700; color:var(--c1); font-size:13px; padding:6px 8px; white-space:nowrap; }
.tbl td.na{ text-align:center; font-size:11px; font-style:italic; color:#8a929c; }
.sheet-f{ display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; padding:12px 16px; border-top:3px solid var(--c1); background:#fff; }
.sheet-f .dl-btn{ margin-top:0; }
.hint{ font-size:12px; color:#5a6470; margin:0 2px 12px; }
.warn{ background:#FFF3CD; color:#664d03; font-size:13px; padding:8px 14px; border-bottom:2px solid #e6c85c; }
.sheet iframe{ flex:1; width:100%; border:0; background:#555; }

/* =====================================================================
   AÑADIDO (no estaba en el CSS original)
   El original creaba el modal con JavaScript y le inyectaba estas
   variables (--c1, --c2, --fondo, --paper). Acá quedan como clase.
   ===================================================================== */
.ov-barra{ --c1:#0B2E4F; --c2:#E8492B; --fondo:#F4E9D4; --paper:#fff; }

/* =====================================================================
   DIBUJITOS COMO CLASES (AÑADIDO — en el original eran <svg> en el HTML)
   Mismos dibujos, colores y tamaños que el original.
   Uso:
     <div class="doodle-row">
       <div class="dd dd-izq"></div>
       <div class="doodle-title">Texto</div>
       <div class="dd dd-der"></div>
     </div>
     <footer>Texto <div class="dd-pie"></div></footer>
   ===================================================================== */
.dd{ display:block; flex-shrink:0; background-repeat:no-repeat; background-position:center; background-size:100% 100%; height:52px; aspect-ratio:120/60; }
.dd-izq{ background-image:url("data:image/svg+xml,%3Csvg viewBox=%220 0 120 60%22 xmlns=%22http://www.w3.org/2000/svg%22%3E %3Cpath d=%22M10 30 C 30 5, 70 5, 95 30 C 70 55, 30 55, 10 30 Z%22 fill=%22none%22 stroke=%22%23145C82%22 stroke-width=%223%22/%3E %3Cpath d=%22M95 30 L118 15 L112 30 L118 45 Z%22 fill=%22%23F2B705%22 stroke=%22%23145C82%22 stroke-width=%222%22/%3E %3Ccircle cx=%2234%22 cy=%2226%22 r=%223.2%22 fill=%22%230B2E4F%22/%3E %3Cpath d=%22M15 30 Q35 40 55 30%22 fill=%22none%22 stroke=%22%23E8492B%22 stroke-width=%222%22/%3E %3C/svg%3E"); }
.dd-der{ background-image:url("data:image/svg+xml,%3Csvg viewBox=%220 0 120 60%22 xmlns=%22http://www.w3.org/2000/svg%22%3E %3Cpath d=%22M110 30 C 90 5, 50 5, 25 30 C 50 55, 90 55, 110 30 Z%22 fill=%22none%22 stroke=%22%23145C82%22 stroke-width=%223%22/%3E %3Cpath d=%22M25 30 L2 15 L8 30 L2 45 Z%22 fill=%22%23F2B705%22 stroke=%22%23145C82%22 stroke-width=%222%22/%3E %3Ccircle cx=%2286%22 cy=%2226%22 r=%223.2%22 fill=%22%230B2E4F%22/%3E %3Cpath d=%22M105 30 Q85 40 65 30%22 fill=%22none%22 stroke=%22%23E8492B%22 stroke-width=%222%22/%3E %3C/svg%3E"); }
.dd-pie{ display:block; flex-shrink:0; height:22px; aspect-ratio:40/20; opacity:.85; background-repeat:no-repeat; background-size:100% 100%; background-image:url("data:image/svg+xml,%3Csvg viewBox=%220 0 40 20%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cpath d=%22M2 14 C 8 4, 16 4, 20 14 C 24 4, 32 4, 38 14%22 fill=%22none%22 stroke=%22%23145C82%22 stroke-width=%222.5%22/%3E%3C/svg%3E"); }
@media (max-width:700px){ .doodle-row .dd{ height:34px !important; } }


/* ===================== AGREGADO PARA EL VISOR DE ASISTENCIA ===================== */
.page{
  padding-block:36px 60px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.fecha{ text-align:center; font-weight:700; letter-spacing:.5px; color:var(--navy); margin:2px 0 0; }

.locales{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin:18px 0 4px; }
.loc{
  appearance:none; text-align:left; cursor:pointer; font:inherit; min-width:0;
  background:var(--paper); color:var(--navy); border:2px solid var(--navy); border-radius:12px;
  padding:12px 14px; display:flex; flex-direction:column; gap:6px;
  box-shadow:0 5px 0 rgba(7,32,56,.14), 0 10px 18px rgba(11,46,79,.14);
  transition:transform .12s ease;
}
.loc:hover{ transform:translateY(-2px); }
.loc:active{ transform:translateY(1px); }
.loc .ln{ font-family:var(--font-display); font-size:19px; letter-spacing:.6px; line-height:1.1; text-transform:uppercase; overflow-wrap:anywhere; }
.loc .lc{ font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; }
.loc .lc small{ font-size:12px; font-weight:500; opacity:.75; }
.loc .bar-t{ display:block; height:8px; border-radius:4px; background:rgba(11,46,79,.14); overflow:hidden; }
.loc .bar-f{ display:block; height:100%; background:repeating-linear-gradient(90deg,var(--ok) 0 14px,#176A4C 14px 17px); }
.loc[aria-pressed="true"]{ background:var(--navy); color:var(--sand); }
.loc[aria-pressed="true"] .bar-t{ background:rgba(244,233,212,.25); }
.loc[aria-pressed="true"] .bar-f{ background:repeating-linear-gradient(90deg,var(--gold) 0 14px,#C99A04 14px 17px); }

.toolbar{ align-items:center; }
.pills{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.count-pill b{ font-family:var(--font-display); font-weight:400; letter-spacing:.8px; margin-left:6px; font-size:14px; font-variant-numeric:tabular-nums; }
.count-pill.si b{ color:var(--ok); }
.count-pill.no b{ color:var(--no-ink); }
.toolbar .dl-btn{ margin-top:0; padding:7px 16px; font-size:12px; }

.avisos{ display:flex; flex-direction:column; gap:8px; }
.aviso{ padding:10px 14px; border-radius:10px; border:2px solid #E6C85C; background:#FFF3CD; color:#664D03; font-size:13px; line-height:1.4; }
.aviso.err{ background:var(--no-bg); border-color:var(--coral); color:#7A1F0E; }

.area{ margin-top:24px; }
.area-h{
  display:flex; align-items:center; justify-content:space-between; gap:6px 14px; flex-wrap:wrap;
  background:var(--sand); border:2px solid var(--navy); border-radius:12px; padding:10px 18px; margin-bottom:14px;
  box-shadow:0 5px 0 rgba(7,32,56,.14);
}
.area-h h2{ font-family:var(--font-display); font-weight:400; font-size:26px; letter-spacing:1.5px; text-transform:uppercase; color:var(--coral); text-shadow:2px 2px 0 var(--navy); }
.area-n{ font-size:13px; font-weight:700; color:var(--ocean); font-variant-numeric:tabular-nums; }

.puestos{ display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
@media (min-width:700px){ .puestos.p4{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:1000px){ .puestos.p3{ grid-template-columns:repeat(3,minmax(0,1fr)); } }

.pst{
  background:var(--paper); border:2px solid var(--navy); border-radius:12px; padding:14px; min-width:0;
  box-shadow:0 6px 0 rgba(7,32,56,.14), 0 12px 22px rgba(11,46,79,.16);
  background-image:radial-gradient(circle at 90% 10%, rgba(20,92,130,.05) 0%, transparent 55%);
}
.pst-h{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; padding-bottom:6px; border-bottom:3px solid var(--coral); }
.pst-h h3{ font-family:var(--font-display); font-weight:400; font-size:19px; letter-spacing:.8px; text-transform:uppercase; }
.pst-n{ font-family:var(--font-display); font-size:12px; letter-spacing:1px; color:var(--paper); background:var(--ocean); border-radius:999px; padding:3px 10px; font-variant-numeric:tabular-nums; }
.cols{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.col{ min-width:0; }
.col h4{ display:flex; align-items:center; gap:6px; margin-bottom:8px; font-size:10.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; }
.col h4::before{ content:""; width:9px; height:9px; border-radius:50%; background:currentColor; flex-shrink:0; }
.col.si h4{ color:var(--ok); }
.col.no h4{ color:var(--no-ink); }
.col h4 span{ font-variant-numeric:tabular-nums; }

.chip{
  appearance:none; display:flex; flex-direction:column; gap:2px; width:100%; min-width:0; margin-bottom:6px;
  text-align:left; cursor:pointer; font:inherit; color:var(--navy); border-radius:10px; padding:8px 10px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.chip.si{ background:var(--ok-bg); border:2px solid var(--ok); }
.chip.no{ background:var(--no-bg); border:2px dashed var(--coral); }
.chip .nm{ font-weight:700; font-size:14px; line-height:1.25; overflow-wrap:anywhere; }
.chip .mt{ font-size:11.5px; line-height:1.3; opacity:.8; font-variant-numeric:tabular-nums; }
.chip:hover:not(:disabled){ transform:translateY(-1px); box-shadow:2px 3px 0 rgba(11,46,79,.18); }
.chip:disabled{ cursor:default; }
.nadie{ font-size:12.5px; font-style:italic; opacity:.65; padding:4px 2px; }

.mini{ font-family:var(--font-display); font-size:11px; letter-spacing:.8px; text-transform:uppercase; border:2px solid var(--coral); color:var(--no-ink); background:#fff; border-radius:999px; padding:4px 10px; cursor:pointer; }
.mini.armed{ background:var(--coral); color:#fff; }
.tbl td{ padding:6px 8px; font-size:13px; color:#1c2630; }
.tbl th{ text-align:left; padding:6px 8px; }
.tbl td:last-child{ text-align:right; }
.ej{ font-size:10.5px; font-style:italic; opacity:.65; margin-left:6px; }
.msg{ font-size:12.5px; color:var(--ok); min-height:1.2em; margin:8px 2px 0; }
.sheet-f .hint{ margin:0; align-self:center; }

.chip:focus-visible,.loc:focus-visible,.dl-btn:focus-visible,.x:focus-visible,.mini:focus-visible{ outline:3px solid var(--coral); outline-offset:2px; }

@media (max-width:700px){
  .page{ padding-block:22px 44px; }
  .locales{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .loc[data-k="todos"]{ grid-column:1/-1; }
  .area-h h2{ font-size:22px; }
}
@media (prefers-reduced-motion:reduce){
  .chip,.loc,.dl-btn{ transition:none; }
  .loc:hover,.chip:hover{ transform:none; }
}

<script>
/* Datos: el equipo sale de ciclo (JSONBin, solo lectura). Asistencia y horarios se guardan en este navegador. */
(function(){
  'use strict';
  var DEF = {apiKey:'$2a$10$VeTrCGoPa3dAkOSMGT5BbexSaQbg7DoG/pOV4kQjM4Wvqq6paZ2n.', clave:'tQWyDpjpNApN8aUnqqOKRQFTIRX6LRit', binId:'6ab67ab9ac6210605af45cd2'};
  function cfg(){ try{ var c=JSON.parse(localStorage.getItem('rrhh_ciclo_jb_cfg')||'null'); if(c&&c.apiKey&&c.clave&&c.binId) return c; }catch(e){} return DEF; }
  var LOC_CICLO={BCP:0,BCB:1,BCBL:2,BCC:3}, LOC_HOR=['palermo','belgrano','bulnes','caseros'], NOM=['Palermo','Belgrano','Bulnes','Caseros'];
  var PUESTO={'gerencia':'encargado','supervision':'encargado','jefe de barra':'encargado','caja':'cajero',
    'camarero':'salon','camarero jr':'salon','corredor':'salon','barra':'salon','recepcion':'salon','volante':'salon','valet parking':'salon',
    'limpieza':'limpieza','chef':'souschef','sous chef':'souschef','cocina':'cocina','pasteleria':'cocina','produccion':'cocina','bacha':'bachero'};
  var ORD=['encargado','cajero','salon','limpieza','souschef','cocina','bachero'];
  function plain(v){ return String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  var LS={get:function(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
          set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
  var roster=LS.get('barra-roster',null), pres=LS.get('barra-pres',{}), hor=LS.get('barra-horarios',{}), sem=LS.get('barra-semana',null);
  var subs={emp:[],emperr:[],hor:[],sem:[]}, status='Conectando con ciclo…';

  function empDocs(){ return (roster||[]).map(function(e){ var p=pres[e.id]||{};
    return {id:e.id,data:function(){ return {nombre:e.nombre,local:e.local,puesto:e.puesto,presenteEl:p.presenteEl||'',ingreso:p.ingreso||'',ejemplo:false}; }}; }); }
  function emitEmp(){ if(roster) subs.emp.forEach(function(f){ f({docs:empDocs()}); }); }
  function horDocs(){ return Object.keys(hor).map(function(k){ return {id:k,data:function(){ return hor[k]; }}; }); }
  function emitHor(){ subs.hor.forEach(function(f){ f({docs:horDocs()}); }); }
  function paint(){ var el=document.getElementById('sync-st'); if(el) el.textContent=status; }

  function syncHor(){
    var changed=false;
    for(var l=0;l<4;l++){
      var emps=roster.filter(function(x){ return x.local===l; }).sort(function(a,b){
        return (ORD.indexOf(a.puesto)-ORD.indexOf(b.puesto))||a.nombre.localeCompare(b.nombre,'es'); });
      var prev=(hor[LOC_HOR[l]]||{}).filas||[];
      var filas=emps.map(function(x){
        var m=prev.filter(function(r){ return plain(r.c)===plain(x.nombre); })[0];
        return {c:x.nombre,s:x.sector,d:m?m.d:['','','','','','','']};
      });
      prev.forEach(function(r){ if(!String(r.c||'').trim()) filas.push(r); });
      if(JSON.stringify(filas)!==JSON.stringify(prev)){ hor[LOC_HOR[l]]={nombre:NOM[l],filas:filas}; changed=true; }
    }
    if(changed){ LS.set('barra-horarios',hor); emitHor(); }
  }

  function b64(buf){ var a=new Uint8Array(buf),t=''; for(var i=0;i<a.length;i+=0x8000) t+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000)); return btoa(t); }
  function unb64(t){ return Uint8Array.from(atob(t),function(c){ return c.charCodeAt(0); }); }
  async function decrypt(env,pass){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(env.salt),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},key,unb64(env.data)));
    if(env.v>=2){ var ds=new DecompressionStream('gzip'); return new TextDecoder().decode(await new Response(new Blob([pt]).stream().pipeThrough(ds)).arrayBuffer()); }
    return new TextDecoder().decode(pt);
  }
  function parse(d){
    var out=[];
    (d.empleados||[]).forEach(function(e){
      var est=String(e.estado||''); if(est!=='activo'&&est!=='egreso') return;
      var loc=LOC_CICLO[String(e.local||'').trim().replace(/^\d+\.\s*/,'').toUpperCase()], pk=PUESTO[plain(e.puesto)];
      var a=String(e.apellido||'').trim(), n=String(e.nombre||'').trim(), nom=a&&n?a+', '+n:(a||n);
      if(loc===undefined||!pk||!nom) return;
      out.push({id:'c'+String(e.id).replace(/[^A-Za-z0-9_-]/g,''),nombre:nom,local:loc,puesto:pk,sector:String(e.puesto||'').trim().toUpperCase()});
    });
    return out;
  }
  async function pull(manual){
    var c=cfg();
    try{
      var r=await fetch('https://api.jsonbin.io/v3/b/'+encodeURIComponent(c.binId)+'/latest',{headers:{'X-Master-Key':c.apiKey,'X-Bin-Meta':'false'},cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      var data=JSON.parse(await decrypt(await r.json(),c.clave));
      roster=parse(data); LS.set('barra-roster',roster);
      syncHor(); emitEmp();
      status='Equipo de ciclo al día ('+roster.length+' personas). Última lectura '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+'.';
    }catch(e){
      status='No se pudo leer ciclo'+(roster?' (se muestra la última copia)':'')+': '+(e.message||'sin conexión');
      if(!roster) subs.emperr.forEach(function(f){ f(e); });
    }
    paint();
  }
  window.__ciclo={pull:pull,paint:paint};

  var db={
    collection:function(name){ return {onSnapshot:function(cb,err){
      if(name==='empleados'){ subs.emp.push(cb); if(err) subs.emperr.push(err); if(roster) setTimeout(function(){ cb({docs:empDocs()}); },0); }
      else if(name==='horarios'){ subs.hor.push(cb); setTimeout(function(){ cb({docs:horDocs()}); },0); }
      return function(){}; }}; },
    doc:function(path){ var pt=path.split('/'); return {
      update:function(p){ if(pt[0]==='empleados'){ pres[pt[1]]={presenteEl:p.presenteEl||'',ingreso:p.ingreso||''}; LS.set('barra-pres',pres); emitEmp(); } return Promise.resolve(); },
      set:function(v){ if(pt[0]==='horarios'){ hor[pt[1]]=JSON.parse(JSON.stringify(v)); LS.set('barra-horarios',hor); } else if(path==='config/semana'){ sem=v; LS.set('barra-semana',v); } return Promise.resolve(); },
      delete:function(){ return Promise.resolve(); },
      onSnapshot:function(cb){ if(path==='config/semana') setTimeout(function(){ cb({exists:!!sem,data:function(){ return sem; }}); },0); return function(){}; } }; }
  };
  window.claude={use:function(n){ return Promise.resolve(n==='db'?db:{can:function(){ return Promise.resolve(true); }}); }};
  pull();
  setInterval(function(){ if(!document.hidden) pull(); },60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) pull(); });
})();
</script>
<script>
(function(){
  'use strict';

  var AREAS = [{k:'salon', n:'Salón'}, {k:'cocina', n:'Cocina'}];
  var PUESTOS = {
    salon:  [{k:'encargado', n:'Encargado'}, {k:'cajero', n:'Cajero'}, {k:'salon', n:'Salón'}, {k:'limpieza', n:'Limpieza'}],
    cocina: [{k:'souschef', n:'Sous chef'}, {k:'cocina', n:'Cocina'}, {k:'bachero', n:'Bachero'}]
  };
  var ORDEN = [];
  AREAS.forEach(function(a){ PUESTOS[a.k].forEach(function(p){ ORDEN.push(p); }); });

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function dia(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function hora(){ var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function puestoIdx(k){ for (var i = 0; i < ORDEN.length; i++) if (ORDEN[i].k === k) return i; return 99; }
  function puestoNombre(k){ var i = puestoIdx(k); return i < 99 ? ORDEN[i].n : k; }
  function byName(a, b){ return a.nombre.localeCompare(b.nombre, 'es'); }

  var state = {
    db: null, dbOk: null, emps: [], loaded: false,
    locales: ['Palermo', 'Belgrano', 'Bulnes', 'Caseros'],
    sel: 'todos', writable: true, hoy: dia(),
    toast: null, armed: null, sheet: false
  };
  try {
    var saved = localStorage.getItem('barra-local');
    if (saved === 'todos' || /^[0-3]$/.test(saved || '')) state.sel = saved;
  } catch (e) {}

  function isPresent(e){ return e.presenteEl === state.hoy; }
  function filtrados(){
    if (state.sel === 'todos') return state.emps;
    return state.emps.filter(function(e){ return String(e.local) === state.sel; });
  }

  /* ---------- dibujo ---------- */
  function vacio(t, s){ return '<div class="empty"><div class="big">' + t + '</div><div class="small">' + s + '</div></div>'; }

  function chip(e){
    var p = isPresent(e);
    var loc = state.sel === 'todos' ? esc(state.locales[e.local] || '') : '';
    var meta;
    if (p) meta = (loc ? loc + ' · ' : '') + (e.ingreso ? 'desde ' + esc(e.ingreso) : 'presente');
    else meta = loc || (state.writable ? 'Tocá para marcar presente' : '');
    return '<button type="button" class="chip ' + (p ? 'si' : 'no') + '" data-id="' + esc(e.id) + '" aria-pressed="' + p + '"' + (state.writable ? '' : ' disabled') + '>' +
      '<span class="nm">' + esc(e.nombre) + '</span>' + (meta ? '<span class="mt">' + meta + '</span>' : '') + '</button>';
  }
  function col(k, titulo, xs){
    var cuerpo = xs.length ? xs.map(chip).join('') : '<p class="nadie">' + (k === 'si' ? 'Nadie todavía' : 'Nadie falta') + '</p>';
    return '<div class="col ' + k + '"><h4>' + titulo + ' <span>' + xs.length + '</span></h4>' + cuerpo + '</div>';
  }
  function card(p, list){
    var xs = list.filter(function(e){ return e.puesto === p.k; }).sort(byName);
    var si = xs.filter(isPresent), no = xs.filter(function(e){ return !isPresent(e); });
    var cuerpo = xs.length ? '<div class="cols">' + col('si', 'Presentes', si) + col('no', 'Ausentes', no) + '</div>' : '<p class="nadie">Nadie cargado en este puesto.</p>';
    return '<article class="pst"><div class="pst-h"><h3>' + p.n + '</h3><span class="pst-n" title="Presentes de total">' + si.length + '/' + xs.length + '</span></div>' + cuerpo + '</article>';
  }
  function area(a, list){
    var ps = PUESTOS[a.k];
    var enArea = list.filter(function(e){ return ps.some(function(p){ return p.k === e.puesto; }); });
    var pres = enArea.filter(isPresent).length;
    return '<section class="area" aria-label="' + a.n + '"><div class="area-h"><h2>' + a.n + '</h2><span class="area-n">' + pres + ' de ' + enArea.length + ' presentes</span></div>' +
      '<div class="puestos ' + (ps.length === 4 ? 'p4' : 'p3') + '">' + ps.map(function(p){ return card(p, list); }).join('') + '</div></section>';
  }

  function renderBoard(){
    var el = $('board');
    if (state.dbOk === false) { el.innerHTML = vacio('No se pudo traer el equipo de ciclo', 'Revisá la conexión y recargá la página.'); return; }
    if (!state.loaded) { el.innerHTML = vacio('Abriendo la barra…', 'Cargando el equipo de los cuatro locales.'); return; }
    if (!state.emps.length) {
      el.innerHTML = vacio('Todavía no hay empleados', state.writable ? 'Tocá Gestionar y agregá a la primera persona del equipo.' : 'Pedile a quien administra esta página que cargue al equipo.');
      return;
    }
    var list = filtrados();
    el.innerHTML = AREAS.map(function(a){ return area(a, list); }).join('');
  }

  function renderLocales(){
    var items = [{k: 'todos', n: 'Todos', list: state.emps}].concat(state.locales.map(function(n, i){
      return {k: String(i), n: n, list: state.emps.filter(function(e){ return e.local === i; })};
    }));
    $('locales').innerHTML = items.map(function(it){
      var t = it.list.length, p = it.list.filter(isPresent).length, pct = t ? Math.round(p * 100 / t) : 0;
      return '<button type="button" class="loc" data-k="' + it.k + '" aria-pressed="' + (state.sel === it.k) + '">' +
        '<span class="ln">' + esc(it.n) + '</span>' +
        '<span class="lc">' + p + '/' + t + ' <small>presentes</small></span>' +
        '<span class="bar-t" aria-hidden="true"><span class="bar-f" style="width:' + pct + '%"></span></span></button>';
    }).join('');
  }

  function renderPills(){
    var list = filtrados();
    var p = list.filter(isPresent).length;
    var nombre = state.sel === 'todos' ? 'Los 4 locales' : (state.locales[+state.sel] || '');
    $('pills').innerHTML =
      '<span class="count-pill">' + esc(nombre) + '</span>' +
      '<span class="count-pill si">Presentes<b>' + p + '</b></span>' +
      '<span class="count-pill no">Ausentes<b>' + (list.length - p) + '</b></span>';
  }

  function renderAvisos(){
    var h = '';
    if (state.toast) h += '<div class="aviso' + (state.toast.err ? ' err' : '') + '">' + esc(state.toast.msg) + '</div>';
    if (state.loaded && state.emps.some(function(e){ return e.ejemplo; })) {
      h += '<div class="aviso">Estás viendo empleados de ejemplo.' + (state.writable ? ' Cargá a tu equipo real y quitá los ejemplos desde Gestionar.' : '') + '</div>';
    }
    if (state.loaded && !state.writable) h += '<div class="aviso">Solo lectura: en esta vista no podés cambiar la asistencia.</div>';
    $('avisos').innerHTML = h;
  }

  function renderFecha(){
    var t = new Date().toLocaleDateString('es-AR', {weekday: 'long', day: 'numeric', month: 'long'});
    $('fecha').textContent = t.charAt(0).toUpperCase() + t.slice(1);
  }

  function render(){
    var ae = document.activeElement, sel = null;
    if (ae && ae.hasAttribute) {
      if (ae.hasAttribute('data-id')) sel = '[data-id="' + ae.getAttribute('data-id') + '"]';
      else if (ae.hasAttribute('data-k')) sel = '[data-k="' + ae.getAttribute('data-k') + '"]';
    }
    renderFecha(); renderLocales(); renderPills(); renderAvisos(); renderBoard();
    $('b-gestionar').hidden = !(state.db && state.writable);
    if (state.sheet && !state.writable) closeSheet();
    if (sel) { var f = document.querySelector(sel); if (f && f !== document.activeElement) f.focus({preventScroll: true}); }
  }

  var toastTimer = null;
  function flash(msg, err){
    state.toast = {msg: msg, err: !!err};
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ state.toast = null; renderAvisos(); }, 6000);
    renderAvisos();
  }
  function onWriteError(err){
    var c = err && err.code;
    if (c === 'invalid_argument') { state.writable = false; flash('No tenés permiso para cambiar datos en esta vista.', true); }
    else if (c === 'quota_exceeded') flash('Se llenó el espacio de la base de datos. Borrá empleados que no uses.', true);
    else flash('No se pudo guardar. Probá de nuevo en un momento.', true);
    render();
  }

  /* ---------- acciones ---------- */
  function toggle(id){
    var e = state.emps.filter(function(x){ return x.id === id; })[0];
    if (!e || !state.db) return;
    var patch = isPresent(e) ? {presenteEl: '', ingreso: ''} : {presenteEl: state.hoy, ingreso: hora()};
    state.db.doc('empleados/' + id).update(patch).catch(onWriteError);
  }
  $('board').addEventListener('click', function(ev){
    var b = ev.target.closest('.chip');
    if (b && !b.disabled) toggle(b.getAttribute('data-id'));
  });
  $('locales').addEventListener('click', function(ev){
    var b = ev.target.closest('.loc');
    if (!b) return;
    state.sel = b.getAttribute('data-k');
    try { localStorage.setItem('barra-local', state.sel); } catch (e) {}
    render();
  });

  /* ---------- hoja de gestión ---------- */
  var armTimer = null;
  function arm(k){
    state.armed = k; renderTeam();
    clearTimeout(armTimer);
    armTimer = setTimeout(function(){ state.armed = null; renderTeam(); }, 4000);
  }
  function renderTeam(){
    var t = $('team');
    if (!t) return;
    var ae = document.activeElement, again = null;
    if (ae && ae.getAttribute) again = ae.id ? '#' + ae.id : (ae.hasAttribute('data-del') ? '[data-del="' + ae.getAttribute('data-del') + '"]' : null);
    var h = '';
    if (!state.emps.length) h += '<p class="hint">Todavía no hay nadie cargado desde ciclo.</p>';
    else {
      var rows = state.emps.slice().sort(function(a, b){
        return (a.local - b.local) || (puestoIdx(a.puesto) - puestoIdx(b.puesto)) || byName(a, b);
      }).map(function(e){
                return '<tr><td>' + esc(e.nombre) + (e.ejemplo ? '<span class="ej">ejemplo</span>' : '') + '</td><td>' + esc(state.locales[e.local] || '') + '</td><td>' + esc(puestoNombre(e.puesto)) +
          '</td></tr>';
      }).join('');
      h += '<div class="tbl"><table><thead><tr><th>Nombre</th><th>Local</th><th>Puesto</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }
    t.innerHTML = h;
    if (again) { var f = document.querySelector(again); if (f) f.focus({preventScroll: true}); }
  }
  function openSheet(){
    if (!state.writable || !state.db) return;
    state.sheet = true;
        $('sheet-root').innerHTML =
      '<div class="ov ov-barra" id="ov" role="dialog" aria-modal="true" aria-labelledby="sheet-t"><div class="sheet">' +
        '<div class="sheet-h"><div class="t" id="sheet-t">Gestionar equipo<small>El equipo se toma de ciclo</small></div>' +
          '<div class="bar"><button type="button" class="x" id="sheet-x" aria-label="Cerrar">✕</button></div></div>' +
        '<div class="sheet-b">' +
          '<div class="sec"><h3>Equipo de ciclo</h3><p class="hint" id="sync-st"></p>' +
            '<div class="btn-row uno" style="margin-top:10px"><button type="button" class="dl-btn main" id="b-sync">ACTUALIZAR AHORA</button></div></div>' +
          '<div class="sec"><h3>Equipo cargado</h3><div id="team"></div></div>' +
        '</div>' +
        '<div class="sheet-f"><span class="hint">La asistencia se reinicia sola cada día.</span><button type="button" class="dl-btn alt" id="sheet-ok">LISTO</button></div>' +
      '</div></div>';
    renderTeam(); if (window.__ciclo) window.__ciclo.paint();
  }
  function closeSheet(){
    state.sheet = false; state.armed = null;
    $('sheet-root').innerHTML = '';
    if (!$('b-gestionar').hidden) $('b-gestionar').focus();
  }
  $('b-gestionar').addEventListener('click', openSheet);
  $('sheet-root').addEventListener('click', function(ev){
    var t = ev.target;
    if (t.id === 'ov' || t.id === 'sheet-x' || t.id === 'sheet-ok') { closeSheet(); return; }
    if (t.closest('#b-sync') && window.__ciclo) window.__ciclo.pull(true);
  });
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && state.sheet) closeSheet(); });

  /* ---------- datos ---------- */
  function onReadError(){ state.dbOk = false; render(); }
  async function init(){
    var c = window.claude;
    if (!c || !c.use) { onReadError(); return; }
    var db = await c.use('db');
    if (!db) { onReadError(); return; }
    state.db = db; state.dbOk = true;
    try {
      var user = await c.use('user');
      if (user) { var w = await user.can('data.write'); if (w === false) state.writable = false; }
    } catch (e) {}
    db.collection('empleados').onSnapshot(function(snap){
      state.emps = snap.docs.map(function(d){
        var x = d.data() || {};
        return {id: d.id, nombre: String(x.nombre || ''), local: parseInt(x.local, 10) || 0, puesto: String(x.puesto || ''),
                presenteEl: String(x.presenteEl || ''), ingreso: String(x.ingreso || ''), ejemplo: !!x.ejemplo};
      });
      state.loaded = true;
      render();
      if (state.sheet) renderTeam();
    }, onReadError);
  }

  setInterval(function(){
    var d = dia();
    if (d !== state.hoy) { state.hoy = d; render(); }
  }, 60000);

  render();
  init().catch(onReadError);
})();
</script>

<script>
(function(){
  'use strict';
  var LOCS=[['palermo','Palermo'],['belgrano','Belgrano'],['bulnes','Bulnes'],['caseros','Caseros']];
  var DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  function $(i){ return document.getElementById(i); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad(n){ return (n<10?'0':'')+n; }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function lunesDe(d){ d=new Date(d.getFullYear(),d.getMonth(),d.getDate()); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
  var H={db:null,ok:null,w:true,loaded:false,loc:'palermo',vista:'sem',dia:0,col:'',lunes:iso(lunesDe(new Date())),data:{},armed:null,msg:''};
  try{
    var sl=localStorage.getItem('barra-hloc'); if(LOCS.some(function(l){ return l[0]===sl; })) H.loc=sl;
  }catch(e){}

  function cls(v){
    v=String(v||'').trim().toUpperCase();
    if(v==='FRANCO') return 's-f'; if(v==='VACACIONES') return 's-v';
    var m=/^(\d{1,2})/.exec(v); if(!m) return '';
    var h=+m[1]; return h<=10?'s-m':(h<=16?'s-d':'s-c');
  }
  function pres(v){ v=String(v||'').trim().toUpperCase(); return v!==''&&v!=='FRANCO'&&v!=='VACACIONES'; }
  function fechas(){
    var p=H.lunes.split('-');
    return DIAS.map(function(_,i){ var d=new Date(+p[0],+p[1]-1,+p[2]+i); return pad(d.getDate())+'/'+pad(d.getMonth()+1); });
  }
  function cur(){ return H.data[H.loc]||{nombre:'',filas:[]}; }
  function ensure(){ if(!H.data[H.loc]) H.data[H.loc]={nombre:'',filas:[]}; return H.data[H.loc]; }
  function nombreLoc(){ return LOCS.filter(function(l){ return l[0]===H.loc; })[0][1]; }
  function norm(r){ r=r||{}; return {c:String(r.c||''),s:String(r.s||''),d:[0,1,2,3,4,5,6].map(function(i){ return String((r.d||[])[i]||''); })}; }

  /* ---------- dibujo ---------- */
  function renderLocs(){
    $('h-locales').innerHTML=LOCS.map(function(l){
      var n=(H.data[l[0]]||{filas:[]}).filas.length;
      return '<button type="button" class="loc" data-hl="'+l[0]+'" aria-pressed="'+(H.loc===l[0])+'"><span class="ln">'+l[1]+'</span><span class="lc">'+n+' <small>colaboradores</small></span></button>';
    }).join('');
  }
  function renderBar(){
    var f=fechas(), d=cur();
    var h='<div class="seg">'+[['sem','Semana'],['dia','Por día'],['col','Por colaborador']].map(function(v){
      return '<button type="button" class="dl-btn alt" data-v="'+v[0]+'" aria-pressed="'+(H.vista===v[0])+'">'+v[1]+'</button>';
    }).join('')+'</div>';
    h+='<div class="hbar"><label for="h-lunes">Semana del lunes</label><input type="date" id="h-lunes" value="'+H.lunes+'"'+(H.w?'':' disabled')+'></div>';
    if(H.vista==='dia') h+='<div class="seg">'+DIAS.map(function(n,i){
      return '<button type="button" class="dl-btn alt" data-dia="'+i+'" aria-pressed="'+(H.dia===i)+'">'+n.slice(0,3)+' '+f[i]+'</button>';
    }).join('')+'</div>';
    if(H.vista==='col'){
      var nombres=d.filas.map(function(r){ return r.c; }).filter(Boolean);
      if(nombres.indexOf(H.col)<0) H.col=nombres[0]||'';
      h+='<div class="hbar"><label for="h-col">Colaborador</label><select id="h-col">'+nombres.map(function(n){
        return '<option'+(n===H.col?' selected':'')+'>'+esc(n)+'</option>';
      }).join('')+'</select></div>';
    }
    $('h-bar').innerHTML=h;
  }
  function totales(d){
    return [0,1,2,3,4,5,6].map(function(i){ return d.filas.filter(function(r){ return pres(r.d[i]); }).length; });
  }
  function renderBoard(){
    var el=$('h-board');
    if(H.ok===false){ el.innerHTML='<div class="empty"><div class="big">No se pudieron abrir los horarios</div><div class="small">Revisá la conexión y recargá la página.</div></div>'; return; }
    if(!H.loaded){ el.innerHTML='<div class="empty"><div class="big">Abriendo horarios…</div></div>'; return; }
    var d=cur(), f=fechas(), ed=H.w&&H.vista==='sem';
    var cols=H.vista==='dia'?[H.dia]:[0,1,2,3,4,5,6];
    var th='<th>N°</th><th>Colaborador</th><th>Sector</th>'+cols.map(function(i){ return '<th>'+DIAS[i].toUpperCase().replace('MIÉRCOLES','MIERCOLES').replace('SÁBADO','SABADO')+'<small>'+f[i]+'</small></th>'; }).join('')+(ed?'<th></th>':'');
    var rows=d.filas.map(function(r,ri){
      if(H.vista==='col'&&r.c!==H.col) return '';
      if(H.vista==='dia'&&!String(r.d[H.dia]).trim()) return '';
      var tds=cols.map(function(i){
        var v=r.d[i];
        return ed?'<td class="'+cls(v)+'"><input data-r="'+ri+'" data-c="'+i+'" value="'+esc(v)+'" list="h-opc" autocomplete="off" aria-label="'+DIAS[i]+' de '+esc(r.c)+'"></td>':'<td class="'+cls(v)+'">'+esc(v)+'</td>';
      }).join('');
      var nm=ed?'<input data-r="'+ri+'" data-f="c" value="'+esc(r.c)+'" aria-label="Colaborador" autocomplete="off">':esc(r.c);
      var sc=ed?'<input data-r="'+ri+'" data-f="s" value="'+esc(r.s)+'" aria-label="Sector" autocomplete="off">':esc(r.s);
      var del=ed?'<td class="x"><button type="button" class="mini'+(H.armed===ri?' armed':'')+'" data-del="'+ri+'">'+(H.armed===ri?'¿Seguro?':'Borrar')+'</button></td>':'';
      return '<tr><td class="n">'+(ri+1)+'</td><td class="cn">'+nm+'</td><td class="sc">'+sc+'</td>'+tds+del+'</tr>';
    }).join('');
    if(!rows) rows='<tr><td colspan="'+(cols.length+4)+'" style="padding:22px;font-style:italic;opacity:.7">'+(d.filas.length?'Nadie con horario cargado para este día.':'Todavía no hay colaboradores cargados en este local.')+'</td></tr>';
    var t=totales(d);
    var foot=H.vista==='col'?'':'<tfoot><tr><td class="l" colspan="3">PRESENTES / DÍA</td>'+cols.map(function(i){ return '<td data-tot="'+i+'">'+t[i]+'</td>'; }).join('')+(ed?'<td></td>':'')+'</tr></tfoot>';
    var ref='<div class="ref"><b>Referencias:</b><span><i class="s-m"></i>Turno mañana (inicio ≤10 hs)</span><span><i class="s-d"></i>Turno mediodía (inicio 11-16 hs)</span><span><i class="s-c"></i>Turno cierre (inicio ≥17 hs)</span><span><i class="s-f"></i>Franco</span><span><i class="s-v"></i>Vacaciones</span></div>';
    var add=ed?'<div class="hadd"><button type="button" class="dl-btn alt" data-add>+ AGREGAR COLABORADOR</button></div>':'';
    el.innerHTML='<div class="hwrap"><div class="htit">Barra Chalaca — '+nombreLoc()+'</div><div class="ht"><table><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody>'+foot+'</table></div>'+add+ref+'</div>';
  }
  function avisos(){
    $('h-avisos').innerHTML=(H.msg?'<div class="aviso err">'+esc(H.msg)+'</div>':'')+(H.loaded&&!H.w?'<div class="aviso">Solo lectura: en esta vista no podés cambiar los horarios.</div>':'');
  }
  function render(){
    var ae=document.activeElement, sel=null;
    if(ae&&ae.hasAttribute&&ae.closest&&ae.closest('#h-board')&&ae.hasAttribute('data-r')){
      sel='input[data-r="'+ae.getAttribute('data-r')+'"]'+(ae.hasAttribute('data-f')?'[data-f="'+ae.getAttribute('data-f')+'"]':'[data-c="'+ae.getAttribute('data-c')+'"]');
    }
    renderLocs(); renderBar(); renderBoard(); avisos();
    if(sel){ var f=document.querySelector(sel); if(f) f.focus({preventScroll:true}); }
  }

  /* ---------- guardado ---------- */
  var msgTimer=null;
  function fallo(err){
    H.msg=(err&&err.code==='invalid_argument')?'No tenés permiso para cambiar datos en esta vista.':'No se pudo guardar. Probá de nuevo en un momento.';
    if(err&&err.code==='invalid_argument') H.w=false;
    clearTimeout(msgTimer); msgTimer=setTimeout(function(){ H.msg=''; avisos(); },6000);
    render();
  }
  function guardar(){
    var d=ensure(); d.nombre=nombreLoc();
    if(H.db) H.db.doc('horarios/'+H.loc).set({nombre:d.nombre,filas:d.filas}).catch(fallo);
  }

  /* ---------- eventos ---------- */
  $('h-board').addEventListener('change',function(ev){
    var t=ev.target; if(!t.hasAttribute||!t.hasAttribute('data-r')||!H.w) return;
    var r=ensure().filas[+t.getAttribute('data-r')]; if(!r) return;
    var v=t.value.replace(/\s+/g,' ').trim();
    if(t.hasAttribute('data-f')){ var k=t.getAttribute('data-f'); if(k==='s') v=v.toUpperCase(); r[k]=v; }
    else { v=v.replace(/(\d)\s*A\s*(\d)/i,'$1 A $2').toUpperCase(); r.d[+t.getAttribute('data-c')]=v; t.parentNode.className=cls(v);
      var tt=totales(cur()); [].forEach.call(document.querySelectorAll('[data-tot]'),function(c){ c.textContent=tt[+c.getAttribute('data-tot')]; }); }
    t.value=v; guardar();
    if(t.getAttribute('data-f')==='c') renderBar();
  });
  var armTimer=null;
  $('h-board').addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b||!H.w) return;
    if(b.hasAttribute('data-add')){
      var d=ensure(); d.filas.push({c:'',s:'',d:['','','','','','','']}); guardar(); render();
      var ins=document.querySelectorAll('#h-board input[data-f="c"]'); if(ins.length) ins[ins.length-1].focus();
    } else if(b.hasAttribute('data-del')){
      var i=+b.getAttribute('data-del');
      if(H.armed!==i){ H.armed=i; clearTimeout(armTimer); armTimer=setTimeout(function(){ H.armed=null; render(); },4000); render(); return; }
      H.armed=null; ensure().filas.splice(i,1); guardar(); render();
    }
  });
  $('v-hor').addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b) return;
    if(b.hasAttribute('data-hl')){ H.loc=b.getAttribute('data-hl'); H.armed=null; try{ localStorage.setItem('barra-hloc',H.loc); }catch(e){} render(); }
    else if(b.hasAttribute('data-v')){ H.vista=b.getAttribute('data-v'); H.armed=null; render(); }
    else if(b.hasAttribute('data-dia')){ H.dia=+b.getAttribute('data-dia'); render(); }
  });
  $('v-hor').addEventListener('change',function(ev){
    var t=ev.target;
    if(t.id==='h-col'){ H.col=t.value; renderBoard(); }
    else if(t.id==='h-lunes'&&/^\d{4}-\d\d-\d\d$/.test(t.value)){
      var p=t.value.split('-'); H.lunes=iso(lunesDe(new Date(+p[0],+p[1]-1,+p[2])));
      render(); if(H.db) H.db.doc('config/semana').set({lunes:H.lunes}).catch(fallo);
    }
  });
  function tab(k){
    $('v-asis').hidden=k!=='asis'; $('v-hor').hidden=k!=='hor';
    [].forEach.call(document.querySelectorAll('.tab'),function(b){ b.setAttribute('aria-selected',String(b.getAttribute('data-tab')===k)); });
    try{ localStorage.setItem('barra-tab',k); }catch(e){}
  }
  document.querySelector('.tabs').addEventListener('click',function(ev){ var b=ev.target.closest('.tab'); if(b) tab(b.getAttribute('data-tab')); });
  try{ if(localStorage.getItem('barra-tab')==='hor') tab('hor'); }catch(e){}

  /* ---------- datos ---------- */
  function onErr(){ H.ok=false; render(); }
  async function init(){
    var c=window.claude; if(!c||!c.use){ onErr(); return; }
    var db=await c.use('db'); if(!db){ onErr(); return; }
    H.db=db; H.ok=true;
    try{ var u=await c.use('user'); if(u){ var w=await u.can('data.write'); if(w===false) H.w=false; } }catch(e){}
    db.collection('horarios').onSnapshot(function(s){
      var nd={}; s.docs.forEach(function(x){ var v=x.data()||{}; nd[x.id]={nombre:String(v.nombre||''),filas:Array.isArray(v.filas)?v.filas.map(norm):[]}; });
      if(H.loaded&&JSON.stringify(nd)===JSON.stringify(H.data)) return;
      H.data=nd; H.loaded=true; window.__horData={}; Object.keys(nd).forEach(function(k){ window.__horData[k]=nd[k].filas; }); render();
    },onErr);
    db.doc('config/semana').onSnapshot(function(s){
      var d=s.exists?s.data():null;
      if(d&&/^\d{4}-\d\d-\d\d$/.test(d.lunes||'')){ H.lunes=d.lunes; render(); }
    },function(){});
  }
  render();
  init().catch(onErr);
})();

</script>
</body></html>
