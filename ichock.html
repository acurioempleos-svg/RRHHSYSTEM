<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Asistencia Barra Chalaca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: barra de madera. Arriba el selector de locales (Todos + 4), abajo dos áreas (Salón, Cocina) y en cada una una tarjeta por puesto con dos columnas: presentes y ausentes. */
:root{
  --navy:#0B2E4F; --ocean:#145C82; --coral:#E8492B; --sand:#F4E9D4; --gold:#F2B705;
  --wood-a:#E4D2A6; --wood-b:#D8C293; --paper:#FFFDF7;
  --ok:#1E7F5C; --ok-bg:#E4F3EA; --no-bg:#FDECE7; --no-ink:#B8341A;
  --font-logo:'Alfa Slab One',serif; --font-display:'Anton',sans-serif; --font-body:'DM Sans',sans-serif;
}
html{ background:var(--wood-a); }
body{ background:var(--wood-a); color:var(--navy); }

/* =====================================================================
   ESTILO BARRA CHALACA — Acurio Restaurantes
   Extraído de "Recursos — Acurio Restaurantes". Reglas y valores copiados
   tal cual del original; solo se quitó lo de los otros dos locales y la
   barra selectora de marcas.

   PALETA   Barra Chalaca: navy #0B2E4F · ocean #145C82 · coral #E8492B · sand #F4E9D4 · gold #F2B705 · madera #E4D2A6/#D8C293 · papel #FFFDF7
   FUENTES  Alfa Slab One (logo) + Anton (títulos, botones, sello, etiquetas) + DM Sans (texto)

   USO: poné class="page active theme-barra" en el contenedor de página.
        Modal de formulario: <div class="ov ov-barra"><div class="sheet">…</div></div>
   ===================================================================== */


*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans', sans-serif; padding:0;}

/* ============ BASE COMPARTIDA ============ */
.page{ padding:36px 16px 60px; min-height:100vh; }
.wrap{ max-width:1040px; margin:0 auto; }
.navbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; }
.brand{ display:flex; align-items:center; gap:14px; }
.brand .icon{ width:46px; height:46px; flex-shrink:0; }
.brand .text{ display:flex; flex-direction:column; line-height:1; }
.brand .sub{ margin-top:8px; font-size:10.5px; letter-spacing:2.5px; font-weight:700; text-transform:uppercase; }
.stamp{ font-family:'Anton',sans-serif; font-size:14px; letter-spacing:1.5px; white-space:nowrap; }
.doodle-row{ display:flex; align-items:center; justify-content:center; gap:24px; margin-bottom:6px; opacity:.96; }
.doodle-row svg{ height:52px; width:auto; }
.doodle-title{ font-family:'Anton',sans-serif; letter-spacing:1px; text-transform:uppercase; }

.toolbar{ display:flex; justify-content:center; gap:10px; margin:18px 0 18px; flex-wrap:wrap; }
.count-pill{ display:flex; align-items:center; font-size:12.5px; font-weight:600; padding:5px 14px; border-radius:999px; background:var(--paper); border:1.5px solid var(--c1); color:var(--ink); }

.files{ display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px; margin-top:6px; }
.file-card{ position:relative; background:var(--paper); color:var(--ink); padding:18px 18px 16px; display:flex; flex-direction:column; gap:8px; }
.file-tag{ align-self:flex-start; font-family:'Anton',sans-serif; font-size:10px; letter-spacing:1.5px; padding:3px 10px; border-radius:999px; background:var(--c1); color:var(--paper); }
.file-name{ font-family:'Anton',sans-serif; font-size:20px; letter-spacing:.5px; color:var(--c1); line-height:1.15; }
.file-desc{ font-size:13.5px; line-height:1.4; opacity:.85; flex:1; }
.dl-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; margin-top:6px; text-decoration:none; cursor:pointer;
  font-family:'Anton',sans-serif; font-size:13px; letter-spacing:1px; color:#fff; background:var(--c2);
  border:2px solid var(--c1); border-radius:999px; padding:10px 18px; box-shadow:3px 3px 0 rgba(0,0,0,0.18);
  transition:transform .12s ease, opacity .15s ease;
}
.dl-btn:hover{ opacity:.88; } .dl-btn:active{ transform:scale(.97); }
.empty{ grid-column:1/-1; text-align:center; padding:46px 20px; background:rgba(255,255,255,0.6); border:2px dashed var(--c1); border-radius:14px; color:var(--ink); }
.empty .big{ font-family:'Anton',sans-serif; font-size:22px; letter-spacing:1px; color:var(--c1); text-transform:uppercase; margin-bottom:6px; }
.empty .small{ font-size:13.5px; opacity:.8; }

footer{ margin-top:28px; display:flex; align-items:center; justify-content:flex-end; gap:10px; font-size:11.5px; font-style:italic; }
footer svg{ height:22px; width:auto; opacity:.85; }

/* ======================================================= */
/* ================= THEME 1: BARRA CHALACA ================ */
/* ======================================================= */
.theme-barra{
  --c1:#0B2E4F; --c2:#E8492B; --paper:#FFFDF7; --ink:#0B2E4F;
  --navy:#0B2E4F; --ocean:#145C82; --coral:#E8492B; --sand:#F4E9D4; --gold:#F2B705; --wood-a:#E4D2A6; --wood-b:#D8C293;
  background-color:var(--wood-a);
  background-image:
    repeating-linear-gradient(180deg,var(--wood-a) 0px,var(--wood-a) 46px,var(--wood-b) 46px,var(--wood-b) 48px),
    radial-gradient(circle at 10% 5%,rgba(255,255,255,0.25) 0%,transparent 45%),
    radial-gradient(circle at 90% 95%,rgba(0,0,0,0.06) 0%,transparent 45%);
  color:var(--ink);
}
.theme-barra .navbar{ background:var(--sand); border-radius:14px; padding:16px 26px; box-shadow:0 8px 0 rgba(7,32,56,0.12),0 14px 26px rgba(11,46,79,0.18); border:2px solid var(--navy); }
.theme-barra .brand .logo{ font-family:'Alfa Slab One',serif; font-size:clamp(24px,3.4vw,34px); color:var(--coral); text-shadow:2px 2px 0 var(--navy); letter-spacing:.5px; }
.theme-barra .brand .sub{ color:var(--ocean); letter-spacing:3px; font-size:11px; }
.theme-barra .stamp{ color:var(--sand); background:var(--coral); padding:10px 22px; border-radius:999px; transform:rotate(-3deg); border:2px dashed var(--sand); box-shadow:3px 3px 0 var(--navy); }
.theme-barra .stripe{ height:8px; margin:22px 0 20px; border-radius:4px; background:repeating-linear-gradient(90deg,var(--navy) 0 22px,var(--coral) 22px 26px); box-shadow:0 2px 0 rgba(0,0,0,0.08); }
.theme-barra .doodle-title{ font-size:22px; color:var(--navy); }
.theme-barra .count-pill{ background:rgba(255,255,255,0.55); }
.theme-barra .file-card{ border:2px solid var(--navy); border-radius:12px; box-shadow:0 6px 0 rgba(7,32,56,0.14),0 12px 22px rgba(11,46,79,0.16); background-image:radial-gradient(circle at 90% 10%,rgba(20,92,130,0.05) 0%,transparent 55%); }
.theme-barra .file-tag{ background:var(--coral); transform:rotate(-2deg); border:1px dashed rgba(255,255,255,0.7); }
.theme-barra footer{ color:var(--ocean); }

@media (max-width:700px){
  .page{ padding:22px 12px 44px; }
  .navbar{ padding:14px 18px !important; }
  .brand .icon{ width:34px !important; height:34px !important; }
  .doodle-row{ gap:10px; } .doodle-row svg{ height:34px !important; }
  .theme-barra .doodle-title{ font-size:15px; }
  .files{ grid-template-columns:1fr; }
  footer{ justify-content:center; }
}

/* ============ COMPLETAR Y PDF ============ */
.btn-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.btn-row.uno{ grid-template-columns:1fr; }
.btn-row .dl-btn{ margin-top:0; padding:9px 8px; font-size:12px; }
.dl-btn.alt{ background:var(--paper); color:var(--c1); }
.dl-btn.main{ margin-top:8px; }

.ov{ position:fixed; inset:0; z-index:100; background:rgba(7,20,35,.62); display:flex; align-items:flex-end; justify-content:center; font-family:'DM Sans',sans-serif; }
.ov.top{ z-index:110; }
.sheet{ background:#fff; color:#1c2630; width:100%; max-width:860px; height:94vh; display:flex; flex-direction:column; border-radius:16px 16px 0 0; overflow:hidden; border:3px solid var(--c1); }
@media(min-width:700px){ .ov{ align-items:center; } .sheet{ border-radius:16px; height:90vh; } }
.sheet-h{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:12px 16px; background:var(--c1); color:#fff; }
.sheet-h .t{ font-family:'Anton',sans-serif; font-size:17px; letter-spacing:.8px; line-height:1.15; }
.sheet-h .t small{ display:block; font-family:'DM Sans',sans-serif; font-size:11.5px; letter-spacing:0; opacity:.85; margin-top:2px; }
.bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.bar-btn{ font-family:'Anton',sans-serif; font-size:12.5px; letter-spacing:1px; border:2px solid #fff; background:var(--c2); color:#fff; border-radius:999px; padding:8px 14px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; }
.bar-btn.alt{ background:#fff; color:var(--c1); }
.bar-btn:active{ transform:scale(.97); }
.x{ background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:999px; width:34px; height:34px; font-size:17px; cursor:pointer; }
.sheet-b{ overflow:auto; padding:16px; background:var(--fondo); flex:1; }
.sec{ background:#fff; border:2px solid var(--c1); border-radius:12px; padding:14px; margin-bottom:14px; }
.sec h3{ font-family:'Anton',sans-serif; font-weight:400; font-size:15px; letter-spacing:1px; color:var(--c1); margin-bottom:12px; padding-bottom:6px; border-bottom:3px solid var(--c2); text-transform:uppercase; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
.fld{ min-width:0; }
.fld.wide{ grid-column:1/-1; }
.fld label{ display:block; font-size:12px; font-weight:700; color:var(--c1); margin-bottom:4px; }
.fld .tag{ font-weight:400; font-size:10.5px; opacity:.65; margin-left:6px; font-style:italic; }
.fld input,.fld select,.fld textarea{ width:100%; font:16px 'DM Sans',sans-serif; padding:9px 10px; border:2px solid #c9ced6; border-radius:8px; background:#fff; color:#1c2630; }
.fld input:focus,.fld select:focus,.fld textarea:focus{ outline:none; border-color:var(--c2); }
.fld textarea{ resize:vertical; min-height:96px; }
.tbl{ overflow-x:auto; border:2px solid var(--c1); border-radius:8px; }
.tbl table{ border-collapse:collapse; width:100%; min-width:430px; }
.tbl th{ background:var(--c1); color:#fff; font-size:11px; letter-spacing:.5px; padding:6px; text-transform:uppercase; }
.tbl td{ border-top:1px solid #d5d9df; padding:3px; }
.tbl td input{ border-width:1px; padding:6px 7px; font-size:15px; }
.tbl td.st{ background:var(--fondo); font-weight:700; color:var(--c1); font-size:13px; padding:6px 8px; white-space:nowrap; }
.tbl td.na{ text-align:center; font-size:11px; font-style:italic; color:#8a929c; }
.sheet-f{ display:flex; gap:10px; justify-content:space-between; flex-wrap:wrap; padding:12px 16px; border-top:3px solid var(--c1); background:#fff; }
.sheet-f .dl-btn{ margin-top:0; }
.hint{ font-size:12px; color:#5a6470; margin:0 2px 12px; }
.warn{ background:#FFF3CD; color:#664d03; font-size:13px; padding:8px 14px; border-bottom:2px solid #e6c85c; }
.sheet iframe{ flex:1; width:100%; border:0; background:#555; }

/* =====================================================================
   AÑADIDO (no estaba en el CSS original)
   El original creaba el modal con JavaScript y le inyectaba estas
   variables (--c1, --c2, --fondo, --paper). Acá quedan como clase.
   ===================================================================== */
.ov-barra{ --c1:#0B2E4F; --c2:#E8492B; --fondo:#F4E9D4; --paper:#fff; }

/* =====================================================================
   DIBUJITOS COMO CLASES (AÑADIDO — en el original eran <svg> en el HTML)
   Mismos dibujos, colores y tamaños que el original.
   Uso:
     <div class="doodle-row">
       <div class="dd dd-izq"></div>
       <div class="doodle-title">Texto</div>
       <div class="dd dd-der"></div>
     </div>
     <footer>Texto <div class="dd-pie"></div></footer>
   ===================================================================== */
.dd{ display:block; flex-shrink:0; background-repeat:no-repeat; background-position:center; background-size:100% 100%; height:52px; aspect-ratio:120/60; }
.dd-izq{ background-image:url("data:image/svg+xml,%3Csvg viewBox=%220 0 120 60%22 xmlns=%22http://www.w3.org/2000/svg%22%3E %3Cpath d=%22M10 30 C 30 5, 70 5, 95 30 C 70 55, 30 55, 10 30 Z%22 fill=%22none%22 stroke=%22%23145C82%22 stroke-width=%223%22/%3E %3Cpath d=%22M95 30 L118 15 L112 30 L118 45 Z%22 fill=%22%23F2B705%22 stroke=%22%23145C82%22 stroke-width=%222%22/%3E %3Ccircle cx=%2234%22 cy=%2226%22 r=%223.2%22 fill=%22%230B2E4F%22/%3E %3Cpath d=%22M15 30 Q35 40 55 30%22 fill=%22none%22 stroke=%22%23E8492B%22 stroke-width=%222%22/%3E %3C/svg%3E"); }
.dd-der{ background-image:url("data:image/svg+xml,%3Csvg viewBox=%220 0 120 60%22 xmlns=%22http://www.w3.org/2000/svg%22%3E %3Cpath d=%22M110 30 C 90 5, 50 5, 25 30 C 50 55, 90 55, 110 30 Z%22 fill=%22none%22 stroke=%22%23145C82%22 stroke-width=%223%22/%3E %3Cpath d=%22M25 30 L2 15 L8 30 L2 45 Z%22 fill=%22%23F2B705%22 stroke=%22%23145C82%22 stroke-width=%222%22/%3E %3Ccircle cx=%2286%22 cy=%2226%22 r=%223.2%22 fill=%22%230B2E4F%22/%3E %3Cpath d=%22M105 30 Q85 40 65 30%22 fill=%22none%22 stroke=%22%23E8492B%22 stroke-width=%222%22/%3E %3C/svg%3E"); }
.dd-pie{ display:block; flex-shrink:0; height:22px; aspect-ratio:40/20; opacity:.85; background-repeat:no-repeat; background-size:100% 100%; background-image:url("data:image/svg+xml,%3Csvg viewBox=%220 0 40 20%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cpath d=%22M2 14 C 8 4, 16 4, 20 14 C 24 4, 32 4, 38 14%22 fill=%22none%22 stroke=%22%23145C82%22 stroke-width=%222.5%22/%3E%3C/svg%3E"); }
@media (max-width:700px){ .doodle-row .dd{ height:34px !important; } }


/* ===================== AGREGADO PARA EL VISOR DE ASISTENCIA ===================== */
.page{
  padding-block:36px 60px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.fecha{ text-align:center; font-weight:700; letter-spacing:.5px; color:var(--navy); margin:2px 0 0; }

.locales{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin:18px 0 4px; }
.loc{
  appearance:none; text-align:left; cursor:pointer; font:inherit; min-width:0;
  background:var(--paper); color:var(--navy); border:2px solid var(--navy); border-radius:12px;
  padding:12px 14px; display:flex; flex-direction:column; gap:6px;
  box-shadow:0 5px 0 rgba(7,32,56,.14), 0 10px 18px rgba(11,46,79,.14);
  transition:transform .12s ease;
}
.loc:hover{ transform:translateY(-2px); }
.loc:active{ transform:translateY(1px); }
.loc .ln{ font-family:var(--font-display); font-size:19px; letter-spacing:.6px; line-height:1.1; text-transform:uppercase; overflow-wrap:anywhere; }
.loc .lc{ font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; }
.loc .lc small{ font-size:12px; font-weight:500; opacity:.75; }
.loc .bar-t{ display:block; height:8px; border-radius:4px; background:rgba(11,46,79,.14); overflow:hidden; }
.loc .bar-f{ display:block; height:100%; background:repeating-linear-gradient(90deg,var(--ok) 0 14px,#176A4C 14px 17px); }
.loc[aria-pressed="true"]{ background:var(--navy); color:var(--sand); }
.loc[aria-pressed="true"] .bar-t{ background:rgba(244,233,212,.25); }
.loc[aria-pressed="true"] .bar-f{ background:repeating-linear-gradient(90deg,var(--gold) 0 14px,#C99A04 14px 17px); }

.toolbar{ align-items:center; }
.pills{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.count-pill b{ font-family:var(--font-display); font-weight:400; letter-spacing:.8px; margin-left:6px; font-size:14px; font-variant-numeric:tabular-nums; }
.count-pill.si b{ color:var(--ok); }
.count-pill.no b{ color:var(--no-ink); }
.toolbar .dl-btn{ margin-top:0; padding:7px 16px; font-size:12px; }

.avisos{ display:flex; flex-direction:column; gap:8px; }
.aviso{ padding:10px 14px; border-radius:10px; border:2px solid #E6C85C; background:#FFF3CD; color:#664D03; font-size:13px; line-height:1.4; }
.aviso.err{ background:var(--no-bg); border-color:var(--coral); color:#7A1F0E; }

.area{ margin-top:24px; }
.area-h{
  display:flex; align-items:center; justify-content:space-between; gap:6px 14px; flex-wrap:wrap;
  background:var(--sand); border:2px solid var(--navy); border-radius:12px; padding:10px 18px; margin-bottom:14px;
  box-shadow:0 5px 0 rgba(7,32,56,.14);
}
.area-h h2{ font-family:var(--font-display); font-weight:400; font-size:26px; letter-spacing:1.5px; text-transform:uppercase; color:var(--coral); text-shadow:2px 2px 0 var(--navy); }
.area-n{ font-size:13px; font-weight:700; color:var(--ocean); font-variant-numeric:tabular-nums; }

.puestos{ display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
@media (min-width:700px){ .puestos.p4{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:1000px){ .puestos.p3{ grid-template-columns:repeat(3,minmax(0,1fr)); } }

.pst{
  background:var(--paper); border:2px solid var(--navy); border-radius:12px; padding:14px; min-width:0;
  box-shadow:0 6px 0 rgba(7,32,56,.14), 0 12px 22px rgba(11,46,79,.16);
  background-image:radial-gradient(circle at 90% 10%, rgba(20,92,130,.05) 0%, transparent 55%);
}
.pst-h{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; padding-bottom:6px; border-bottom:3px solid var(--coral); }
.pst-h h3{ font-family:var(--font-display); font-weight:400; font-size:19px; letter-spacing:.8px; text-transform:uppercase; }
.pst-n{ font-family:var(--font-display); font-size:12px; letter-spacing:1px; color:var(--paper); background:var(--ocean); border-radius:999px; padding:3px 10px; font-variant-numeric:tabular-nums; }
.cols{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.col{ min-width:0; }
.col h4{ display:flex; align-items:center; gap:6px; margin-bottom:8px; font-size:10.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; }
.col h4::before{ content:""; width:9px; height:9px; border-radius:50%; background:currentColor; flex-shrink:0; }
.col.si h4{ color:var(--ok); }
.col.no h4{ color:var(--no-ink); }
.col h4 span{ font-variant-numeric:tabular-nums; }

.chip{
  appearance:none; display:flex; flex-direction:column; gap:2px; width:100%; min-width:0; margin-bottom:6px;
  text-align:left; cursor:pointer; font:inherit; color:var(--navy); border-radius:10px; padding:8px 10px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.chip.si{ background:var(--ok-bg); border:2px solid var(--ok); }
.chip.no{ background:var(--no-bg); border:2px dashed var(--coral); }
.chip .nm{ font-weight:700; font-size:14px; line-height:1.25; overflow-wrap:anywhere; }
.chip .mt{ font-size:11.5px; line-height:1.3; opacity:.8; font-variant-numeric:tabular-nums; }
.chip:hover:not(:disabled){ transform:translateY(-1px); box-shadow:2px 3px 0 rgba(11,46,79,.18); }
.chip:disabled{ cursor:default; }
.nadie{ font-size:12.5px; font-style:italic; opacity:.65; padding:4px 2px; }

.mini{ font-family:var(--font-display); font-size:11px; letter-spacing:.8px; text-transform:uppercase; border:2px solid var(--coral); color:var(--no-ink); background:#fff; border-radius:999px; padding:4px 10px; cursor:pointer; }
.mini.armed{ background:var(--coral); color:#fff; }
.tbl td{ padding:6px 8px; font-size:13px; color:#1c2630; }
.tbl th{ text-align:left; padding:6px 8px; }
.tbl td:last-child{ text-align:right; }
.ej{ font-size:10.5px; font-style:italic; opacity:.65; margin-left:6px; }
.msg{ font-size:12.5px; color:var(--ok); min-height:1.2em; margin:8px 2px 0; }
.sheet-f .hint{ margin:0; align-self:center; }

.chip:focus-visible,.loc:focus-visible,.dl-btn:focus-visible,.x:focus-visible,.mini:focus-visible{ outline:3px solid var(--coral); outline-offset:2px; }

@media (max-width:700px){
  .page{ padding-block:22px 44px; }
  .locales{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .loc[data-k="todos"]{ grid-column:1/-1; }
  .area-h h2{ font-size:22px; }
}
@media (prefers-reduced-motion:reduce){
  .chip,.loc,.dl-btn{ transition:none; }
  .loc:hover,.chip:hover{ transform:none; }
}

    var h='<div class="top"><div class="doodle-title">Usuarios</div><div class="acts"><button type="button" class="dl-btn mini" data-adm="nuevo">+ NUEVO USUARIO</button></div></div>';
    h+='<div class="tw"><table><thead><tr><th>Nombre</th><th>DNI</th><th>Rol</th><th>Puede ver</th><th></th></tr></thead><tbody>'+
      users.map(function(u){return '<tr><td><b>'+esc(u.usuario)+'</b></td><td>'+esc(u.dni||'—')+'</td><td><span class="rolt '+(u.rol==='admin'?'':'c')+'">'+(u.rol==='admin'?'ADMIN':'COLABORADOR')+'</span></td><td>'+esc(resumen(u))+'</td>'+
        '<td><div class="acts"><button type="button" class="dl-btn alt" data-adm="edit" data-id="'+u.id+'">EDITAR</button>'+
        '<button type="button" class="dl-btn alt" data-adm="del" data-id="'+u.id+'">'+(ed&&ed.arm===u.id?'¿SEGURO?':'ELIMINAR')+'</button></div></td></tr>';}).join('')+'</tbody></table></div>';
    if(ed&&ed.form){var u=ed.form;
      h+='<div class="frm">'+
        '<div><label for="f-usr">DNI (el nombre sale de ciclo)</label><input id="f-usr" inputmode="numeric" autocapitalize="none" value="'+esc(u.dni||'')+'"></div>'+
        '<div><label for="f-pw">Contraseña'+(ed.nuevo?'':' (vacío = no cambiar)')+'</label><input id="f-pw" type="password" autocomplete="new-password"></div>'+
        '<div><label for="f-rol">Rol</label><select id="f-rol"><option value="colab"'+(u.rol==='colab'?' selected':'')+'>Colaborador</option><option value="admin"'+(u.rol==='admin'?' selected':'')+'>Administrador (ve todo)</option></select></div>'+
                '<div class="full" id="f-permw"'+(u.rol==='admin'?' hidden':'')+'><label>Locales y áreas que puede ver</label><div class="perm">'+
        LOCS.map(function(l){var v=(u.perm||{})[l[0]]||'';return '<div><b>'+l[1]+'</b><select data-pl="'+l[0]+'">'+
          [['','Sin acceso'],['salon','Solo Salón'],['cocina','Solo Cocina'],['ambos','Salón y Cocina']].map(function(o){return '<option value="'+o[0]+'"'+(v===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div>';}).join('')+'</div></div>'+
        '<div class="full acts"><button type="button" class="dl-btn" data-adm="guardar">GUARDAR</button>'+'<button type="button" class="dl-btn alt" data-adm="cancelar">CANCELAR</button></div></div>';
    }
    h+='<div class="msg '+(msg&&msg.e?'e':'o')+'" role="status">'+(msg?esc(msg.t):'')+'</div>';
    h+='<div class="auth-note">Los usuarios se guardan en la base compartida y valen en cualquier dispositivo. Copia de seguridad: <button type="button" class="dl-btn alt mini" data-adm="exp">EXPORTAR</button> <button type="button" class="dl-btn alt mini" data-adm="imp">IMPORTAR</button></div>';
    el.innerHTML=h;
  }
  function setMsg(t,e){msg={t:t,e:!!e};renderAdm();}
  async function guardarUser(){
    var f=ed.form, dni=String(document.getElementById('f-usr').value).replace(/\D/g,''),
        pw=document.getElementById('f-pw').value, rol=document.getElementById('f-rol').value, perm={};
    [].forEach.call(document.querySelectorAll('[data-pl]'),function(s){if(s.value)perm[s.getAttribute('data-pl')]=s.value;});
    if(!dni&&(ed.nuevo||f.dni)) return setMsg('Completá el DNI.',true);
    if(dni&&dni.length<6) return setMsg('El DNI no es válido.',true);
    if(dni&&users.some(function(x){return x.dni===dni&&x.id!==f.id;})) return setMsg('Ese DNI ya tiene usuario.',true);
    var nom=f.usuario||'';
    if(dni&&dni!==f.dni){ var c=window.__ciclo, e=null; try{ if(c){ await c.pull(); e=c.find(dni); } }catch(x){}
      if(!e) return setMsg('Ese DNI no figura en ciclo. Cargalo primero ahí.',true); nom=e.nombre; }
    if(ed.nuevo&&pw.length<6) return setMsg('La contraseña debe tener al menos 6 caracteres.',true);
    if(pw&&pw.length<6) return setMsg('La contraseña debe tener al menos 6 caracteres.',true);
    if(f.rol==='admin'&&rol!=='admin'&&users.filter(function(x){return x.rol==='admin';}).length<2) return setMsg('Tiene que quedar al menos un administrador.',true);
    var u=ed.nuevo?{id:'u'+Date.now()}:users.filter(function(x){return x.id===f.id;})[0];
    u.nombre=nom;u.usuario=nom;if(dni)u.dni=dni;u.rol=rol;u.perm=rol==='admin'?{}:perm;
    if(pw){u.salt=newSalt();u.hash=await hash(pw,u.salt);}
    if(ed.nuevo) users.push(u); save();
    var mismo=cur&&u.id===cur.id; ed=null; setMsg('Usuario guardado.');
    if(mismo) location.reload();
  }
  document.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-adm]'); if(!b||!cur||cur.rol!=='admin') return;
    var a=b.getAttribute('data-adm'), id=b.getAttribute('data-id');
    if(a==='nuevo'){ed={nuevo:true,form:{nombre:'',usuario:'',dni:'',rol:'colab',perm:{}}};msg=null;renderAdm();}
    else if(a==='edit'){var u=users.filter(function(x){return x.id===id;})[0];ed={nuevo:false,form:JSON.parse(JSON.stringify(u))};msg=null;renderAdm();}
    else if(a==='cancelar'){ed=null;msg=null;renderAdm();}
    else if(a==='guardar'){guardarUser();}
    else if(a==='del'){
      var t=users.filter(function(x){return x.id===id;})[0];
      if(t.id===cur.id) return setMsg('No podés eliminar tu propio usuario.',true);
      if(t.rol==='admin'&&users.filter(function(x){return x.rol==='admin';}).length<2) return setMsg('Tiene que quedar al menos un administrador.',true);
      if(!ed||ed.arm!==id){ed={arm:id};renderAdm();setTimeout(function(){if(ed&&ed.arm===id){ed=null;renderAdm();}},4000);return;}
      users=users.filter(function(x){return x.id!==id;}); save(); ed=null; setMsg('Usuario eliminado.');
    }
    else if(a==='exp'){var bl=new Blob([JSON.stringify(users)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='usuarios-barra.json';document.body.appendChild(l);l.click();l.remove();}
    else if(a==='imp'){var i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=function(){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);
      if(!Array.isArray(d)||!d.every(function(x){return x&&x.id&&x.usuario&&x.hash&&x.salt;})||!d.some(function(x){return x.rol==='admin';})) throw 0;
      users=d;save();if(!users.some(function(x){return x.id===cur.id;})){SS.set(null);location.reload();}else setMsg('Usuarios importados.');}catch(e){setMsg('Archivo inválido.',true);}};r.readAsText(i.files[0]);};i.click();}
  });
  document.addEventListener('change',function(ev){
    if(ev.target.id==='f-rol'&&ed&&ed.form){ed.form.dni=document.getElementById('f-usr').value;ed.form.rol=ev.target.value;
      var w=document.getElementById('f-permw'); if(w) w.hidden=ev.target.value==='admin';}
  });
  window.__authInit=function(){
    if(!cur){showGate();return;}
    var nav=document.querySelector('.navbar'), st=nav.querySelector('.stamp');
    var w=document.createElement('div'); w.className='who'; w.innerHTML='<span>'+esc(cur.usuario)+'</span><button type="button" class="dl-btn alt" id="a-out">SALIR</button>';
    nav.replaceChild(w,st); document.getElementById('a-out').onclick=function(){SS.set(null);location.reload();};
    if(cur.rol==='admin'){
      var tb=document.createElement('button'); tb.type='button'; tb.className='tab'; tb.setAttribute('role','tab'); tb.setAttribute('data-tab','adm'); tb.setAttribute('aria-selected','false'); tb.textContent='Administrar';
      document.querySelector('.tabs').appendChild(tb);
      var v=document.createElement('div'); v.id='v-adm'; v.hidden=true; v.innerHTML='<div class="adm" id="adm-root"></div>';
      document.getElementById('v-hor').after(v); renderAdm();
    }
  };
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* Trabajadores + llegada por QR. Base compartida: bin nuevo de JSONBin "barra-asistencia-trabajadores". */
(function(){
  'use strict';
  var NAME='barra-asistencia-trabajadores', RADIO=150, SAL=['encargado','cajero','salon','limpieza'];
  var LOCS=[['palermo','Palermo'],['belgrano','Belgrano'],['bulnes','Bulnes'],['caseros','Caseros']];
  function $(i){return document.getElementById(i);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function pad(n){return n<10?'0'+n:''+n;}
  function hoyF(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function horaH(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
  function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null;}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}return null;}
  function hx(u){return Array.from(u,function(b){return ('0'+b.toString(16)).slice(-2);}).join('');}
  function rnd(n){return hx(crypto.getRandomValues(new Uint8Array(n)));}
  function dev(){var d=ls('barra-dev');if(!d){d='d'+rnd(12);ls('barra-dev',d);}return d;}
  function LN(k){var l=LOCS.filter(function(x){return x[0]===k;})[0];return l?l[1]:k;}
  function usr(){return window.__auth&&window.__auth.user;}
  function esAdmin(){var u=usr();return !!u&&u.rol==='admin';}
  async function sha(t){return hx(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t))));}
  async function pbk(p,s){var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
    return hx(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(s),iterations:100000,hash:'SHA-256'},k,256)));}
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

  /* ---------- base compartida (JSONBin) ---------- */
  var B={id:ls('barra-asis-bin')};
  function hd(x){var h={'X-Master-Key':window.__ciclo.key()};for(var k in x)h[k]=x[k];return h;}
  async function buscar(){
    if(B.id) return B.id; var last='';
    for(var i=0;i<6;i++){
      var r=await fetch('https://api.jsonbin.io/v3/c/uncategorized/bins'+(last?'/'+last:''),{headers:hd({})});
      if(!r.ok) throw new Error('No se pudo conectar con la base compartida (HTTP '+r.status+').');
      var a=await r.json(); if(!a.length) break;
      for(var j=0;j<a.length;j++) if((a[j].snippetMeta||{}).name===NAME){B.id=a[j].record;ls('barra-asis-bin',B.id);return B.id;}
      last=a[a.length-1].record; if(a.length<10) break;
    }
    return null;
  }
  async function crear(){
    var c=window.__ciclo, d={v:1,sec:rnd(12),workers:{},users:JSON.parse(JSON.stringify(window.__auth.getUsers())),hor:c.getHor()||{},sem:c.getSem()||null,geo:{},ll:[]};
    var r=await fetch('https://api.jsonbin.io/v3/b',{method:'POST',headers:hd({'Content-Type':'application/json','X-Bin-Name':NAME,'X-Bin-Private':'true'}),body:JSON.stringify(d)});
    if(!r.ok) throw new Error('No se pudo crear la base compartida (HTTP '+r.status+').');
    B.id=(await r.json()).metadata.id; ls('barra-asis-bin',B.id);
  }
  async function leer(){
    var id=await buscar();
    if(!id){ if(!esAdmin()&&!B.adm) throw new Error('La base compartida todavía no está creada. Pedile al administrador que abra la página una vez.'); await crear(); id=B.id; }
    var r=await fetch('https://api.jsonbin.io/v3/b/'+id+'/latest',{headers:hd({'X-Bin-Meta':'false'}),cache:'no-store'});
    if(!r.ok) throw new Error('No se pudo leer la base compartida (HTTP '+r.status+').');
    var d=await r.json(); d.workers=d.workers||{};d.hor=d.hor||{};d.geo=d.geo||{};d.ll=d.ll||[];d.users=Array.isArray(d.users)?d.users:[]; return d;
  }
  /* lee, modifica, guarda y verifica (si dos celulares guardan a la vez, reintenta) */
  async function mutar(fn,ok){
    for(var i=0;i<4;i++){
      var d=await leer(); fn(d);
      var r=await fetch('https://api.jsonbin.io/v3/b/'+B.id,{method:'PUT',headers:hd({'Content-Type':'application/json'}),body:JSON.stringify(d)});
      if(!r.ok) throw new Error('No se pudo guardar (HTTP '+r.status+').');
      var c=await leer(); if(!ok||ok(c)) return c;
      await sleep(400+Math.random()*900);
    }
    throw new Error('No se pudo guardar. Probá de nuevo.');
  }
  /* horarios y semana: el administrador los sube a la base (con unos segundos de espera para juntar cambios) */
  var pend={},tm=null;
  function flush(){var p=pend;pend={};
    mutar(function(d){Object.keys(p).forEach(function(x){var q=p[x];if(q[0]==='hor')d.hor[q[1]]=q[2];else d.sem=q[2];});})
      .catch(function(){Object.keys(p).forEach(function(x){if(!pend[x])pend[x]=p[x];});clearTimeout(tm);tm=setTimeout(flush,30000);});}
  window.__bin={push:function(k,sub,val){if(!esAdmin())return;pend[k+'|'+(sub||'')]=[k,sub,val];clearTimeout(tm);tm=setTimeout(flush,4000);}};

  /* ---------- usuarios (admin / colaborador) en la base compartida ---------- */
  var PU={pend:false};
  function J(v){return JSON.stringify(v);}
  function pushUsers(list){
    if(!esAdmin()) return;
    var snap=JSON.parse(J(list)); PU.pend=true;
    mutar(function(d){d.users=snap;},function(c){return J(c.users)===J(snap);})
      .then(function(){PU.pend=false;})
      .catch(function(){ setTimeout(function(){ pushUsers(window.__auth.getUsers()); },30000); });
  }
  async function syncUsers(){
    var d=await leer(); if(d.users.length) window.__auth.setUsers(d.users); return d.users;
  }
  function adoptUsers(d){
    var u=usr(), A=window.__auth; if(!u||u.rol==='trab'||PU.pend) return;
    var bl=d.users||[];
    if(!bl.length){ if(esAdmin()&&A.getUsers().length) pushUsers(A.getUsers()); return; }
    if(J(bl)===J(A.getUsers())) return;
    A.setUsers(bl);
    if(u.id==='root'){ A.refresh(); return; }
    var mine=bl.filter(function(x){return x.id===u.id;})[0];
    if(!mine){ try{sessionStorage.removeItem('barra-sess');}catch(e){} location.reload(); return; }
    if(J(mine)!==J(u)){ location.reload(); return; }
    A.refresh();
  }

  /* ---------- ubicación y llegada ---------- */
  function dist(a,b,c,d){var r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 12742000*Math.asin(Math.sqrt(h));}
  function pos(){return new Promise(function(ok,no){
    if(!navigator.geolocation) return no(new Error('Este celular no permite tomar la ubicación.'));
    navigator.geolocation.getCurrentPosition(ok,function(e){no(new Error(e.code===1?'Tenés que permitir la ubicación para poder registrar.':'No se pudo tomar la ubicación. Probá de nuevo.'));},{enableHighAccuracy:true,maximumAge:0,timeout:20000});});}
  async function tokDe(d){var f=hoyF();return 'qr.'+f.replace(/-/g,'')+'.'+(await sha('qr'+f+d.sec)).slice(0,10);}
  async function registrar(t){
    var w=ls('barra-trab'); if(!w) throw new Error('Primero entrá con tu DNI y contraseña.');
    var p=String(t).split('.'), d=await leer(), me=d.workers[w.dni];
    if(!me||me.dev!==dev()) throw new Error('Tu cuenta ya no está activa en este celular. Volvé a entrar con tu DNI.');
    if(p[0]!=='qr'||t!==await tokDe(d)) throw new Error('Este QR no es válido o es de otro día. Pedí el de hoy.');
    var ks=Object.keys(d.geo); if(!ks.length) throw new Error('Todavía no hay ubicaciones de locales cargadas. Avisale al administrador.');
    var q=await pos(), acc=Math.min(q.coords.accuracy||0,100), best=null;
    ks.forEach(function(k){ var g=d.geo[k], m=dist(g.lat,g.lng,q.coords.latitude,q.coords.longitude); if(m-acc<=RADIO&&(!best||m<best.m)) best={l:k,m:m}; });
    if(!best) throw new Error('No estás dentro del área de ningún local. Acercate al local para fichar.');
    var mios=d.ll.filter(function(x){return x.id===w.rid;}).sort(function(a,b){return b.ts-a.ts;}), u=mios[0], ahora=Date.now();
    if(u&&ahora-u.ts<120000) return {l:u.l,h:u.h,ya:true,t:u.t==='s'?'sa':'ll'};
    var tp=(u&&u.t!=='s'&&ahora-u.ts<18*36e5)?'sa':'ll', h=horaH(), lim=ahora-14*864e5;
    await mutar(function(x){x.ll=x.ll.filter(function(y){return y.ts>lim;});var e={id:w.rid,n:w.n,l:best.l,f:hoyF(),h:h,m:Math.round(best.m),ts:ahora};if(tp==='sa')e.t='s';x.ll.push(e);},
      function(x){return x.ll.some(function(y){return y.id===w.rid&&y.ts===ahora;});});
    return {l:best.l,h:h,t:tp};
  }
  function ov(html){var o=document.createElement('div');o.className='expm';o.style.zIndex=1001;o.innerHTML='<div class="expm-c">'+html+'</div>';document.body.appendChild(o);return o;}
  async function llegadaUI(t){
    var o=ov('<h3>Registrando…</h3><p>Tomando tu ubicación. Aceptá el permiso si te lo pide.</p>'),c=o.querySelector('.expm-c');
    try{ var r=await registrar(t);
      var sal=r.t==='sa'; c.innerHTML='<h3>'+(r.ya?(sal?'Ya fichaste tu salida':'Ya fichaste tu entrada'):(sal?'¡Salida registrada!':'¡Entrada registrada!'))+'</h3><p>'+esc(LN(r.l))+' · '+esc(r.h)+'</p><button type="button" class="expm-b" id="gx-ok">LISTO</button>';
    }catch(e){ c.innerHTML='<h3>No se pudo registrar</h3><p>'+esc(e.message||'Error')+'</p><button type="button" class="expm-b" id="gx-ok">CERRAR</button>'; }
    c.querySelector('#gx-ok').onclick=function(){o.remove();};
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  }
  function escanear(){
    if(!('BarcodeDetector' in window)||!navigator.mediaDevices){ ov('<h3>Escanear</h3><p>Abrí la cámara de tu celular y apuntá al QR del local. Te trae de vuelta acá.</p><button type="button" class="expm-b" id="gx-ok">ENTENDIDO</button>').querySelector('#gx-ok').onclick=function(e){e.target.closest('.expm').remove();}; return; }
    var o=ov('<h3>Apuntá al QR del local</h3><video autoplay playsinline muted></video><button type="button" class="expm-b alt" id="gx-x">CANCELAR</button>'),v=o.querySelector('video'),st=null,iv=null;
    function fin(){clearInterval(iv);if(st)st.getTracks().forEach(function(t){t.stop();});o.remove();}
    o.querySelector('#gx-x').onclick=fin;
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){
      st=s;v.srcObject=s;var bd=new BarcodeDetector({formats:['qr_code']});
      iv=setInterval(function(){bd.detect(v).then(function(r){if(!r.length)return;var raw=r[0].rawValue,mq=/#(qr\.\S+)$/.exec(raw);fin();if(mq)llegadaUI(mq[1]);else ov('<h3>QR incorrecto</h3><p>Ese no es el QR del local.</p><button type="button" class="expm-b" id="gx-ok">CERRAR</button>').querySelector('#gx-ok').onclick=function(e){e.target.closest('.expm').remove();};}).catch(function(){});},400);
    }).catch(function(){fin();ov('<h3>Sin cámara</h3><p>No pudimos abrir la cámara. Usá la cámara del celular para escanear el QR.</p><button type="button" class="expm-b" id="gx-ok">CERRAR</button>').querySelector('#gx-ok').onclick=function(e){e.target.closest('.expm').remove();};});
  }

  /* ---------- cuenta de trabajador ---------- */
  async function acceso(dni,pw){
    dni=String(dni).replace(/\D/g,'');

<script>
(function(){

    salon:  [{k:'encargado', n:'Encargado'}, {k:'cajero', n:'Cajero'}, {k:'salon', n:'Salón'}, {k:'limpieza', n:'Limpieza'}],
    cocina: [{k:'souschef', n:'Sous chef'}, {k:'cocina', n:'Cocina'}, {k:'bachero', n:'Bachero'}]

  }
  function areaTabs(list){
    return '<div class="subtabs" role="tablist" aria-label="Área">' + AREAS.filter(function(a){ return _A.indexOf(a.k) >= 0; }).map(function(a){
      var ps = PUESTOS[a.k];
      var enArea = list.filter(function(e){ return ps.some(function(p){ return p.k === e.puesto; }); });
      return '<button type="button" class="subtab" role="tab" data-area="' + a.k + '" aria-selected="' + (state.area === a.k) + '">' + a.n +
        ' <small>' + enArea.filter(isPresent).length + '/' + enArea.length + '</small></button>';
    }).join('') + '</div>';
  }
  function area(a, list){
    var ps = PUESTOS[a.k];
    var enArea = list.filter(function(e){ return ps.some(function(p){ return p.k === e.puesto; }); });
    var pres = enArea.filter(isPresent).length;
    return '<section class="area" aria-label="' + a.n + '"><div class="area-h"><h2>' + a.n + '</h2><span class="area-n">' + pres + ' de ' + enArea.length + ' presentes</span></div>' +
      '<div class="puestos ' + (ps.length === 4 ? 'p4' : 'p3') + '">' + ps.map(function(p){ return card(p, list); }).join('') + '</div></section>';
  }

  function renderBoard(){
    var el = $('board');
    if (state.dbOk === false) { el.innerHTML = vacio('No se pudo traer el equipo de ciclo', 'Revisá la conexión y recargá la página.'); return; }
    if (!state.loaded) { el.innerHTML = vacio('Abriendo la barra…', 'Cargando el equipo de los cuatro locales.'); return; }
    if (!_A.length) { el.innerHTML = vacio('Sin accesos', 'Pedile al administrador que te asigne un local.'); return; }
    if (!state.emps.length) {
      el.innerHTML = vacio('Todavía no hay empleados', state.writable ? 'Tocá Gestionar y agregá a la primera persona del equipo.' : 'Pedile a quien administra esta página que cargue al equipo.');
      return;
    }
    var list = filtrados();
    var ar = AREAS.filter(function(a){ return a.k === state.area; })[0] || AREAS[0];
    el.innerHTML = areaTabs(list) + area(ar, list);
  }

  function renderLocales(){
    var items = [{k: 'todos', n: 'Todos', list: state.emps}].concat(state.locales.map(function(n, i){
      return {k: String(i), n: n, list: state.emps.filter(function(e){ return e.local === i; })};
    }));
    $('locales').innerHTML = items.filter(function(it){ return it.k === 'todos' ? _L.length > 1 : __auth.locIdx(+it.k); }).map(function(it){
      var t = it.list.length, p = it.list.filter(isPresent).length, pct = t ? Math.round(p * 100 / t) : 0;
      return '<button type="button" class="loc" data-k="' + it.k + '" aria-pressed="' + (state.sel === it.k) + '">' +
        '<span class="ln">' + esc(it.n) + '</span>' +
        '<span class="lc">' + p + '/' + t + ' <small>presentes</small></span>' +
        '<span class="bar-t" aria-hidden="true"><span class="bar-f" style="width:' + pct + '%"></span></span></button>';
    }).join('');
  }

  function renderPills(){
    var list = filtrados();
    var p = list.filter(isPresent).length;
    var nombre = state.sel === 'todos' ? (_L.length < 4 ? 'Mis locales' : 'Los 4 locales') : (state.locales[+state.sel] || '');
    $('pills').innerHTML =
      '<span class="count-pill">' + esc(nombre) + '</span>' +
      '<span class="count-pill si">Presentes<b>' + p + '</b></span>' +
      '<span class="count-pill no">Ausentes<b>' + (list.length - p) + '</b></span>';
  }

  function renderAvisos(){
    var h = '';
    if (state.toast) h += '<div class="aviso' + (state.toast.err ? ' err' : '') + '">' + esc(state.toast.msg) + '</div>';
    if (state.loaded && state.emps.some(function(e){ return e.ejemplo; })) {
      h += '<div class="aviso">Estás viendo empleados de ejemplo.' + (state.writable ? ' Cargá a tu equipo real y quitá los ejemplos desde Gestionar.' : '') + '</div>';
    }
    if (state.loaded && conHorario()) h += '<div class="aviso">Se espera a quienes tienen turno hoy en Horarios. Franco y vacaciones no figuran como ausentes.</div>';
    if (state.loaded && !state.writable) h += '<div class="aviso">Solo lectura: en esta vista no podés cambiar la asistencia.</div>';
    $('avisos').innerHTML = h;
  }

  function renderFecha(){
    var t = new Date().toLocaleDateString('es-AR', {weekday: 'long', day: 'numeric', month: 'long'});
    $('fecha').textContent = t.charAt(0).toUpperCase() + t.slice(1);
  }

  function render(){
    var ae = document.activeElement, sel = null;
    if (ae && ae.hasAttribute) {
      if (ae.hasAttribute('data-id')) sel = '[data-id="' + ae.getAttribute('data-id') + '"]';
      else if (ae.hasAttribute('data-k')) sel = '[data-k="' + ae.getAttribute('data-k') + '"]';
    }
    renderFecha(); renderLocales(); renderPills(); renderAvisos(); renderBoard();
    $('b-gestionar').hidden = !(state.db && state.writable && __auth.user && __auth.user.rol === 'admin');
    if (state.sheet && !state.writable) closeSheet();
    if (sel) { var f = document.querySelector(sel); if (f && f !== document.activeElement) f.focus({preventScroll: true}); }
  }
  window.addEventListener('hor-change', function(){ if (state.loaded) render(); });

  var toastTimer = null;
  function flash(msg, err){
    state.toast = {msg: msg, err: !!err};
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ state.toast = null; renderAvisos(); }, 6000);
    renderAvisos();
  }
  function onWriteError(err){
    var c = err && err.code;
    if (c === 'invalid_argument') { state.writable = false; flash('No tenés permiso para cambiar datos en esta vista.', true); }
    else if (c === 'quota_exceeded') flash('Se llenó el espacio de la base de datos. Borrá empleados que no uses.', true);
    else flash('No se pudo guardar. Probá de nuevo en un momento.', true);
    render();
  }

  /* ---------- acciones ---------- */
  function toggle(id){
    var e = state.emps.filter(function(x){ return x.id === id; })[0];
    if (!e || !state.db) return;
    var patch = isPresent(e) ? {presenteEl: '', ingreso: ''} : {presenteEl: state.hoy, ingreso: hora()};
    state.db.doc('empleados/' + id).update(patch).catch(onWriteError);
  }
  $('board').addEventListener('click', function(ev){
    var t = ev.target.closest('.subtab');
    if (t) {
      state.area = t.getAttribute('data-area');
      try { localStorage.setItem('barra-area', state.area); } catch (e) {}
      render(); return;
    }
    var b = ev.target.closest('.chip');
    if (b && !b.disabled) toggle(b.getAttribute('data-id'));
  });
  $('locales').addEventListener('click', function(ev){
    var b = ev.target.closest('.loc');
    if (!b) return;
    state.sel = b.getAttribute('data-k');
    try { localStorage.setItem('barra-local', state.sel); } catch (e) {}
    render();
  });

  /* ---------- hoja de gestión ---------- */
  var armTimer = null;
  function arm(k){
    state.armed = k; renderTeam();
    clearTimeout(armTimer);
    armTimer = setTimeout(function(){ state.armed = null; renderTeam(); }, 4000);
  }
  function renderTeam(){
    var t = $('team');
    if (!t) return;
    var ae = document.activeElement, again = null;
    if (ae && ae.getAttribute) again = ae.id ? '#' + ae.id : (ae.hasAttribute('data-del') ? '[data-del="' + ae.getAttribute('data-del') + '"]' : null);
    var h = '';
    if (!state.emps.length) h += '<p class="hint">Todavía no hay nadie cargado desde ciclo.</p>';
    else {
      var rows = state.emps.slice().sort(function(a, b){
        return (a.local - b.local) || (puestoIdx(a.puesto) - puestoIdx(b.puesto)) || byName(a, b);
      }).map(function(e){
                return '<tr><td>' + esc(e.nombre) + (e.ejemplo ? '<span class="ej">ejemplo</span>' : '') + '</td><td>' + esc(state.locales[e.local] || '') + '</td><td>' + esc(puestoNombre(e.puesto)) +
          '</td></tr>';
      }).join('');
      h += '<div class="tbl"><table><thead><tr><th>Nombre</th><th>Local</th><th>Puesto</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }
    t.innerHTML = h;
    if (again) { var f = document.querySelector(again); if (f) f.focus({preventScroll: true}); }
  }
  function openSheet(){
    if (!state.writable || !state.db) return;
    state.sheet = true;
        $('sheet-root').innerHTML =
      '<div class="ov ov-barra" id="ov" role="dialog" aria-modal="true" aria-labelledby="sheet-t"><div class="sheet">' +
        '<div class="sheet-h"><div class="t" id="sheet-t">Gestionar equipo<small>El equipo se toma de ciclo</small></div>' +
          '<div class="bar"><button type="button" class="x" id="sheet-x" aria-label="Cerrar">✕</button></div></div>' +
        '<div class="sheet-b">' +
          '<div class="sec"><h3>Equipo de ciclo</h3><p class="hint" id="sync-st"></p>' +
            '<div class="btn-row uno" style="margin-top:10px"><button type="button" class="dl-btn main" id="b-sync">ACTUALIZAR AHORA</button></div></div>' +
          '<div class="sec"><h3>Equipo cargado</h3><div id="team"></div></div>' +
        '</div>' +
        '<div class="sheet-f"><span class="hint">La asistencia se reinicia sola cada día.</span><button type="button" class="dl-btn alt" id="sheet-ok">LISTO</button></div>' +
      '</div></div>';
    renderTeam(); if (window.__ciclo) window.__ciclo.paint();
  }
  function closeSheet(){
    state.sheet = false; state.armed = null;
    $('sheet-root').innerHTML = '';
    if (!$('b-gestionar').hidden) $('b-gestionar').focus();
  }
  $('b-gestionar').addEventListener('click', openSheet);
  $('sheet-root').addEventListener('click', function(ev){
    var t = ev.target;
    if (t.id === 'ov' || t.id === 'sheet-x' || t.id === 'sheet-ok') { closeSheet(); return; }
    if (t.closest('#b-sync') && window.__ciclo) window.__ciclo.pull(true);
  });
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && state.sheet) closeSheet(); });

  /* ---------- datos ---------- */
  function onReadError(){ state.dbOk = false; render(); }
  async function init(){
    var c = window.claude;
    if (!c || !c.use) { onReadError(); return; }
    var db = await c.use('db');
    if (!db) { onReadError(); return; }
    state.db = db; state.dbOk = true;
    try {
      var user = await c.use('user');
      if (user) { var w = await user.can('data.write'); if (w === false) state.writable = false; }
    } catch (e) {}
    db.collection('empleados').onSnapshot(function(snap){
      state.emps = snap.docs.map(function(d){
        var x = d.data() || {};
        return {id: d.id, nombre: String(x.nombre || ''), local: parseInt(x.local, 10) || 0, puesto: String(x.puesto || ''),
                presenteEl: String(x.presenteEl || ''), ingreso: String(x.ingreso || ''), ejemplo: !!x.ejemplo};
      });
      state.loaded = true;
      render();
      if (state.sheet) renderTeam();
    }, onReadError);
  }

  setInterval(function(){
    var d = dia();
    if (d !== state.hoy) { state.hoy = d; render(); }
  }, 60000);

  render();
  init().catch(onReadError);
})();
</script>

<script>
(function(){
  'use strict';
  var LOCS=[['palermo','Palermo'],['belgrano','Belgrano'],['bulnes','Bulnes'],['caseros','Caseros']].filter(function(l){ return __auth.areas(l[0]).length; });
  var DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  function $(i){ return document.getElementById(i); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad(n){ return (n<10?'0':'')+n; }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function lunesDe(d){ d=new Date(d.getFullYear(),d.getMonth(),d.getDate()); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
  Object.defineProperty(window,'__horSem',{get:function(){return H.lunes;}});
  var H={db:null,ok:null,w:true,loaded:false,loc:(LOCS[0]||['palermo'])[0],area:'salon',expA:'ambos',info:'',armCopy:false,vista:'sem',dia:0,col:'',lunes:iso(lunesDe(new Date())),data:{},armed:null,msg:''};
  try{
    var sl=localStorage.getItem('barra-hloc'); if(LOCS.some(function(l){ return l[0]===sl; })) H.loc=sl;
    var sa=localStorage.getItem('barra-harea'); if(sa==='salon'||sa==='cocina') H.area=sa;
  }catch(e){}
  function fixArea(){ var a=__auth.areas(H.loc); if(a.length&&a.indexOf(H.area)<0) H.area=a[0]; }
  fixArea();
  function expOpts(){ var a=__auth.areas(H.loc); return a.length>1?['ambos','salon','cocina']:a; }
  function expSel(){ var o=expOpts(); return o.indexOf(H.expA)>=0?H.expA:o[0]; }

  function pedirArea(kind){
    var o=expOpts(); if(o.length<2){ H.expA=o[0]; exportar(kind); return; }
    var T={ambos:'Salón y Cocina',salon:'Solo Salón',cocina:'Solo Cocina'};
    var ov=document.createElement('div'); ov.className='expm';
    ov.innerHTML='<div class="expm-c" role="dialog" aria-modal="true"><h3>¿Qué querés descargar?</h3><p>'+(kind==='pdf'?'PDF':'Imagen')+' · '+esc(nombreLoc())+'</p>'+
      o.map(function(k){ return '<button type="button" class="expm-b" data-o="'+k+'">'+T[k]+'</button>'; }).join('')+'<button type="button" class="expm-b alt" data-o="">Cancelar</button></div>';
    function cerrar(){ ov.remove(); document.removeEventListener('keydown',esc2); }
    function esc2(e){ if(e.key==='Escape') cerrar(); }
    ov.addEventListener('click',function(e){ var b=e.target.closest('button');
      if(e.target===ov||(b&&b.getAttribute('data-o')==='')){ cerrar(); return; }
      if(b){ H.expA=b.getAttribute('data-o'); cerrar(); exportar(kind); } });
    document.addEventListener('keydown',esc2); document.body.appendChild(ov);
    var f=ov.querySelector('.expm-b'); if(f) f.focus();
  }

  function cls(v){
    v=String(v||'').trim().toUpperCase();
    if(v==='FRANCO') return 's-f'; if(v==='VACACIONES') return 's-v';
    var m=/^(\d{1,2})/.exec(v); if(!m) return '';
    var h=+m[1]; return h<=10?'s-m':(h<=16?'s-d':'s-c');
  }
  function pres(v){ v=String(v||'').trim().toUpperCase(); return v!==''&&v!=='FRANCO'&&v!=='VACACIONES'; }
  function fechas(){
    var p=H.lunes.split('-');
    return DIAS.map(function(_,i){ var d=new Date(+p[0],+p[1]-1,+p[2]+i); return pad(d.getDate())+'/'+pad(d.getMonth()+1); });
  }
  function cur(){ return H.data[H.loc]||{nombre:'',filas:[]}; }
  function ensure(){ if(!H.data[H.loc]) H.data[H.loc]={nombre:'',filas:[]}; return H.data[H.loc]; }
  function nombreLoc(){ var q=LOCS.filter(function(l){ return l[0]===H.loc; })[0]; return q?q[1]:''; }
  function areaDe(r){ return r.a==='cocina'?'cocina':'salon'; }
  function visibles(d){ return d.filas.map(function(r,i){ return {r:r,i:i}; }).filter(function(o){ return areaDe(o.r)===H.area; }); }
  function norm(r){ r=r||{}; return {c:String(r.c||''),s:String(r.s||''),a:(r.a==='cocina'?'cocina':'salon'),d:[0,1,2,3,4,5,6].map(function(i){ return String((r.d||[])[i]||''); })}; }

  /* ---------- dibujo ---------- */
  function renderLocs(){
    $('h-locales').innerHTML=LOCS.map(function(l){
      var n=(H.data[l[0]]||{filas:[]}).filas.length;
      return '<button type="button" class="loc" data-hl="'+l[0]+'" aria-pressed="'+(H.loc===l[0])+'"><span class="ln">'+l[1]+'</span><span class="lc">'+n+' <small>colaboradores</small></span></button>';
    }).join('');
  }
  function renderBar(){
    var f=fechas(), d=cur();
    var h='<div class="subtabs" role="tablist" aria-label="Área">'+[['salon','Salón'],['cocina','Cocina']].filter(function(a){ return __auth.puede(H.loc,a[0]); }).map(function(a){
      var n=d.filas.filter(function(r){ return areaDe(r)===a[0]; }).length;
      return '<button type="button" class="subtab" role="tab" data-ha="'+a[0]+'" aria-selected="'+(H.area===a[0])+'">'+a[1]+' <small>'+n+'</small></button>';
    }).join('')+'</div>';
    h+='<div class="seg">'+[['sem','Semana'],['dia','Por día'],['col','Por colaborador']].map(function(v){
      return '<button type="button" class="dl-btn alt" data-v="'+v[0]+'" aria-pressed="'+(H.vista===v[0])+'">'+v[1]+'</button>';
    }).join('')+'</div>';
    h+='<div class="hbar"><label for="h-lunes">Semana del lunes</label><input type="date" id="h-lunes" value="'+H.lunes+'"'+(H.w?'':' disabled')+'></div>';
    h+='<div class="seg"><button type="button" class="dl-btn alt" data-exp="pdf">⬇ DESCARGAR PDF</button><button type="button" class="dl-btn alt" data-exp="png">⬇ DESCARGAR IMAGEN</button></div>';
    if(H.vista==='dia') h+='<div class="seg">'+DIAS.map(function(n,i){
      return '<button type="button" class="dl-btn alt" data-dia="'+i+'" aria-pressed="'+(H.dia===i)+'">'+n.slice(0,3)+' '+f[i]+'</button>';
    }).join('')+'</div>';
    if(H.vista==='col'){
      var nombres=visibles(d).map(function(o){ return o.r.c; }).filter(Boolean);
      if(nombres.indexOf(H.col)<0) H.col=nombres[0]||'';
      h+='<div class="hbar"><label for="h-col">Colaborador</label><select id="h-col">'+nombres.map(function(n){
        return '<option'+(n===H.col?' selected':'')+'>'+esc(n)+'</option>';
      }).join('')+'</select></div>';
    }
    $('h-bar').innerHTML=h;
  }
  function totales(d){
    var fs=visibles(d).map(function(o){ return o.r; });
    return [0,1,2,3,4,5,6].map(function(i){ return fs.filter(function(r){ return pres(r.d[i]); }).length; });
  }
  function renderBoard(){
    var el=$('h-board');
    if(H.ok===false){ el.innerHTML='<div class="empty"><div class="big">No se pudieron abrir los horarios</div><div class="small">Revisá la conexión y recargá la página.</div></div>'; return; }
    if(!H.loaded){ el.innerHTML='<div class="empty"><div class="big">Abriendo horarios…</div></div>'; return; }
    var d=cur(), f=fechas(), ed=H.w&&H.vista==='sem';
    var cols=H.vista==='dia'?[H.dia]:[0,1,2,3,4,5,6];
    var th='<th>N°</th><th>Colaborador</th><th>Sector</th>'+cols.map(function(i){ return '<th>'+DIAS[i].toUpperCase().replace('MIÉRCOLES','MIERCOLES').replace('SÁBADO','SABADO')+'<small>'+f[i]+'</small></th>'; }).join('')+(ed?'<th></th>':'');
    var rows=visibles(d).map(function(o,k){
      var r=o.r, ri=o.i;
      if(H.vista==='col'&&r.c!==H.col) return '';
      if(H.vista==='dia'&&!String(r.d[H.dia]).trim()) return '';
      var tds=cols.map(function(i){
        var v=r.d[i];
        return ed?'<td class="'+cls(v)+'"><input data-r="'+ri+'" data-c="'+i+'" value="'+esc(v)+'" list="h-opc" autocomplete="off" aria-label="'+DIAS[i]+' de '+esc(r.c)+'"></td>':'<td class="'+cls(v)+'">'+esc(v)+'</td>';
      }).join('');
      var nm=ed?'<input data-r="'+ri+'" data-f="c" value="'+esc(r.c)+'" aria-label="Colaborador" autocomplete="off">':esc(r.c);
      var sc=ed?'<input data-r="'+ri+'" data-f="s" value="'+esc(r.s)+'" aria-label="Sector" autocomplete="off">':esc(r.s);
      var del=ed?'<td class="x"><button type="button" class="mini'+(H.armed===ri?' armed':'')+'" data-del="'+ri+'">'+(H.armed===ri?'¿Seguro?':'Borrar')+'</button></td>':'';
      return '<tr><td class="n">'+(k+1)+'</td><td class="cn">'+nm+'</td><td class="sc">'+sc+'</td>'+tds+del+'</tr>';
    }).join('');
    if(!rows) rows='<tr><td colspan="'+(cols.length+4)+'" style="padding:22px;font-style:italic;opacity:.7">'+(visibles(d).length?'Nadie con horario cargado para este día.':'Todavía no hay colaboradores cargados en este sector.')+'</td></tr>';
    var t=totales(d);
    var foot=H.vista==='col'?'':'<tfoot><tr><td class="l" colspan="3">PRESENTES / DÍA</td>'+cols.map(function(i){ return '<td data-tot="'+i+'">'+t[i]+'</td>'; }).join('')+(ed?'<td></td>':'')+'</tr></tfoot>';
    var ref='<div class="ref"><b>Referencias:</b><span><i class="s-m"></i>Turno mañana (inicio ≤10 hs)</span><span><i class="s-d"></i>Turno mediodía (inicio 11-16 hs)</span><span><i class="s-c"></i>Turno cierre (inicio ≥17 hs)</span><span><i class="s-f"></i>Franco</span><span><i class="s-v"></i>Vacaciones</span></div>';
    var add=ed?'<div class="hadd" style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="dl-btn alt" data-add>+ AGREGAR COLABORADOR</button><button type="button" class="dl-btn alt" data-copy>'+(H.armCopy?'¿SEGURO? REEMPLAZA LOS HORARIOS DE ESTA SEMANA':'⧉ COPIAR SEMANA ANTERIOR ('+fmtC(prevLunes())+')')+'</button></div>':'';
    el.innerHTML='<div class="hwrap"><div class="htit">Barra Chalaca — '+nombreLoc()+' · '+(H.area==='cocina'?'Cocina':'Salón')+'</div><div class="ht"><table><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody>'+foot+'</table></div>'+add+ref+'</div>';
  }
  function avisos(){
    $('h-avisos').innerHTML=(H.info?'<div class="aviso">'+esc(H.info)+'</div>':'')+(H.msg?'<div class="aviso err">'+esc(H.msg)+'</div>':'')+(H.loaded&&!H.w?'<div class="aviso">Solo lectura: en esta vista no podés cambiar los horarios.</div>':'');
  }
  function render(){
    var ae=document.activeElement, sel=null;
    if(ae&&ae.hasAttribute&&ae.closest&&ae.closest('#h-board')&&ae.hasAttribute('data-r')){
      sel='input[data-r="'+ae.getAttribute('data-r')+'"]'+(ae.hasAttribute('data-f')?'[data-f="'+ae.getAttribute('data-f')+'"]':'[data-c="'+ae.getAttribute('data-c')+'"]');
    }
    renderLocs(); renderBar(); renderBoard(); avisos();
    if(sel){ var f=document.querySelector(sel); if(f) f.focus({preventScroll:true}); }
  }

  /* ---------- historial, copiar semana, exportar ---------- */
  var HK='barra-hist', infoTimer=null;
  function plain(v){ return String(v||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function histGet(){ try{ return JSON.parse(localStorage.getItem(HK)||'{}')||{}; }catch(e){ return {}; } }
  function histSet(h){
    var ks=Object.keys(h).sort(function(a,b){ return a.split('|')[1]<b.split('|')[1]?-1:1; });
    while(ks.length>80) delete h[ks.shift()];
    try{ localStorage.setItem(HK,JSON.stringify(h)); }catch(e){}
  }
  function prevLunes(){ var p=H.lunes.split('-'); return iso(new Date(+p[0],+p[1]-1,+p[2]-7)); }
  function fmtC(i){ var p=i.split('-'); return p[2]+'/'+p[1]; }
  function info(m){ H.info=m; clearTimeout(infoTimer); infoTimer=setTimeout(function(){ H.info=''; avisos(); },7000); avisos(); }
  function cambiarSemana(nuevo){
    if(nuevo===H.lunes) return;
    var h=histGet();
    LOCS.forEach(function(l){ var d=H.data[l[0]]; if(d&&d.filas.length) h[l[0]+'|'+H.lunes]=JSON.parse(JSON.stringify(d.filas)); });
    H.lunes=nuevo; H.armCopy=false;
    LOCS.forEach(function(l){
      var d=H.data[l[0]]; if(!d) return;
      var g=h[l[0]+'|'+nuevo];
      d.filas=g?g.map(norm):d.filas.map(function(r){ return {c:r.c,s:r.s,a:r.a,d:['','','','','','','']}; });
      if(H.db) H.db.doc('horarios/'+l[0]).set({nombre:d.nombre,filas:d.filas}).catch(fallo);
    });
    histSet(h); render();
    if(H.db) H.db.doc('config/semana').set({lunes:H.lunes}).catch(fallo);
    info(h[LOCS[0][0]+'|'+nuevo]?'Semana cargada desde el historial.':'Semana nueva y vacía. Usá "Copiar semana anterior" para traer los horarios de la semana pasada.');
  }
  function copiar(){
    var pl=prevLunes(), g=histGet()[H.loc+'|'+pl];
    if(!g){ info('No hay una semana anterior guardada para este local. Se guarda sola cuando cambiás de semana con el selector.'); return; }
    var d=ensure(), n=0;
    d.filas.forEach(function(r){
      if(!String(r.c||'').trim()) return;
      var m=g.filter(function(x){ return plain(x.c)===plain(r.c); })[0];
      if(m){ r.d=norm(m).d; n++; }
    });
    guardar(); render();
    info('Listo: se copiaron los horarios de '+n+' colaboradores de la semana del '+fmtC(pl)+'.');
  }
  function bajar(blob,name){
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
  }
  function pdfDeJpeg(url,w,h){
    var bin=atob(url.split(',')[1]), img=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) img[i]=bin.charCodeAt(i);
    var PW=842, ih=PW*h/w, PH=Math.max(595,ih), enc=new TextEncoder(), parts=[], off=0, offs=[];
    function add(u){ parts.push(u); off+=u.length; }
    function t(x){ add(enc.encode(x)); }
    t('%PDF-1.4\n');
    offs[1]=off; t('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    offs[2]=off; t('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
    offs[3]=off; t('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH.toFixed(2)+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n');
    offs[4]=off; t('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n'); add(img); t('\nendstream\nendobj\n');
    var cs='q '+PW+' 0 0 '+ih.toFixed(2)+' 0 '+(PH-ih).toFixed(2)+' cm /Im0 Do Q';
    offs[5]=off; t('5 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    var xo=off; t('xref\n0 6\n0000000000 65535 f \n');
    for(var k=1;k<=5;k++) t(('0000000000'+offs[k]).slice(-10)+' 00000 n \n');
    t('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
    return new Blob(parts,{type:'application/pdf'});
  }
  async function exportar(kind){
    var d=cur(), f=fechas();
    var grupos=[['salon','SALÓN'],['cocina','COCINA']].filter(function(g){ var sel=expSel(); return __auth.puede(H.loc,g[0])&&(sel==='ambos'||sel===g[0]); }).map(function(g){
      return {n:g[1],filas:d.filas.filter(function(r){ return areaDe(r)===g[0]&&String(r.c||'').trim(); })};
    }).filter(function(g){ return g.filas.length; });
    if(!grupos.length){ info('No hay colaboradores cargados en este local para exportar.'); return; }
    try{ await document.fonts.load('20px Anton'); await document.fonts.load('14px "DM Sans"'); await document.fonts.load('bold 14px "DM Sans"'); }catch(e){}
    var SC=2,PAD=24,cN=34,cC=220,cS=150,cD=112,rh=30,hh=42,band=34,gap=22,top0=100;
    var W=PAD*2+cN+cC+cS+cD*7, Ht=top0;
    grupos.forEach(function(g){ Ht+=band+hh+(g.filas.length+1)*rh+gap; });
    Ht+=40;
    var cv=document.createElement('canvas'); cv.width=W*SC; cv.height=Ht*SC;
    var x=cv.getContext('2d'); x.scale(SC,SC); x.textBaseline='middle';
    var COL={'s-f':'#D9D9D9','s-v':'#DDEBF7','s-m':'#FFF2CC','s-d':'#FCE4D6','s-c':'#E2D9F3'};
    function ajust(tx,mw){ tx=String(tx); if(x.measureText(tx).width<=mw) return tx; while(tx.length>1&&x.measureText(tx+'…').width>mw) tx=tx.slice(0,-1); return tx+'…'; }
    function cell(cx,cy,w,h,bg,txt,al,font,col){
      x.fillStyle=bg; x.fillRect(cx,cy,w,h); x.strokeStyle='#cfd4da'; x.lineWidth=1; x.strokeRect(cx+.5,cy+.5,w-1,h-1);
      if(txt!==''&&txt!=null){ x.font=font; x.fillStyle=col||'#0B2E4F'; x.textAlign=al; x.fillText(ajust(txt,w-14),al==='center'?cx+w/2:(al==='right'?cx+w-8:cx+8),cy+h/2+1); }
    }
    x.fillStyle='#fff'; x.fillRect(0,0,W,Ht);
    x.fillStyle='#0B2E4F'; x.fillRect(0,0,W,62);
    x.fillStyle='#F4E9D4'; x.textAlign='left'; x.font='28px Anton, sans-serif';
    x.fillText('BARRA CHALACA — '+nombreLoc().toUpperCase(),PAD,32);
    x.fillStyle='#0B2E4F'; x.font='bold 15px "DM Sans", sans-serif';
    x.fillText('Horarios · Semana del '+f[0]+' al '+f[6],PAD,82);
    var y=top0;
    grupos.forEach(function(g){
      x.fillStyle='#E8492B'; x.fillRect(PAD,y,W-PAD*2,band);
      x.fillStyle='#fff'; x.textAlign='left'; x.font='20px Anton, sans-serif'; x.fillText(g.n,PAD+12,y+band/2+1); y+=band;
      var cx=PAD;
      [['N°',cN],['COLABORADOR',cC],['SECTOR',cS]].forEach(function(c){ cell(cx,y,c[1],hh,'#145C82',c[0],'center','12px Anton, sans-serif','#fff'); cx+=c[1]; });
      DIAS.forEach(function(n,i){
        cell(cx,y,cD,hh,'#145C82','','center');
        x.fillStyle='#fff'; x.textAlign='center'; x.font='12px Anton, sans-serif'; x.fillText(n.toUpperCase(),cx+cD/2,y+14);
        x.font='11px "DM Sans", sans-serif'; x.fillText(f[i],cx+cD/2,y+30); cx+=cD;
      });
      y+=hh;
      g.filas.forEach(function(r,i){
        var rx=PAD;
        cell(rx,y,cN,rh,'#F7F7F7',String(i+1),'center','12px "DM Sans", sans-serif','#5a6470'); rx+=cN;
        cell(rx,y,cC,rh,'#F7F7F7',r.c,'left','bold 13px "DM Sans", sans-serif'); rx+=cC;
        cell(rx,y,cS,rh,'#F7F7F7',r.s,'left','bold 12px "DM Sans", sans-serif'); rx+=cS;
        for(var k=0;k<7;k++){ var v=String(r.d[k]||''); cell(rx,y,cD,rh,COL[cls(v)]||'#fff',v,'center','13px "DM Sans", sans-serif'); rx+=cD; }
        y+=rh;
      });
      var tx=PAD;
      cell(tx,y,cN+cC+cS,rh,'#DDEBF7','PRESENTES / DÍA','right','14px Anton, sans-serif'); tx+=cN+cC+cS;
      for(var j=0;j<7;j++){ cell(tx,y,cD,rh,'#DDEBF7',String(g.filas.filter(function(r){ return pres(r.d[j]); }).length),'center','bold 14px "DM Sans", sans-serif'); tx+=cD; }
      y+=rh+gap;
    });
    var lg=[['#FFF2CC','Mañana (inicio ≤10 hs)'],['#FCE4D6','Mediodía (11-16 hs)'],['#E2D9F3','Cierre (≥17 hs)'],['#D9D9D9','Franco'],['#DDEBF7','Vacaciones']], lx=PAD;
    lg.forEach(function(l){
      x.fillStyle=l[0]; x.fillRect(lx,y+6,14,14); x.strokeStyle='#888'; x.strokeRect(lx+.5,y+6.5,13,13);
      x.fillStyle='#0B2E4F'; x.font='12px "DM Sans", sans-serif'; x.textAlign='left'; x.fillText(l[1],lx+20,y+14);
      lx+=20+x.measureText(l[1]).width+22;
    });
    var nombre='Horarios-'+nombreLoc()+'-'+H.lunes+(expSel()==='ambos'?'':'-'+expSel());
    if(kind==='png') cv.toBlob(function(b){ bajar(b,nombre+'.png'); },'image/png');
    else bajar(pdfDeJpeg(cv.toDataURL('image/jpeg',0.93),cv.width,cv.height),nombre+'.pdf');
  }

  /* ---------- guardado ---------- */
  var msgTimer=null;
  function fallo(err){
    H.msg=(err&&err.code==='invalid_argument')?'No tenés permiso para cambiar datos en esta vista.':'No se pudo guardar. Probá de nuevo en un momento.';
    if(err&&err.code==='invalid_argument') H.w=false;
    clearTimeout(msgTimer); msgTimer=setTimeout(function(){ H.msg=''; avisos(); },6000);
    render();
  }
  function guardar(){
    var d=ensure(); d.nombre=nombreLoc();
    if(H.db) H.db.doc('horarios/'+H.loc).set({nombre:d.nombre,filas:d.filas}).catch(fallo);
    var hh=histGet(); hh[H.loc+'|'+H.lunes]=JSON.parse(JSON.stringify(d.filas)); histSet(hh); window.dispatchEvent(new Event('hor-change'));
  }

  /* ---------- eventos ---------- */
  $('h-board').addEventListener('change',function(ev){
    var t=ev.target; if(!t.hasAttribute||!t.hasAttribute('data-r')||!H.w) return;
    var r=ensure().filas[+t.getAttribute('data-r')]; if(!r) return;
    var v=t.value.replace(/\s+/g,' ').trim();
    if(t.hasAttribute('data-f')){ var k=t.getAttribute('data-f'); if(k==='s') v=v.toUpperCase(); r[k]=v; }
    else { v=v.replace(/(\d)\s*A\s*(\d)/i,'$1 A $2').toUpperCase(); r.d[+t.getAttribute('data-c')]=v; t.parentNode.className=cls(v);
      var tt=totales(cur()); [].forEach.call(document.querySelectorAll('[data-tot]'),function(c){ c.textContent=tt[+c.getAttribute('data-tot')]; }); }
    t.value=v; guardar();
    if(t.getAttribute('data-f')==='c') renderBar();
  });
  var armTimer=null;
  $('h-board').addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b||!H.w) return;
    if(b.hasAttribute('data-add')){
      var d=ensure(); d.filas.push({c:'',s:'',a:H.area,d:['','','','','','','']}); guardar(); render();
      var ins=document.querySelectorAll('#h-board input[data-f="c"]'); if(ins.length) ins[ins.length-1].focus();
    } else if(b.hasAttribute('data-del')){
      var i=+b.getAttribute('data-del');
      if(H.armed!==i){ H.armed=i; clearTimeout(armTimer); armTimer=setTimeout(function(){ H.armed=null; render(); },4000); render(); return; }
      H.armed=null; ensure().filas.splice(i,1); guardar(); render();
    }
  });
  $('v-hor').addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b) return;
    if(b.hasAttribute('data-hl')){ H.loc=b.getAttribute('data-hl'); fixArea(); H.armed=null; try{ localStorage.setItem('barra-hloc',H.loc); }catch(e){} render(); }
    else if(b.hasAttribute('data-ha')){ H.area=b.getAttribute('data-ha'); H.armed=null; try{ localStorage.setItem('barra-harea',H.area); }catch(e){} render(); }
    else if(b.hasAttribute('data-v')){ H.vista=b.getAttribute('data-v'); H.armed=null; render(); }
    else if(b.hasAttribute('data-dia')){ H.dia=+b.getAttribute('data-dia'); render(); }
    else if(b.hasAttribute('data-exp')){ pedirArea(b.getAttribute('data-exp')); }
    else if(b.hasAttribute('data-copy')&&H.w){
      var hay=cur().filas.some(function(r){ return r.d.some(function(v){ return String(v).trim(); }); });
      if(hay&&!H.armCopy){ H.armCopy=true; clearTimeout(armTimer); armTimer=setTimeout(function(){ H.armCopy=false; render(); },4000); render(); return; }
      H.armCopy=false; copiar();
    }
  });
  $('v-hor').addEventListener('change',function(ev){
    var t=ev.target;
    if(t.id==='h-col'){ H.col=t.value; renderBoard(); }
    else if(t.id==='h-lunes'&&/^\d{4}-\d\d-\d\d$/.test(t.value)){
      var p=t.value.split('-'); cambiarSemana(iso(lunesDe(new Date(+p[0],+p[1]-1,+p[2]))));
    }
  });
  function tab(k){
    $('v-asis').hidden=k!=='asis'; $('v-hor').hidden=k!=='hor'; var va=$('v-adm'); if(va) va.hidden=k!=='adm'; var vi=$('v-inf'); if(vi) vi.hidden=k!=='inf';
    [].forEach.call(document.querySelectorAll('.tab'),function(b){ b.setAttribute('aria-selected',String(b.getAttribute('data-tab')===k)); });
    try{ localStorage.setItem('barra-tab',k); }catch(e){}
  }
  document.querySelector('.tabs').addEventListener('click',function(ev){ var b=ev.target.closest('.tab'); if(b) tab(b.getAttribute('data-tab')); });
  try{ if(localStorage.getItem('barra-tab')==='hor') tab('hor'); }catch(e){}

  /* ---------- datos ---------- */
  function onErr(){ H.ok=false; render(); }
  async function init(){
    var c=window.claude; if(!c||!c.use){ onErr(); return; }
    var db=await c.use('db'); if(!db){ onErr(); return; }
    H.db=db; H.ok=true;
    try{ var u=await c.use('user'); if(u){ var w=await u.can('data.write'); if(w===false) H.w=false; } }catch(e){}
    db.collection('horarios').onSnapshot(function(s){
      var nd={}; s.docs.forEach(function(x){ var v=x.data()||{}; nd[x.id]={nombre:String(v.nombre||''),filas:Array.isArray(v.filas)?v.filas.map(norm):[]}; });
      if(H.loaded&&JSON.stringify(nd)===JSON.stringify(H.data)) return;
      H.data=nd; H.loaded=true; window.__horData={}; Object.keys(nd).forEach(function(k){ window.__horData[k]=nd[k].filas; }); render(); window.dispatchEvent(new Event('hor-change'));
    },onErr);
    db.doc('config/semana').onSnapshot(function(s){
      var d=s.exists?s.data():null;
      if(d&&/^\d{4}-\d\d-\d\d$/.test(d.lunes||'')){ H.lunes=d.lunes; render(); window.dispatchEvent(new Event('hor-change')); }
    },function(){});
  }
  render();
  init().catch(onErr);
})();

</script>
<script>
(function(){
  function place(c){
    var pop=c.querySelector('.pop'); if(!pop) return;
    pop.classList.remove('up'); pop.style.transform='';
    var r=pop.getBoundingClientRect(), vh=window.innerHeight, vw=window.innerWidth;
    var up=c.getBoundingClientRect().top;
    if(r.bottom>vh-8 && up>vh-r.top){ pop.classList.add('up'); r=pop.getBoundingClientRect(); }
    var dx=0;
    if(r.right>vw-8) dx=vw-8-r.right; else if(r.left<8) dx=8-r.left;
    if(dx) pop.style.transform='translateX('+dx+'px)';
  }
  var b=document.getElementById('board');
  b.addEventListener('mouseover',function(e){ var c=e.target.closest('.cnt'); if(c) place(c); });
  b.addEventListener('focusin',function(e){ var c=e.target.closest('.cnt'); if(c) place(c); });
  new MutationObserver(function(){ var h=b.querySelector('.cnt:hover,.cnt:focus-within'); if(h) place(h); }).observe(b,{childList:true});
})();
</script>
